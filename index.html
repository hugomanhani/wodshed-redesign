// builds the DOM node for one section (warmup/skill/wod/core); returns null if that section isn't part of today's workout
const SECTION_START_LABELS = {warmup:'Warmup', skill:'Skill', wod:'WOD', core:'Core'};
const TIMER_KIND_NAMES = {AMRAP:'AMRAP', EMOM:'EMOM', TABATA:'Tabata', RFT:'Rounds for Time', LADDER:'For Time',
  FORTIME:'For Time', FORTIME_REPEATS:'For Time Repeats', INTERVAL:'Interval', COUNTDOWN:'Countdown'};
// "1:30" for a fractional interval at or past a minute, "2 min" for a whole one, "30 sec" under
// a minute — matches how the prescription text itself already phrases "Each 1:30" / "Each 2 min",
// while staying in plain words (not "0:30") for anything under 60 seconds
function fmtMinutesShort(minutes){
  const whole = Math.floor(minutes);
  const sec = Math.round((minutes - whole) * 60);
  if(whole===0 && sec) return `${sec} sec`;
  return sec ? `${whole}:${String(sec).padStart(2,'0')}` : `${whole} min`;
}
// the CTA names whichever timer will actually open — but stays a short, scannable phrase
// (kind + the one number that matters), never the verbose catalog scheme name like
// "RFT: Same Varying Reps" or "Alternate Movements per Interval"
function timerSpecShortLabel(spec){
  switch(spec.kind){
    case 'AMRAP':
      return spec.cycles ? `AMRAP ${spec.cycles}x${fmtMinutesShort(spec.minutes)}` : `AMRAP ${fmtMinutesShort(spec.minutes)}`;
    case 'EMOM':
      return spec.openEnded ? 'EMOM' : `EMOM ${fmtMinutesShort(spec.minutes)}`;
    case 'TABATA':
      return `Tabata ${spec.rounds}x`;
    case 'RFT':
      return `${spec.rounds} Rounds`;
    case 'LADDER':
      return `For Time ${spec.rungs.join('-')}`;
    case 'FORTIME':
      return 'For Time';
    case 'FORTIME_REPEATS':
      return `For Time x${spec.rounds}`;
    case 'INTERVAL':
      return spec.totalRounds ? `${fmtMinutesShort(spec.minutes)} x${spec.totalRounds}` : `${fmtMinutesShort(spec.minutes)} Timer`;
    case 'COUNTDOWN':
      return `Countdown ${fmtMinutesShort(spec.minutes)}`;
    default:
      return TIMER_KIND_NAMES[spec.kind] || spec.kind;
  }
}
function sectionStartLabel(key, w){
  if(!w) return `Start ${SECTION_START_LABELS[key]}`;
  const data = getSectionFocusData(w, key);
  const spec = data && data.timerSpec;
  if(!spec) return `Start ${SECTION_START_LABELS[key]}`;
  return `Start ${timerSpecShortLabel(spec)}`;
}
// the checkmark is a real toggle — marking a section undone also resets its inline round counter
// (if it has one) so the round button becomes tappable again instead of staying stuck on "Completed"
function toggleSectionDone(w, key){
  w.sectionsDone[key] = !w.sectionsDone[key];
  if(!w.sectionsDone[key] && w.roundCounts && w.roundCounts[key] != null){
    w.roundCounts[key] = 0;
  }
  render();
  maybePromptRating(w, key);
}
// drawers are for real timers only — a section with no timer (e.g. warmup) gets a plain round
// counter right on the card instead of opening one just to tap through rounds
function buildInlineRoundCounter(key, w, stepData){
  const target = parseRoundTarget(stepData.text);
  if(!w.roundCounts) w.roundCounts = {};
  if(w.roundCounts[key] == null) w.roundCounts[key] = 0;
  const count = w.roundCounts[key];
  const done = count >= target;
  const btn = document.createElement('button');
  btn.className = 'gw-section-round-btn';
  btn.disabled = done;
  btn.innerHTML = done
    ? `${ICON_CHECK}<span>Completed</span>`
    : `<span>Round</span><span class="gw-navmid-badge">${count}</span><span class="gw-round-target">/ ${target}</span>`;
  btn.onclick = ()=>{
    if(w.roundCounts[key] >= target) return;
    w.roundCounts[key]++;
    vibrate(15);
    if(w.roundCounts[key] >= target){
      w.sectionsDone[key] = true;
      vibrate([80,40,120]);
      render();
      maybePromptRating(w, key);
      return;
    }
    render();
  };
  return btn;
}
function addStartSectionButton(node, key){
  const w = state.currentWorkout;
  const stepData = w && getSectionFocusData(w, key);
  if(!stepData) return;
  if(w.sectionsDone && w.sectionsDone[key]){
    const doneBtn = document.createElement('button');
    doneBtn.className = 'gw-section-round-btn';
    doneBtn.disabled = true;
    doneBtn.innerHTML = `${ICON_CHECK}<span>Completed</span>`;
    node.bodyEl.appendChild(doneBtn);
  } else if(focusTimer && focusTimer.sectionKey===key && !focusTimer.doneBeeped){
    // minimized but still running in the background — reopen it as-is, no fresh start
    const btn = document.createElement('button');
    btn.className = 'gw-section-start-btn';
    btn.innerHTML = `${ICON_TIMER}<span>${sectionStartLabel(key, w).replace(/^Start /, 'Resume ')}</span>`;
    btn.onclick = ()=>resumeSectionFocus(key);
    node.bodyEl.appendChild(btn);
  } else if(stepData.timerSpec){
    const btn = document.createElement('button');
    btn.className = 'gw-section-start-btn';
    btn.innerHTML = `${ICON_TIMER}<span>${sectionStartLabel(key, w)}</span>`;
    btn.onclick = ()=>openSectionFocus(key);
    node.bodyEl.appendChild(btn);
  } else {
    node.bodyEl.appendChild(buildInlineRoundCounter(key, w, stepData));
  }
}

function renderSectionNode(key, w, opts){
  opts = opts || {};
  if(key==='warmup'){
    if(!w.warmup) return null;
    const node = sectionWithChips('Warm-Up', w.warmup, DAY_TYPES.find(d=>d.key===w.type).label, {
      onReroll: opts.simple ? null : ()=>rerollSection('warmup'),
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'warmup'),
      isDone: !!w.sectionsDone.warmup
    });
    node.finalize();
    addStartSectionButton(node, 'warmup');
    return node;
  }
  if(key==='skill'){
    if(!w.skillTplText) return null;
    const node = sectionWithChips('Skill', w.skillTplText, w.deload ? 'DELOAD' : (w.bw ? 'BODYWEIGHT' : ''), {
      onReroll: opts.simple ? null : ()=>rerollSection('skill'),
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'skill'),
      isDone: !!w.sectionsDone.skill,
      timerSpec: w.skillTimer,
      setsList: w.skillSetReps,
      setsWeights: w.skillLiftKey ? w.skillSetWeights : null,
      onWeightChange: opts.simple ? null : (idx, val)=>{
        for(let i=idx; i<w.skillSetWeights.length; i++) w.skillSetWeights[i] = val;
        w.suggestedLoad = w.skillSetWeights[w.skillSetWeights.length-1]; // logged/progression value tracks the last set
      },
      // reps don't cascade like weight does — a prescribed range (e.g. "8-10") or a ladder is
      // often intentionally different set to set, so editing one set only touches that set
      onRepsChange: opts.simple ? null : (idx, val)=>{
        w.skillSetReps[idx] = val;
        w.skillTplText = updateSkillSchemeText(w.skillTplText, w.skillSetReps);
        render();
      },
      onSetsDelta: opts.simple ? null : (d)=>adjustSets('skill', d)
    });
    const deloadNote = buildDeloadNote(w);
    if(deloadNote) node.bodyEl.appendChild(deloadNote);
    node.finalize();
    addStartSectionButton(node, 'skill');
    return node;
  }
  if(key==='wod'){
    return renderWodSection(w);
  }
  if(key==='core'){
    if(!w.core) return null;
    const node = sectionWithChips('Extra Core', w.core, '', {
      onReroll: opts.simple ? null : ()=>rerollSection('core'),
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'core'),
      isDone: !!w.sectionsDone.core,
      timerSpec: w.coreTimer
    });
    node.finalize();
    addStartSectionButton(node, 'core');
    return node;
  }
  return null;
}

function buildRateBlock(labelText, currentVal, onPick){
  const block = document.createElement('div');
  block.className = 'gw-rate-block';
  const lbl = document.createElement('div');
  lbl.className = 'gw-rate-label';
  lbl.textContent = labelText;
  block.appendChild(lbl);
  const optsRow = document.createElement('div');
  optsRow.className = 'gw-rate-options';
  ['easy','right','hard'].forEach(r=>{
    const b = mkBtn(RPE_LABELS[r], currentVal===r ? 'gw-primary' : 'gw-btn', ()=>onPick(r));
    optsRow.appendChild(b);
  });
  block.appendChild(optsRow);
  return block;
}

// "How did it feel?" pops up as its own drawer right when a section is marked done, instead of
// sitting as a permanent block at the bottom of the page
function openRateDrawer(kind){
  const w = state.currentWorkout;
  if(!w) return;
  const content = document.getElementById('gw-rate-drawer-content');
  content.innerHTML = '';
  const label = kind==='wod' ? 'How did the WOD feel?' : `How did ${LIFT_LABELS[w.skillLiftKey]} feel?`;
  content.appendChild(buildRateBlock(label, kind==='wod' ? w.wodRpe : w.rpe, (r)=>{
    if(kind==='wod') w.wodRpe = r; else w.rpe = r;
    closeRateDrawer();
    render();
  }));
  document.getElementById('gw-rate-drawer-backdrop').classList.add('show');
}
function closeRateDrawer(){
  document.getElementById('gw-rate-drawer-backdrop').classList.remove('show');
}
document.getElementById('gw-rate-drawer-backdrop').onclick = (e)=>{ if(e.target.id==='gw-rate-drawer-backdrop') closeRateDrawer(); };
// call right after a section flips to done — opens the matching rate drawer if that rating is still missing
function maybePromptRating(w, key){
  if(!w || !w.sectionsDone || !w.sectionsDone[key]) return;
  if(key==='wod' && w.wodRpe==null){ openRateDrawer('wod'); return; }
  if(key==='skill' && w.skillLiftKey && w.rpe==null){ openRateDrawer('skill'); return; }
}

// builds the Log & Save button; the ratings themselves live in the rate drawer, triggered on completion
function renderRatingAndLogBlock(container, w, onChange){
  const logBtn = mkBtn('Log & Save to History', 'gw-teal', ()=>logWorkout());
  const missingRating = (w.skillLiftKey && !w.rpe) || !w.wodRpe;
  logBtn.disabled = missingRating;
  container.appendChild(logBtn);
  if(missingRating){
    const hint = document.createElement('div');
    hint.style.cssText = 'width:100%; font-size:11.5px; color:var(--coral); text-align:center; font-weight:700; text-decoration:underline; cursor:pointer;';
    hint.textContent = w.skillLiftKey && !w.rpe && !w.wodRpe
      ? "Rate the lift and the WOD to save this session."
      : (w.skillLiftKey && !w.rpe ? "Rate the lift to save this session." : "Rate the WOD to save this session.");
    hint.onclick = ()=>{
      if(w.skillLiftKey && !w.rpe) openRateDrawer('skill');
      else if(!w.wodRpe) openRateDrawer('wod');
    };
    container.appendChild(hint);
  }
}

// ---------- Section Focus ----------
function getSectionFocusData(w, key){
  w.wodText = buildWodText(w.format, w.wodMovements);
  const defs = {
    warmup: {label:'Warm-Up', text: w.warmup},
    skill: {label:'Skill', text: w.skillTplText},
    wod: {label:'WOD', text: w.wodText},
    core: {label:'Extra Core', text: w.core}
  };
  const d = defs[key];
  if(!d) return null;
  const explicitSpec = key==='core' ? w.coreTimer : (key==='wod' ? w.wodTimerSpec : (key==='skill' ? w.skillTimer : null));
  const timerSpec = explicitSpec || parseTimerFromText(d.text);
  return {key, label: d.label, text: d.text, timerSpec};
}
function openSectionFocus(key){
  if(!state.currentWorkout) return;
  // a different section's timer minimized in the background gets abandoned when starting a fresh one —
  // only one timer session can run at a time
  if(focusTimer && focusTimer.sectionKey!==key){
    focusStopTicking();
    focusTimer = null;
  }
  state.focusMode = true;
  state.focusSectionKey = key;
  state.focusTapCount = 0;
  state.focusAscendingTotal = 0;
  state.focusAmrepsTotal = 0;
  state.focusSplits = [];
  document.getElementById('gw-timer-drawer-backdrop').classList.add('show');
  renderSectionFocus();
}
function closeTimerDrawer(){
  state.focusMode = false;
  focusStopTicking();
  focusTimer = null;
  document.getElementById('gw-timer-drawer-backdrop').classList.remove('show');
}
function cancelTimerAndClose(){
  document.getElementById('gw-timerstop-backdrop').classList.remove('show');
  focusStopTicking();
  focusReset();
  focusUpdateDisplay();
  focusUpdateButtonStates();
}
function requestCloseFloatCard(){
  if(focusTimer && (focusTimer.running || focusTimer.elapsedBefore > 0) && !focusTimer.doneBeeped){
    document.getElementById('gw-timerstop-backdrop').classList.add('show');
  }
}
function cancelCloseFloatCard(){
  document.getElementById('gw-timerstop-backdrop').classList.remove('show');
}
// the X (and tapping the backdrop) never asks to confirm anymore — a timer that's still going
// just minimizes so the athlete can glance at the workout, while a finished one has nothing left
// to resume, so it closes outright
function requestExitFocus(){
  if(focusTimer && !focusTimer.doneBeeped){
    minimizeTimerDrawer();
  } else {
    confirmExitFocus();
  }
}
// hides the drawer but leaves focusTimer running in the background — its own tick loop keeps
// going (and will still auto-finish the section) even while the drawer isn't on screen
function minimizeTimerDrawer(){
  document.getElementById('gw-timer-drawer-backdrop').classList.remove('show');
  state.focusMode = false;
  render();
}
// re-opens the drawer on the timer that's already running in the background, without touching
// focusTimer or any of its accumulated progress (see the isResume guard in renderSectionFocus)
function resumeSectionFocus(key){
  if(!state.currentWorkout) return;
  state.focusMode = true;
  state.focusSectionKey = key;
  document.getElementById('gw-timer-drawer-backdrop').classList.add('show');
  renderSectionFocus();
}
function confirmExitFocus(){
  const key = state.focusSectionKey;
  const w = state.currentWorkout;
  closeTimerDrawer();
  render();
  maybePromptRating(w, key);
}

      </div>
      <button class="gw-showworkout-toggle" id="gw-floatcard-close" type="button">Cancel timer</button>`;
    container.appendChild(card);

    if(key==='skill' && w.skillLiftKey){
      const weightRow = document.getElementById('gw-stage-weight');
      weightRow.style.display = '';
      const valueEl = document.getElementById('gw-weight-value');
      const platesEl = document.getElementById('gw-weight-plates');
      const paint = ()=>{ valueEl.textContent = w.suggestedLoad; platesEl.textContent = plateBreakdown(w.suggestedLoad); };
      paint();
      document.getElementById('gw-weight-minus').onclick = ()=>{ w.suggestedLoad = Math.max(0, w.suggestedLoad-5); paint(); vibrate(10); };
      document.getElementById('gw-weight-plus').onclick = ()=>{ w.suggestedLoad += 5; paint(); vibrate(10); };
    }

    const isAmreps = kind==='AMRAP' && spec.mode==='reps';
    const isAscending = kind==='AMRAP' && spec.mode==='ascending';
    const isAlternate = (kind==='EMOM' || kind==='TABATA') && spec.alternate;

    if((kind==='AMRAP' && !isAmreps) || kind==='RFT' || kind==='LADDER' || kind==='FORTIME_REPEATS'){
      card.querySelector('#gw-focus-plus').style.display = '';
    }
    if(kind==='INTERVAL'){
      card.querySelector('#gw-floatcard-next').style.display = '';
    }
    if(kind==='FORTIME_REPEATS') document.getElementById('gw-focus-plus-label').textContent = 'Round Done';
    if(isAmreps){
      card.querySelector('#gw-floatcard-amreps').style.display = '';
    }
    if(isAlternate){
      const altRow = card.querySelector('#gw-focus-altrow');
      altRow.style.display = 'flex';
      card.querySelector('#gw-focus-alt-a').textContent = spec.alternate[0];
      card.querySelector('#gw-focus-alt-b').textContent = spec.alternate[1];
    }
    if(isAscending) document.getElementById('gw-focus-plus-label').textContent = `+${spec.increment}`;

    const roundCap = (kind==='RFT') ? spec.rounds : (kind==='LADDER' ? spec.rungs.length : (kind==='FORTIME_REPEATS' ? spec.rounds : null));
    if(roundCap) document.getElementById('gw-focus-round-target').textContent = `/ ${roundCap}`;
    if(isResume){
      document.getElementById('gw-focus-roundsbadge').textContent = isAscending ? (state.focusAscendingTotal||0) : state.focusTapCount;
      if(roundCap && state.focusTapCount >= roundCap) document.getElementById('gw-focus-plus').disabled = true;
    }

    document.getElementById('gw-focus-plus').onclick = ()=>{
      if(roundCap && state.focusTapCount >= roundCap) return;
      state.focusTapCount++;
      if(isAscending){
        state.focusAscendingTotal = (state.focusAscendingTotal||0) + (spec.startReps + (state.focusTapCount-1)*spec.increment);
      }
      if(key==='wod'){
        if(!w.wodPerformance) w.wodPerformance = {};
        w.wodPerformance.rounds = state.focusTapCount;
        if(isAscending) w.wodPerformance.extraReps = state.focusAscendingTotal;
      }
      document.getElementById('gw-focus-roundsbadge').textContent = isAscending ? (state.focusAscendingTotal||0) : state.focusTapCount;
      document.getElementById('gw-focus-plus').classList.add('gw-tap-flash');
      setTimeout(()=>document.getElementById('gw-focus-plus').classList.remove('gw-tap-flash'), 120);
      vibrate(15);
      logRoundTap(focusCurrentElapsed());
      if(roundCap && state.focusTapCount >= roundCap){
        // last prescribed round just got logged — this finishes the WOD, same as swiping to finish
        focusManualFinish(key);
        document.getElementById('gw-focus-plus').disabled = true;
      } else {
        if(kind==='FORTIME_REPEATS' && focusTimer) focusTimer.restUntil = focusCurrentElapsed() + spec.restSeconds;
        focusUpdateDisplay();
      }
    };
    document.getElementById('gw-focus-skipnext').onclick = focusSkipToNextRound;
    document.getElementById('gw-floatcard-playpause').onclick = focusToggleFromTap;
    document.getElementById('gw-floatcard-close').onclick = requestCloseFloatCard;
    if(isAmreps){
      if(!isResume) state.focusAmrepsTotal = 0;
      document.getElementById('gw-amreps-total').textContent = state.focusAmrepsTotal || 0;
      const bump = (delta)=>{
        state.focusAmrepsTotal = Math.max(0, (state.focusAmrepsTotal||0) + delta);
        document.getElementById('gw-amreps-total').textContent = state.focusAmrepsTotal;
        if(key==='wod'){ if(!w.wodPerformance) w.wodPerformance = {}; w.wodPerformance.extraReps = state.focusAmrepsTotal; }
        vibrate(10);
      };
      document.getElementById('gw-amreps-plus').onclick = ()=>bump(1);
      document.getElementById('gw-amreps-minus').onclick = ()=>bump(-1);
    }

    // RFT / LADDER / uncapped FOR TIME / open-ended EMOM end on the athlete's own judgment — swipe locks it in
    if(((kind==='RFT' || kind==='FORTIME' || kind==='LADDER') && !spec.cap) || (kind==='EMOM' && spec.openEnded)){
      const swipeZone = document.createElement('div');
      swipeZone.className = 'gw-focus-swipezone';
      swipeZone.id = 'gw-focus-swipezone';
      swipeZone.innerHTML = `<div class="gw-focus-swipe-track">
          <div class="gw-focus-swipe-fill" id="gw-focus-swipe-fill"></div>
          <span>Swipe to finish</span>
          <div class="gw-focus-swipe-thumb" id="gw-focus-swipe-thumb">${ICON_PLAY}</div>
        </div>`;
      container.appendChild(swipeZone);
      wireSwipeToFinish(swipeZone, key);
    }

    if(isResume){
      focusUpdateDisplay();
      focusUpdateButtonStates();
    } else {
      focusOpenTimer(spec, key);
    }
  } else {
    // the only way to reach the drawer is via a Start button gated on stepData.timerSpec — this shouldn't happen
    state.focusMode = false;
    render();
  }
}

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

function wireSwipeToFinish(zone, stepKey){
  const track = zone.querySelector('.gw-focus-swipe-track');
  const thumb = zone.querySelector('.gw-focus-swipe-thumb');
  const fill = document.getElementById('gw-focus-swipe-fill');
  const THUMB_SIZE = 44, EDGE_GAP = 6;
  let dragging = false, startX = 0, maxTravel = 1;
  function onDown(e){
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    maxTravel = Math.max(1, track.getBoundingClientRect().width - THUMB_SIZE - EDGE_GAP*2);
  }
  function onMove(e){
    if(!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const delta = Math.max(0, Math.min(maxTravel, x - startX));
    thumb.style.transform = `translateX(${delta}px)`;
    fill.style.width = (delta + THUMB_SIZE) + 'px';
    if(delta / maxTravel > 0.85){ finishSwipe(); }
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    thumb.style.transform = 'translateX(0)';
    fill.style.width = '0%';
  }
  function finishSwipe(){
    dragging = false;
    thumb.style.transform = `translateX(${maxTravel}px)`;
    fill.style.width = '100%';
    focusManualFinish(stepKey);
  }
  thumb.addEventListener('touchstart', onDown, {passive:true});
  thumb.addEventListener('touchmove', onMove, {passive:true});
  thumb.addEventListener('touchend', onUp);
  thumb.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

// a finished timer has nothing left to resume, so it closes itself — deferred a beat so the
// "Completed" state/toast is visible for a moment first, and deferred (not synchronous) because
// focusFinish() calls this from inside focusUpdateDisplay(), which still touches focusTimer's
// fields after the fact — nulling it out mid-call would throw
function focusAutoCloseAndRate(key){
  setTimeout(()=>{
    const w = state.currentWorkout;
    closeTimerDrawer();
    render();
    maybePromptRating(w, key);
  }, 1000);
}
function focusManualFinish(stepKey){
  if(!focusTimer) return;
  focusTimer.elapsedBefore = focusCurrentElapsed();
  focusTimer.running = false;
  cancelAnimationFrame(focusTimer.raf);
  focusTimer.doneBeeped = true;
  const w = state.currentWorkout;
  if(stepKey==='wod' && w){
    if(!w.wodPerformance) w.wodPerformance = {};
    w.wodPerformance.time = fmtClock(Math.floor(focusTimer.elapsedBefore));
  }
  if(w && w.sectionsDone) w.sectionsDone[stepKey] = true;
  beepTriple();
  vibrate([80,40,80,40,160]);
  focusUpdateDisplay();
  focusUpdateButtonStates();
  state.focusStepDone[stepKey] = true;
  focusAutoCloseAndRate(stepKey);
}

// independent timer engine for Focus Mode (mirrors the modal's logic but keeps its own state,
// so opening the section-timer modal separately never conflicts with an in-progress Focus Mode timer)
let focusTimer = null;
function focusCurrentElapsed(){
  if(!focusTimer) return 0;
  const running = focusTimer.running ? (performance.now() - focusTimer.startedAt)/1000 : 0;
  return focusTimer.elapsedBefore + running;
}
function focusOpenTimer(spec, sectionKey){
  focusTimer = { ...spec, running:false, startedAt:null, elapsedBefore:0, lastBeepUnit:-1, lastPhaseKey:null, lastTickSecond:null, doneBeeped:false, halfwayBeeped:false, leadIn:false, sectionKey };
  focusUpdateDisplay();
  focusUpdateButtonStates();
}
function focusMaybeTick(secondsRemaining){
  if(!focusTimer || !focusTimer.running) return;
  const whole = Math.ceil(secondsRemaining);
  if(whole>=1 && whole<=3 && whole !== focusTimer.lastTickSecond){
    tickBeep();
    vibrate(20);
    focusTimer.lastTickSecond = whole;
  } else if(whole>3){
    focusTimer.lastTickSecond = null;
  }
}
function focusFinish(){
  if(focusTimer && !focusTimer.doneBeeped){
    focusTimer.doneBeeped = true;
    focusTimer.running = false;
    beepTriple();
    vibrate([100,60,100,60,200]);
    focusUpdateButtonStates();
    if(focusTimer.sectionKey){
      state.focusStepDone[focusTimer.sectionKey] = true;
      const w = state.currentWorkout;
      if(w && w.sectionsDone) w.sectionsDone[focusTimer.sectionKey] = true;
      if(focusTimer.sectionKey==='wod' && w){
        if(!w.wodPerformance) w.wodPerformance = {};
        if(focusTimer.kind==='FORTIME' || focusTimer.kind==='RFT' || focusTimer.kind==='LADDER' || focusTimer.kind==='FORTIME_REPEATS'){
          w.wodPerformance.time = fmtClock(Math.floor(focusCurrentElapsed()));
        }
      }
    }
    focusAutoCloseAndRate(focusTimer.sectionKey);
  }
}
function focusTick(){
  if(!focusTimer || !focusTimer.running) return;
  focusUpdateDisplay();
  focusTimer.raf = requestAnimationFrame(focusTick);
}
function focusStopTicking(){
  if(focusTimer) cancelAnimationFrame(focusTimer.raf);
}
// "3-2-1-go" lead-in before the very first start of a fresh timer — matches how a real class starts a clock
function focusStartWithLeadIn(){
  if(!focusTimer || focusTimer.running || focusTimer.leadIn) return;
  const freshStart = focusTimer.elapsedBefore===0 && !focusTimer.doneBeeped;
  if(!freshStart){ focusStart(); return; }
  focusTimer.leadIn = true;
  const myTimer = focusTimer;
  const numberEl = document.getElementById('gw-focus-number');
  const seq = ['3','2','1','GO'];
  let i = 0;
  function step(){
    if(focusTimer !== myTimer) return;
    if(numberEl) numberEl.textContent = seq[i];
    if(seq[i]==='GO') beepTriple(); else tickBeep();
    vibrate(seq[i]==='GO' ? [80,40,120] : 30);
    i++;
    if(i < seq.length){ setTimeout(step, 700); }
    else { setTimeout(()=>{ if(focusTimer===myTimer){ focusTimer.leadIn = false; focusStart(); } }, 500); }
  }
  step();
}
function focusToggleFromTap(){
  if(!focusTimer || focusTimer.leadIn) return;
  if(focusTimer.running) focusPause();
  else if(focusTimer.elapsedBefore > 0) focusStart();
  else focusStartWithLeadIn();
}
// jumps straight to the next TABATA phase boundary (work->rest or rest->work), tapped from the "Skip rest" link
// lets the athlete manually skip ahead to the next rest interval instead of waiting for it to elapse naturally
function focusSkipToNextRound(){
  if(!focusTimer || focusTimer.kind!=='INTERVAL') return;
  const cycle = focusTimer.minutes*60;
  const elapsed = focusCurrentElapsed();
  const currentUnit = Math.floor(elapsed/cycle);
  const nextBoundary = (currentUnit+1)*cycle;
  focusTimer.elapsedBefore = nextBoundary;
  focusTimer.startedAt = focusTimer.running ? performance.now() : null;
  focusUpdateDisplay();
  vibrate(20);
}
function focusStart(){
  if(!focusTimer || focusTimer.running) return;
  focusTimer.running = true;
  focusTimer.startedAt = performance.now();
  focusTimer.doneBeeped = false;
  cancelAnimationFrame(focusTimer.raf);
  focusTick();
  focusUpdateButtonStates();
  vibrate(25);
}
function focusPause(){
  if(!focusTimer || !focusTimer.running) return;
  focusTimer.elapsedBefore = focusCurrentElapsed();
  focusTimer.running = false;
  cancelAnimationFrame(focusTimer.raf);
  focusUpdateDisplay();
  focusUpdateButtonStates();
  vibrate(25);
}
function focusReset(){
  if(!focusTimer) return;
  cancelAnimationFrame(focusTimer.raf);
  focusTimer.running = false; focusTimer.startedAt = null; focusTimer.elapsedBefore = 0;
  focusTimer.lastBeepUnit = -1; focusTimer.lastPhaseKey = null; focusTimer.lastTickSecond = null;
  focusTimer.doneBeeped = false; focusTimer.halfwayBeeped = false; focusTimer.leadIn = false;
  focusUpdateDisplay();
  focusUpdateButtonStates();
}
function focusUpdateButtonStates(){
  if(!focusTimer) return;
  const playPauseBtn = document.getElementById('gw-floatcard-playpause');
  if(!playPauseBtn || focusTimer.leadIn) return;
  playPauseBtn.innerHTML = focusTimer.running ? ICON_PAUSE : ICON_PLAY;
  // once the timer is done there's nothing left to play/pause — say so, plainly, wherever the round button is
  playPauseBtn.disabled = focusTimer.doneBeeped;
  const roundBtn = document.getElementById('gw-focus-plus');
  if(roundBtn && focusTimer.doneBeeped){
    roundBtn.disabled = true;
    roundBtn.innerHTML = `${ICON_CHECK}<span>Completed</span>`;
  }
}
function focusUpdateDisplay(){
  if(!focusTimer || focusTimer.leadIn) return;
  const numberEl = document.getElementById('gw-focus-number');
  const subEl = document.getElementById('gw-focus-sub');
  const phaseEl = document.getElementById('gw-focus-phase');
  const ring = document.getElementById('gw-focus-ring');
  const stage = document.getElementById('gw-focus-stage');
  const secondaryEl = document.getElementById('gw-focus-secondary');
  if(!numberEl) return;
  const elapsed = focusCurrentElapsed();
  const CIRC = 2*Math.PI*34;
  let displaySeconds = 0, warn = false, fraction = 1, isRest = false, phaseWordUsed = false, secondaryUsed = false;
  // frac = fraction of the current phase REMAINING (1 at phase start, 0 at phase end).
  // The dial fills as time elapses (matches a class-clock look), so we draw the complement of frac.
  // frac = fraction of the current phase remaining (1 at phase start, 0 at phase end) — the ring depletes as time passes.
  function setRing(frac){ if(ring) ring.style.strokeDashoffset = String(CIRC * (1-Math.max(0,Math.min(1,frac)))); }

  if(focusTimer.kind==='AMRAP' && focusTimer.cycles){
    const workSec = focusTimer.minutes*60, restSec = (focusTimer.restMinutes||0)*60, cycleLen = workSec+restSec;
    const totalDuration = focusTimer.cycles*cycleLen - restSec;
    const clamped = Math.min(elapsed, totalDuration);
    const cycleIdx = Math.min(Math.floor(clamped/cycleLen), focusTimer.cycles-1);
    const withinCycle = clamped - cycleIdx*cycleLen;
    isRest = withinCycle >= workSec;
    const phaseSecTotal = isRest ? restSec : workSec;
    const phaseElapsed = isRest ? withinCycle-workSec : withinCycle;
    displaySeconds = phaseSecTotal - phaseElapsed;
    fraction = phaseSecTotal>0 ? displaySeconds/phaseSecTotal : 0;
    const phaseKey = cycleIdx+'-'+(isRest?'rest':'work');
    if(phaseKey !== focusTimer.lastPhaseKey && focusTimer.running){ switchBeep(); focusTimer.lastPhaseKey = phaseKey; }
    phaseEl.textContent = isRest ? 'REST' : 'AMRAP';
    phaseWordUsed = true;
    subEl.textContent = `Interval ${cycleIdx+1} of ${focusTimer.cycles}` + (isRest ? ' — rest, get ready to go again' : '');
    if(elapsed >= totalDuration){ warn=true; fraction=0; focusFinish(); displaySeconds=0; }
    else if(displaySeconds<=3) warn=true;
    focusMaybeTick(displaySeconds);
    setRing(fraction);

  } else if(focusTimer.kind==='AMRAP' || focusTimer.kind==='COUNTDOWN'){
    const total = focusTimer.minutes*60;
    displaySeconds = total - elapsed;
    if(focusTimer.kind==='AMRAP' && !focusTimer.halfwayBeeped && elapsed >= total/2 && focusTimer.running){
      focusTimer.halfwayBeeped = true; switchBeep(); vibrate(40);
    }
    if(displaySeconds<=0){ displaySeconds=0; warn=true; fraction=0; focusFinish(); }
    else { if(displaySeconds<=10) warn=true; focusMaybeTick(displaySeconds); fraction = total>0 ? displaySeconds/total : 0; }
    setRing(fraction);
    if(focusTimer.kind==='AMRAP'){
      subEl.textContent = focusTimer.mode==='ascending'
        ? `Next round: ${focusTimer.startReps + state.focusTapCount*focusTimer.increment} reps`
        : focusTimer.mode==='reps' ? `${fmtMinutesShort(focusTimer.minutes)} — rack up total reps`
        : `${fmtMinutesShort(focusTimer.minutes)} AMRAP — counts down`;
    } else {
      subEl.textContent = `${fmtMinutesShort(focusTimer.minutes)} countdown`;
    }

  } else if(focusTimer.kind==='EMOM'){
    const total = focusTimer.openEnded ? null : focusTimer.minutes*60;
    const clamped = total!=null ? Math.min(elapsed, total) : elapsed;
    const unit = Math.floor(clamped/60);
    const withinMinute = clamped - unit*60;
    displaySeconds = 60 - withinMinute;
    fraction = displaySeconds/60;
    if(focusTimer.alternate){
      const which = unit % 2;
      subEl.textContent = `Minute ${unit+1}${total!=null?` of ${focusTimer.minutes}`:''} — ${which===0?'ODD':'EVEN'}: ${focusTimer.alternate[which]}`;
      const chipA = document.getElementById('gw-focus-alt-a'), chipB = document.getElementById('gw-focus-alt-b');
      if(chipA && chipB){ chipA.classList.toggle('gw-alt-active', which===0); chipB.classList.toggle('gw-alt-active', which===1); }
    } else if(focusTimer.openEnded){
      subEl.textContent = `Minute ${unit+1} — go until you can't hold the pace`;
    } else {
      subEl.textContent = `Minute ${Math.min(unit+1, focusTimer.minutes)} of ${focusTimer.minutes}`;
    }
    if(secondaryEl) secondaryEl.textContent = total!=null ? `Workout time left: ${fmtClock(Math.max(0,total-clamped))}` : `Total elapsed: ${fmtClock(elapsed)}`;
    secondaryUsed = true;
    const unitCap = total!=null ? focusTimer.minutes : Infinity;
    if(unit > focusTimer.lastBeepUnit && unit < unitCap && focusTimer.running){ switchBeep(); vibrate([60,40,60]); focusTimer.lastBeepUnit = unit; }
    if(total!=null && elapsed >= total){ warn=true; fraction=0; focusFinish(); displaySeconds=0; }
    else { if(displaySeconds<=3) warn=true; focusMaybeTick(displaySeconds); }
    setRing(fraction);

  } else if(focusTimer.kind==='INTERVAL'){
    const cycle = focusTimer.minutes*60;
    const nextPreviewEl = document.getElementById('gw-floatcard-nextpreview');
    if(focusTimer.totalRounds){
      const totalDuration = cycle*focusTimer.totalRounds;
      const clamped = Math.min(elapsed, totalDuration);
      const unit = Math.floor(clamped/cycle);
      const withinUnit = clamped - unit*cycle;
      displaySeconds = cycle - withinUnit;
      fraction = displaySeconds/cycle;
      subEl.textContent = `Rest after set ${Math.min(unit+1, focusTimer.totalRounds)} of ${focusTimer.totalRounds}`;
      if(nextPreviewEl) nextPreviewEl.textContent = unit+1 < focusTimer.totalRounds ? `Set ${unit+2}` : 'Finish';
      if(unit > focusTimer.lastBeepUnit && unit < focusTimer.totalRounds && focusTimer.running){ switchBeep(); focusTimer.lastBeepUnit = unit; }
      if(elapsed >= totalDuration){ warn=true; fraction=0; focusFinish(); displaySeconds=0; }
      else if(displaySeconds<=3) warn=true;
      focusMaybeTick(displaySeconds);
    } else {
      const unit = Math.floor(elapsed/cycle);
      const withinUnit = elapsed - unit*cycle;
      displaySeconds = cycle - withinUnit;
      fraction = displaySeconds/cycle;
      subEl.textContent = `Round ${unit+1} — beeps each time it resets`;
      if(nextPreviewEl) nextPreviewEl.textContent = `Round ${unit+2}`;
      if(unit > focusTimer.lastBeepUnit && focusTimer.running){ switchBeep(); focusTimer.lastBeepUnit = unit; }
      if(displaySeconds<=3) warn=true;
      focusMaybeTick(displaySeconds);
    }
    setRing(fraction);

  } else if(focusTimer.kind==='TABATA'){
    const cycle = focusTimer.workSec + focusTimer.restSec;
    const totalDuration = cycle*focusTimer.rounds;
    const clamped = Math.min(elapsed, totalDuration);
    const roundIdx = Math.min(Math.floor(clamped/cycle), focusTimer.rounds-1);
    const withinCycle = clamped - roundIdx*cycle;
    isRest = withinCycle >= focusTimer.workSec;
    const phaseSecTotal = isRest ? focusTimer.restSec : focusTimer.workSec;
    const phaseElapsed = isRest ? withinCycle - focusTimer.workSec : withinCycle;
    displaySeconds = phaseSecTotal - phaseElapsed;
    fraction = phaseSecTotal>0 ? displaySeconds/phaseSecTotal : 0;
    const phaseKey = roundIdx+'-'+(isRest?'rest':'work');
    if(phaseKey !== focusTimer.lastPhaseKey && focusTimer.running){ switchBeep(); focusTimer.lastPhaseKey = phaseKey; }
    phaseEl.textContent = isRest ? 'REST' : (focusTimer.alternate ? focusTimer.alternate[roundIdx % 2] : 'WORK');
    phaseEl.classList.toggle('rest', isRest);
    phaseWordUsed = true;
    subEl.textContent = `Round ${roundIdx+1} of ${focusTimer.rounds}`;
    if(focusTimer.alternate){
      const altRow = document.getElementById('gw-focus-altrow');
      if(altRow){
        const chipA = document.getElementById('gw-focus-alt-a'), chipB = document.getElementById('gw-focus-alt-b');
        chipA.classList.toggle('gw-alt-active', !isRest && roundIdx%2===0);
        chipB.classList.toggle('gw-alt-active', !isRest && roundIdx%2===1);
      }
    }
    if(elapsed >= totalDuration){ warn=true; fraction=0; focusFinish(); displaySeconds=0; }
    else if(displaySeconds<=3) warn=true;
    focusMaybeTick(displaySeconds);
    setRing(fraction);

  } else if(focusTimer.kind==='LADDER'){
    displaySeconds = elapsed;
    if(focusTimer.cap){
      const capSec = focusTimer.cap*60;
      fraction = Math.max(0, 1 - elapsed/capSec);
      if(elapsed >= capSec){ warn = true; focusFinish(); }
    } else {
      fraction = 1;
    }
    setRing(fraction);
    const rungs = focusTimer.rungs;
    const roundIdx = Math.min(state.focusTapCount, rungs.length-1);
    subEl.textContent = state.focusTapCount >= rungs.length
      ? `All ${rungs.length} rounds done`
      : `Round ${roundIdx+1} of ${rungs.length} — ${rungs[roundIdx]} reps this round`;
  } else { // FORTIME / RFT / FORTIME_REPEATS / stopwatch
    displaySeconds = elapsed;
    if(focusTimer.cap){
      const capSec = focusTimer.cap*60;
      fraction = Math.max(0, 1 - elapsed/capSec);
      if(elapsed >= capSec){ warn = true; focusFinish(); }
    } else {
      fraction = 1;
    }
    setRing(fraction);
    if(focusTimer.kind==='FORTIME_REPEATS'){
      const resting = focusTimer.restUntil && elapsed < focusTimer.restUntil;
      phaseEl.textContent = resting ? 'REST' : 'GO';
      phaseWordUsed = true;
      if(resting && secondaryEl){ secondaryEl.textContent = `Next round in ${fmtClock(focusTimer.restUntil-elapsed)}`; secondaryUsed = true; }
      if(resting && focusTimer.running && Math.ceil(focusTimer.restUntil-elapsed)<=3) focusMaybeTick(focusTimer.restUntil-elapsed);
      subEl.textContent = `Round ${Math.min(state.focusTapCount+1, focusTimer.rounds)} of ${focusTimer.rounds} — for time`;
    } else {
      const roundsPart = focusTimer.rounds ? `Complete ${focusTimer.rounds} rounds — you track them. ` : '';
      subEl.textContent = focusTimer.cap ? `${roundsPart}Time cap ${focusTimer.cap}'` : (roundsPart || 'Counts up — stop when you finish');
    }
  }

  if(secondaryEl && !secondaryUsed) secondaryEl.textContent = '';
  if(phaseEl && !phaseWordUsed) phaseEl.textContent = '';
  numberEl.textContent = fmtClock(displaySeconds);
  numberEl.classList.toggle('warn', warn);

  // once finished, locking the + / swipe controls prevents mis-taps from changing a score that's already locked in
  const plusBtn = document.getElementById('gw-focus-plus');
  if(plusBtn) plusBtn.disabled = focusTimer.doneBeeped;
  const swipeZone = document.getElementById('gw-focus-swipezone');
  if(swipeZone) swipeZone.classList.toggle('gw-swipe-locked', focusTimer.doneBeeped);

  // the finish message lives in the drawer itself — it holds here for a beat (see
  // focusAutoCloseAndRate) before the drawer closes on its own to reveal the completed section
  if(focusTimer.doneBeeped){
    phaseEl.textContent = 'COMPLETED';
    phaseEl.classList.remove('rest');
    subEl.textContent = '';
    if(secondaryEl) secondaryEl.textContent = '';
    numberEl.classList.remove('warn');
  }
}

function splitHeadline(body){
  const lines = body.split('\n');
  const first = (lines[0] || '').trim();
  const rest = lines.slice(1).join('\n');
  const repeatMatch = first.match(/^(\d+)\s*X:?$/i);
  if(repeatMatch) return {headline: 'REPEAT ' + repeatMatch[1] + 'X', detail: rest};
  return {headline: first.replace(/:$/,''), detail: rest};
}

  headEl.className = 'gw-section-headline';

  if(tag){
    const tagEl = document.createElement('span');
    tagEl.className = 'gw-tag';
    tagEl.textContent = tag;
    headlineRow.appendChild(tagEl);
  }
  bodyEl.appendChild(headlineRow);
  const timerSpecForExplainer = opts.timerSpec || parseTimerFromText(body);
  let explainerText = timerExplainer(timerSpecForExplainer);
  if(!explainerText && !/^REPEAT/i.test(headline)){
    // no formal timer for this section (e.g. travel-mode skill work) — still surface the round count, like warmup does
    const roundTarget = parseRoundTarget(body);
    if(roundTarget > 1) explainerText = `Repeat ${roundTarget} rounds.`;
  }
  if(explainerText){
    const explainEl = document.createElement('div');
    explainEl.className = 'gw-format-explainer';
    explainEl.textContent = explainerText;
    bodyEl.appendChild(explainEl);
  }
  if(detail.trim()){
    const detailEl = document.createElement('div');
    detailEl.className = 'gw-section-detail';
    detailEl.textContent = detail;
    bodyEl.appendChild(detailEl);
  }
  if(opts.setsList && opts.setsList.length){
    const listWrap = document.createElement('div');
    listWrap.className = 'gw-setlist';
    const weightInputs = [];
    opts.setsList.forEach((reps, idx)=>{
      const row = document.createElement('div');
      row.className = 'gw-setlist-row';
      const num = document.createElement('span');
      num.className = 'gw-setlist-num';
      num.textContent = `Set ${idx+1}`;
      const repsWrap = document.createElement('span');
      repsWrap.className = 'gw-setlist-reps';
      const repsInput = document.createElement('input');
      repsInput.type = 'text'; repsInput.inputMode = 'numeric'; repsInput.value = reps;
      // reps can be a range like "8-10" straight from the prescription — editing just narrows/overrides
      // that one set, it never cascades the way weight does
      repsInput.onchange = ()=>{
        const val = repsInput.value.trim() || reps;
        repsInput.value = val;
        opts.onRepsChange && opts.onRepsChange(idx, val);
      };
      repsWrap.appendChild(repsInput);
      const repsUnit = document.createElement('span');
      repsUnit.textContent = 'reps';
      repsWrap.appendChild(repsUnit);
      row.appendChild(num); row.appendChild(repsWrap);
      if(opts.setsWeights){
        const weightWrap = document.createElement('span');
        weightWrap.className = 'gw-setlist-weight';
        const input = document.createElement('input');
        input.type = 'number'; input.step = '5'; input.value = opts.setsWeights[idx] ?? 0;
        weightInputs.push(input);
        // editing a set's weight fills forward into every later set (not the ones before it) —
        // a natural "ramp to this weight and hold" workflow you can still override set by set
        input.onchange = ()=>{
          const val = Number(input.value)||0;
          for(let i=idx; i<weightInputs.length; i++) weightInputs[i].value = val;
          opts.onWeightChange && opts.onWeightChange(idx, val);
        };
        weightWrap.appendChild(input);
        const unit = document.createElement('span');
        unit.textContent = 'lb';
        weightWrap.appendChild(unit);
        row.appendChild(weightWrap);
      }
      listWrap.appendChild(row);
    });
    bodyEl.appendChild(listWrap);
    if(opts.onSetsDelta){
      const ctrlRow = document.createElement('div');
      ctrlRow.className = 'gw-setlist-controls';
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button'; removeBtn.textContent = '− Remove Set';

      removeBtn.onclick = ()=>opts.onSetsDelta(-1);

      addBtn.type = 'button'; addBtn.textContent = '+ Add Set';
      addBtn.onclick = ()=>opts.onSetsDelta(1);
      ctrlRow.appendChild(removeBtn); ctrlRow.appendChild(addBtn);
      bodyEl.appendChild(ctrlRow);
    }
  }

  wrap.appendChild(head); wrap.appendChild(bodyEl);
  wrap.bodyEl = bodyEl;
  wrap.finalize = ()=>{
    appendInfoAndTimer(bodyEl, body);
  };
  return wrap;
}

function rerollSection(section){
  const w = state.currentWorkout;
  if(!w) return;
  const bw = w.bw;
  if(w.roundCounts) w.roundCounts[section] = 0;
  if(w.sectionsDone) w.sectionsDone[section] = false;
  if(section==='warmup'){
    const pool = bw && WARMUPS_BW[w.type] ? WARMUPS_BW[w.type] : WARMUPS[w.type];
    let choice = w.warmup;
    if(pool.length>1){ do{ choice = pool[Math.floor(Math.random()*pool.length)]; } while(choice===w.warmup); }
    w.warmup = choice;
  } else if(section==='skill'){
    const skillPool = bw ? SKILLS_BW[w.type] : SKILLS[w.type];
    let choiceTpl = skillPool.find(s=>s.text===w.skillTplText) || skillPool[0];
    if(skillPool.length>1){ do{ choiceTpl = skillPool[Math.floor(Math.random()*skillPool.length)]; } while(choiceTpl.text===w.skillTplText); }
    w.skillTplText = choiceTpl.text;
    w.skillTimer = choiceTpl.timer || null;
    w.skillLiftKey = (!bw && choiceTpl.liftKey) ? choiceTpl.liftKey : null;
    w.skillSetReps = buildSkillSetReps(w.skillTplText, w.skillTimer, !!w.skillLiftKey);
    if(w.skillLiftKey){
      const result = computeSuggestedLoad(w.skillLiftKey);
      w.suggestedLoad = result.load; w.deload = result.deload;
    } else { w.suggestedLoad = null; w.deload = false; }
    w.skillSetWeights = buildSkillSetWeights(w.skillSetReps.length, w.suggestedLoad);
    w.rpe = null;
  } else if(section==='wod'){
    let movementPool = MOVEMENT_LIB[w.type];
    if(bw) movementPool = movementPool.filter(m=>m.equip==='none');
    movementPool = knownSkillFilter(movementPool);
    const alloc = allocateTime(state.timeAvailable);
    const catalog = WOD_FORMAT_CATALOG[w.type];
    const formatId = catalog[Math.floor(Math.random()*catalog.length)];
    const skillPattern = w.skillLiftKey ? LIFT_PATTERNS[w.skillLiftKey] : null;
    const recentTally = recentPatternTally(w.type, 2);
    const recentDominant = Object.keys(recentTally).sort((a,b)=>recentTally[b]-recentTally[a])[0] || null;
    const avoidPatterns = new Set([skillPattern, recentDominant].filter(Boolean));
    currentAvoidPatterns = avoidPatterns.size ? avoidPatterns : null;
    const built = WOD_FORMAT_DEFS[formatId]({pool:movementPool, type:w.type, volume:w.volumeUsed||1, wodMinutes: alloc?alloc.wod:null});
    currentAvoidPatterns = null;
    w.formatId = formatId;
    w.format = built.formatDisplay;
    w.wodMovements = built.movements;
    w.wodTimerSpec = built.timerSpec;
    w.movements = w.wodMovements.map(m=>m.name);
    w.wodRpe = null;
    w.wodPerformance = {};
  } else if(section==='core'){
    let choice = CORE.find(c=>c.text===w.core) || CORE[0];
    if(CORE.length>1){ do{ choice = CORE[Math.floor(Math.random()*CORE.length)]; } while(choice.text===w.core); }
    w.core = choice.text;
    w.coreTimer = choice.timer;
  }
  render();
}

function adjustSets(section, delta){
  const w = state.currentWorkout;
  if(!w) return;
  if(section==='skill' && w.skillSetReps){
    if(!w.skillSetWeights) w.skillSetWeights = buildSkillSetWeights(w.skillSetReps.length, w.suggestedLoad);
    if(delta>0 && w.skillSetReps.length<12){
      w.skillSetReps.push(w.skillSetReps[w.skillSetReps.length-1] ?? 5);
      w.skillSetWeights.push(w.skillSetWeights[w.skillSetWeights.length-1] ?? w.suggestedLoad ?? 0);
    } else if(delta<0 && w.skillSetReps.length>1){
      w.skillSetReps.pop();
      w.skillSetWeights.pop();
    }
    if(w.skillTimer) w.skillTimer.totalRounds = w.skillSetReps.length;
    w.skillTplText = updateSkillSchemeText(w.skillTplText, w.skillSetReps);
    w.suggestedLoad = w.skillSetWeights[w.skillSetWeights.length-1];
  }
  render();
}

async function logWorkout(){
  const w = state.currentWorkout;
  if(!w) return;
  try{
    if(w.skillLiftKey && w.suggestedLoad){
      state.weights[w.skillLiftKey] = w.suggestedLoad;
      await saveWeights();
    }
    if(w.wodRpe && !w.isBenchmark){
      const adj = VOLUME_ADJUST[w.wodRpe] ?? 0;
      state.volume[w.type] = clamp((state.volume[w.type] || 1.0) + adj, 0.7, 1.4);
      await saveVolume();
    }
    let prMessage = null;
    if(w.isBenchmark){
      const benchmark = BENCHMARKS.find(b=>b.name===w.benchmarkName);
      const score = computeBenchmarkScore(benchmark, w.wodPerformance);
      if(benchmark && score!=null){
        const prevHist = (state.benchmarks[benchmark.name] && state.benchmarks[benchmark.name].history) || [];
        const prevBest = prevHist.length
          ? (benchmark.scoreType==='rounds' ? Math.max(...prevHist.map(h=>h.score)) : Math.min(...prevHist.map(h=>h.score)))
          : null;
        const isPR = prevBest!=null && ((benchmark.scoreType==='rounds' && score>prevBest) || (benchmark.scoreType==='time' && score<prevBest));
        state.benchmarks[benchmark.name] = state.benchmarks[benchmark.name] || {history:[]};
        state.benchmarks[benchmark.name].history.push({date: Date.now(), score});
        await saveBenchmarks();
        if(isPR) prMessage = `New best on ${benchmark.name}! ${fmtBenchmarkScore(benchmark, score)} (previous: ${fmtBenchmarkScore(benchmark, prevBest)})`;
        else if(prevBest==null) prMessage = `${benchmark.name} baseline set: ${fmtBenchmarkScore(benchmark, score)}. Next retest will compare against this.`;
      }
    }
    state.history.push({
      date: Date.now(), type: w.type, warmup: w.warmup, skillTplText: w.skillTplText,
      liftKey: w.skillLiftKey, loggedLoad: w.suggestedLoad || null, rpe: w.rpe || null,
      wodRpe: w.wodRpe || null, volumeUsed: w.volumeUsed || 1.0,
      format: w.format, movements: w.movements, movementNames: w.movements, core: w.core, bw: w.bw,
      sectionsDone: w.sectionsDone || null, wodPerformance: w.wodPerformance || null,
      isBenchmark: w.isBenchmark || false, benchmarkName: w.benchmarkName || null
    });
    await saveHistory();
    toast(prMessage || ('Logged. Next ' + DAY_TYPES.find(d=>d.key===w.type).label + ' session will build on this.'));
    focusStopTicking();
    state.currentWorkout = null;
    document.getElementById('gw-timebanner').style.display = 'none';
    render();
  }catch(err){
    console.error('logWorkout failed', err);
    toast('Something went wrong saving — please try again.');
  }
}

async function saveActivity(){
  const d = activityDraft;
  if(!d || !d.intensity) return;
  try{
    const activityName = d.activity==='Other' && d.custom.trim() ? d.custom.trim() : d.activity;
    const mappedType = ACTIVITY_FOCUS_MAP[d.activity] || null;
    state.history.push({
      date: Date.now(), kind:'external', activity: activityName, mappedType,
      duration: d.duration, intensity: d.intensity, notes: d.notes || ''
    });
    await saveHistory();
    toast('Activity logged.');
    activityDraft = null;
    state.showActivityForm = false;
    renderLogPage();
    if(state_page==='wod') render(); // refresh recommendation/coach notes if visible
  }catch(err){
    console.error('saveActivity failed', err);
    toast('Something went wrong saving — please try again.');
  }
}

function buildSparkline(values, w, h){
  w = w || 160; h = h || 34;
  if(values.length<2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const stepX = w/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = i*stepX;
    const y = h - ((v-min)/range)*h*0.85 - h*0.075;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <polyline points="${pts}" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// re-expresses a bodyweight value under the other unit when the toggle is switched, so the number
// stays meaningful instead of just relabeling — not used for any calculation elsewhere in the app
function convertBodyweight(value, fromUnit, toUnit){
  if(value==null || fromUnit===toUnit) return value;
  return fromUnit==='lb' ? Math.round(value/2.20462) : Math.round(value*2.20462);
}

function weekStart(ts){
  const d = new Date(ts);
  const day = d.getDay();
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d);
  monday.setDate(d.getDate()+diffToMonday);
  monday.setHours(0,0,0,0);
  return monday.getTime();
}
function fmtTime(d){ return new Date(d).toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'}); }
function fmtDateHeader(d){ return new Date(d).toLocaleDateString(undefined,{weekday:'short', month:'long', day:'numeric'}).toUpperCase(); }
// the month currently being viewed in expanded mode — day 1, offset by state.logCalMonthOffset
// so a run of setMonth() calls never rolls over from a 31st into the wrong month
function calendarViewDate(){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + (state.logCalMonthOffset||0));
  return d;
}
// collapsed = current week only (7 cells); expanded = a full month, with muted lead/trail cells
// from the adjacent months for grid alignment and prev/next controls to page between months.
// Either mode, tapping a real day toggles state.logFilterDate to filter the timeline below. Days
// with a benchmark/hero WOD get a trophy mark instead of the plain dot, so hero-WOD days are
// visible at a glance without opening the timeline.
function buildLogCalendar(container){
  const card = document.createElement('div');
  card.className = 'gw-card gw-cal-card';

  const headRow = document.createElement('div');
  headRow.className = 'gw-cal-headrow';
  const title = document.createElement('span');
  title.className = 'gw-cal-title';
  title.textContent = 'Calendar';
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'gw-cal-toggle' + (state.logCalExpanded ? ' expanded' : '');
  toggle.innerHTML = `<span>${state.logCalExpanded ? 'Collapse' : 'This Week'}</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  toggle.onclick = ()=>{ state.logCalExpanded = !state.logCalExpanded; renderLogPage(); };
  headRow.appendChild(title); headRow.appendChild(toggle);
  card.appendChild(headRow);

  if(state.logCalExpanded){
    const navRow = document.createElement('div');
    navRow.className = 'gw-cal-navrow';
    const prevBtn = document.createElement('button');
    prevBtn.type = 'button'; prevBtn.className = 'gw-cal-navbtn'; prevBtn.setAttribute('aria-label', 'Previous month');
    prevBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    prevBtn.onclick = ()=>{ state.logCalMonthOffset = (state.logCalMonthOffset||0) - 1; renderLogPage(); };
    const navLabel = document.createElement('span');
    navLabel.className = 'gw-cal-navlabel';
    navLabel.textContent = calendarViewDate().toLocaleDateString(undefined,{month:'long', year:'numeric'});
    const nextBtn = document.createElement('button');
    nextBtn.type = 'button'; nextBtn.className = 'gw-cal-navbtn'; nextBtn.setAttribute('aria-label', 'Next month');
    nextBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nextBtn.onclick = ()=>{ state.logCalMonthOffset = (state.logCalMonthOffset||0) + 1; renderLogPage(); };
    navRow.appendChild(prevBtn); navRow.appendChild(navLabel); navRow.appendChild(nextBtn);
    card.appendChild(navRow);
    if(state.logCalMonthOffset){
      const todayLink = document.createElement('div');
      todayLink.className = 'gw-cal-today-link';
      todayLink.textContent = 'Jump to today';
      todayLink.onclick = ()=>{ state.logCalMonthOffset = 0; renderLogPage(); };
      card.appendChild(todayLink);
    }
  }

  const dowRow = document.createElement('div');
  dowRow.className = 'gw-cal-dow-row';
  ['SU','MO','TU','WE','TH','FR','SA'].forEach(dow=>{
    const c = document.createElement('div');
    c.className = 'gw-cal-dow';
    c.textContent = dow;
    dowRow.appendChild(c);
  });
  card.appendChild(dowRow);

  const grid = document.createElement('div');
  grid.className = 'gw-cal-grid';
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayKey = today.toDateString();

  function makeCell(d, outside){
    const dKey = d.toDateString();
    const cell = document.createElement('div');
    cell.className = 'gw-cal-cell' + (dKey===todayKey ? ' today' : '') + (state.logFilterDate===dKey ? ' selected' : '') + (outside ? ' outside' : '');
    const dayEntries = state.history.filter(h => new Date(h.date).toDateString()===dKey);
    const benchmarkNames = dayEntries.filter(h=>h.isBenchmark).map(h=>h.benchmarkName);
    let mark = '';
    if(benchmarkNames.length) mark = `<div class="gw-cal-trophy" title="${benchmarkNames.join(', ')}">${ICON_TROPHY}</div>`;
    else if(dayEntries.length) mark = '<div class="gw-cal-dot"></div>';
    cell.innerHTML = `<div class="gw-cal-num">${d.getDate()}</div>${mark}`;
    if(!outside){
      cell.onclick = ()=>{ state.logFilterDate = (state.logFilterDate===dKey) ? null : dKey; renderLogPage(); };
    }
    return cell;
  }

  if(!state.logCalExpanded){
    const dow = today.getDay();
    const diffToMonday = (dow===0 ? -6 : 1-dow);
    const monday = new Date(today);
    monday.setDate(today.getDate()+diffToMonday);
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      grid.appendChild(makeCell(d, false));
    }
  } else {
    const viewDate = calendarViewDate();
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const leadDays = new Date(year, month, 1).getDay();
    for(let i=leadDays;i>0;i--) grid.appendChild(makeCell(new Date(year, month, 1-i), true));
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for(let i=1;i<=daysInMonth;i++) grid.appendChild(makeCell(new Date(year, month, i), false));
    const trailDays = (7 - grid.children.length % 7) % 7;
    for(let i=1;i<=trailDays;i++) grid.appendChild(makeCell(new Date(year, month+1, i), true));
  }
  card.appendChild(grid);
  container.appendChild(card);
}
function buildTimelineCard(h){

  if(h.kind==='external'){

    card.innerHTML = `
      <div class="gw-timeline-title-row">
        <span class="gw-timeline-title">${h.activity}</span>
        <span class="gw-timeline-time">${fmtTime(h.date)}</span>
      </div>
      <div class="gw-timeline-badges"><span class="gw-timeline-badge">Outside Activity</span></div>
      <div class="gw-timeline-stats">
        <div class="gw-timeline-stat"><div class="gw-timeline-stat-num">${h.duration || '—'}</div><div class="gw-timeline-stat-label">Minutes</div></div>

    return card;
  }

  const typeLabel = DAY_TYPES.find(d=>d.key===h.type).label;
  const perfText = formatPerformance(h.wodPerformance);
  const skipped = [];
  if(h.sectionsDone){
    if(h.sectionsDone.warmup===false) skipped.push('warm-up');

    if(h.sectionsDone.core===false) skipped.push('core');

  const badges = [];
  if(h.bw) badges.push('Travel');
  if(h.isBenchmark) badges.push(`Benchmark: ${h.benchmarkName}`);
  const feel = RPE_LABELS[h.wodRpe] || RPE_LABELS[h.rpe] || '—';
  const detail = `${h.format} · ${h.movements.join(', ')}${h.liftKey? ' · '+LIFT_LABELS[h.liftKey]+' @ '+h.loggedLoad+' lb ('+(RPE_LABELS[h.rpe]||'—')+')' : ''}${h.wodRpe? ' · WOD felt '+RPE_LABELS[h.wodRpe] : ''}${perfText? ' · '+perfText : ''}${skipped.length? ' · skipped: '+skipped.join(', ') : ''}`;
  // load only means something for a session built around a specific lift — otherwise it's just
  // an empty tile, so it's dropped rather than shown as "Load: —"
  const loadStat = h.liftKey
    ? `<div class="gw-timeline-stat"><div class="gw-timeline-stat-num">${h.loggedLoad} lb</div><div class="gw-timeline-stat-label">${LIFT_LABELS[h.liftKey]}</div></div>`
    : '';

  card.innerHTML = `
    <div class="gw-timeline-title-row">
      <span class="gw-timeline-title">${typeLabel}</span>

    <div class="gw-timeline-stats">
      <div class="gw-timeline-stat"><div class="gw-timeline-stat-num">${h.movements.length}</div><div class="gw-timeline-stat-label">Movements</div></div>
      ${loadStat}
      <div class="gw-timeline-stat"><div class="gw-timeline-stat-num">${feel}</div><div class="gw-timeline-stat-label">Felt</div></div>
    </div>
    <div class="gw-timeline-detail">${detail}</div>`;
  return card;
}
// one timeline node per day (dot + date header), holding a card for every session logged that day
function buildTimeline(entries, container){
  if(entries.length===0){
    const none = document.createElement('div');
    none.style.cssText = 'color:var(--muted); font-size:13px;';
    none.textContent = state.logFilterDate ? 'Nothing logged on this day.' : 'Nothing logged yet — generate and log a workout, or log an outside activity, to start building history.';
    container.appendChild(none);
    return;
  }
  const rail = document.createElement('div');
  rail.className = 'gw-timeline';

  const groups = [];
  [...entries].reverse().forEach(h=>{
    const dKey = new Date(h.date).toDateString();
    const g = groups[groups.length-1];
    if(g && g.dKey===dKey) g.items.push(h);
    else groups.push({dKey, date:h.date, items:[h]});
  });

  groups.forEach(g=>{
    const node = document.createElement('div');
    node.className = 'gw-timeline-node';
    node.innerHTML = `<div class="gw-timeline-dot"></div><div class="gw-timeline-date">${fmtDateHeader(g.date)}</div>`;
    g.items.forEach(h => node.appendChild(buildTimelineCard(h)));
    rail.appendChild(node);
  });
  container.appendChild(rail);
}

      const entries = state.history.filter(h=>h.liftKey===key && h.loggedLoad!=null);
      if(entries.length===0) return;
      const first = entries[0].loggedLoad, latest = entries[entries.length-1].loggedLoad;
      const delta = latest - first;
      summaryHtml += `${LIFT_LABELS[key]}: ${first} → ${latest} lb (${delta>=0?'+':''}${delta} lb over ${entries.length} session${entries.length===1?'':'s'})<br>`;
    });
    if(summaryHtml){
      const summary = document.createElement('div');
      summary.className = 'gw-card';
      summary.style.cssText = 'font-size:12.5px; color:var(--muted); line-height:1.7; padding:16px;';
      summary.innerHTML = `<div style="color:#fff; font-weight:700; margin-bottom:4px;">Lift progress</div>${summaryHtml}`;
      container.appendChild(summary);
    }

    // a chip per focus (big number + label) reads at a glance far better than a wall of muted
    // text — color flags a focus that's gone stale (14+ days, same threshold layoffFactor() uses
    // to ease weight back in) so it stands out instead of blending into the rest of the row
    const lastTrained = document.createElement('div');
    lastTrained.className = 'gw-card';
    lastTrained.style.padding = '16px';
    const ltHeading = document.createElement('div');
    ltHeading.style.cssText = 'color:#fff; font-weight:700; margin-bottom:12px; font-size:13px;';
    ltHeading.textContent = 'Last Trained';
    lastTrained.appendChild(ltHeading);
    const chipGrid = document.createElement('div');
    chipGrid.className = 'gw-lasttrained-grid';
    DAY_TYPES.forEach(dt=>{
      const last = lastSessionDate(dt.key);
      const days = last===null ? null : daysSince(last);
      const chip = document.createElement('div');
      chip.className = 'gw-lasttrained-chip' + (days===null ? ' never' : (days>14 ? ' stale' : ''));
      const numText = days===null ? '—' : (Math.round(days)===0 ? 'Today' : Math.round(days)+'d');
      chip.innerHTML = `<div class="gw-lasttrained-num">${numText}</div><div class="gw-lasttrained-label">${dt.label}</div>`;
      chipGrid.appendChild(chip);
    });
    lastTrained.appendChild(chipGrid);
    container.appendChild(lastTrained);

    // ---- benchmark progress ----
    const testedBenchmarks = BENCHMARKS.filter(b => state.benchmarks[b.name] && state.benchmarks[b.name].history.length);
    if(testedBenchmarks.length){
      const bmBox = document.createElement('div');
      bmBox.className = 'gw-card';
      bmBox.style.cssText = 'font-size:12.5px; color:var(--muted); line-height:1.8; padding:16px;';
      let bmHtml = '<div style="color:#fff; font-weight:700; margin-bottom:4px;">Benchmark progress</div>';
      testedBenchmarks.forEach(b=>{
        const hist = state.benchmarks[b.name].history;
        const scores = hist.map(h => fmtBenchmarkScore(b, h.score));
        const trend = scores.length > 4 ? ['…', ...scores.slice(-4)] : scores;
        bmHtml += `${b.name}: ${trend.join(' → ')}<br>`;
      });
      const nextDue = eligibleBenchmarks(state.bodyweightOnly).filter(b => !testedBenchmarks.includes(b) || true).map(b=>{
        const hist = (state.benchmarks[b.name] && state.benchmarks[b.name].history) || [];
        const last = hist.length ? hist[hist.length-1].date : null;
        const daysLeft = last===null ? 0 : Math.max(0, BENCHMARK_RETEST_DAYS - Math.round(daysSince(last)));
        return {name:b.name, daysLeft, tested: hist.length>0};
      }).sort((a,b)=>a.daysLeft-b.daysLeft)[0];
      if(nextDue && nextDue.tested && nextDue.daysLeft>0){
        bmHtml += `<span style="font-size:11px;">Next retest (${nextDue.name}) due in ${nextDue.daysLeft} day${nextDue.daysLeft===1?'':'s'}</span>`;
      }
      bmBox.innerHTML = bmHtml;
      container.appendChild(bmBox);
    }
  }

  // ---- timeline (filtered by selected day, if any) ----
  const visibleHistory = state.logFilterDate
    ? state.history.filter(h => new Date(h.date).toDateString()===state.logFilterDate)
    : state.history;
  buildTimeline(visibleHistory, container);
}

// ---------- WORKOUT TIMER ----------
// AudioContext is created lazily on first user interaction (required by browsers)
let audioCtx = null;
function beep(freq=880, durationMs=180, delayMs=0, gainLevel=0.35){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delayMs/1000;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(gainLevel, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + durationMs/1000);
    osc.start(t0); osc.stop(t0 + durationMs/1000);
  }catch(e){}
}
// short, low "tick" for the final 3 seconds of any countdown window
function tickBeep(){ beep(360, 110, 0, 0.28); }
// higher, longer "switch" beep for round/minute/phase changes
function switchBeep(){ beep(1000, 320, 0, 0.4); }
function beepTriple(){ beep(1000,180,0,0.4); beep(1000,180,220,0.4); beep(1300,420,440,0.45); }

// Scans any section's text for a recognizable time structure. Returns null if the section isn't time-based.
function parseTimerFromText(text){
  let m;
  if(m = text.match(/AMRAP\s+(\d+)'/i)) return {kind:'AMRAP', minutes:Number(m[1])};
  if(m = text.match(/EMOM\s+(\d+)'/i)) return {kind:'EMOM', minutes:Number(m[1])};
  if(m = text.match(/Tabata\s+(\d+)"\s*\/\s*(\d+)"\s*(?:x\s*(\d+))?/i)){
    return {kind:'TABATA', workSec:Number(m[1]), restSec:Number(m[2]), rounds:Number(m[3]||8)};
  }
  if(m = text.match(/^(\d+(?:-\d+){1,})/)){
    const rungs = m[1].split('-').map(Number);
    const capM = text.match(/cap\s+(\d+)'/i);
    return {kind:'LADDER', rungs, cap: capM ? Number(capM[1]) : null};
  }
  if(m = text.match(/FOR TIME[\s\S]*?cap\s+(\d+)'/i)) return {kind:'FORTIME', cap:Number(m[1])};
  if(/FOR TIME/i.test(text)) return {kind:'FORTIME', cap:null};
  if(m = text.match(/(\d+)\s*RFT/i)){
    const capM = text.match(/cap\s+(\d+)'/i);
    return {kind:'RFT', cap: capM ? Number(capM[1]) : null, rounds: Number(m[1])};
  }
  if(m = text.match(/(\d+)'\s*accumulate/i) || (m = text.match(/accumulate\s+(\d+)'/i))){
    return {kind:'COUNTDOWN', minutes:Number(m[1])};
  }
  // "5 x 5" / "4 x 8-10" etc — used to bound the rest-interval timer below at the right number of sets
  const setCountMatch = text.match(/(\d+)\s*x\s*\d+/i);
  const setCount = setCountMatch ? Number(setCountMatch[1]) : null;
  if(m = text.match(/each\s+(\d+)\s*min/i)) return {kind:'INTERVAL', minutes:Number(m[1]), totalRounds:setCount};
  if(m = text.match(/rest\s+(\d+)\s*sec/i)) return {kind:'INTERVAL', minutes:Number(m[1])/60, totalRounds:setCount};
  return null;
}

function fmtClock(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
