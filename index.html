    prevBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    prevBtn.onclick = ()=>{ state.logCalMonthOffset = (state.logCalMonthOffset||0) - 1; renderLogPage(); };
    const navLabel = document.createElement('span');
    navLabel.className = 'gw-cal-navlabel';
    navLabel.textContent = calendarViewDate().toLocaleDateString(undefined,{month:'long', year:'numeric'});
    const nextBtn = document.createElement('button');
    nextBtn.type = 'button'; nextBtn.className = 'gw-cal-navbtn'; nextBtn.setAttribute('aria-label', 'Next month');
    nextBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nextBtn.onclick = ()=>{ state.logCalMonthOffset = (state.logCalMonthOffset||0) + 1; renderLogPage(); };
    navRow.appendChild(prevBtn); navRow.appendChild(navLabel); navRow.appendChild(nextBtn);
    card.appendChild(navRow);
    if(state.logCalMonthOffset){
      const todayLink = document.createElement('div');
      todayLink.className = 'gw-cal-today-link';
      todayLink.textContent = 'Jump to today';
      todayLink.onclick = ()=>{ state.logCalMonthOffset = 0; renderLogPage(); };
      card.appendChild(todayLink);
    }
  }

  const dowRow = document.createElement('div');
  dowRow.className = 'gw-cal-dow-row';
  ['SU','MO','TU','WE','TH','FR','SA'].forEach(dow=>{
    const c = document.createElement('div');
    c.className = 'gw-cal-dow';
    c.textContent = dow;
    dowRow.appendChild(c);
  });
  card.appendChild(dowRow);

  const grid = document.createElement('div');
  grid.className = 'gw-cal-grid';
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayKey = today.toDateString();

  function makeCell(d, outside){
    const dKey = d.toDateString();
    const cell = document.createElement('div');
    cell.className = 'gw-cal-cell' + (dKey===todayKey ? ' today' : '') + (state.logFilterDate===dKey ? ' selected' : '') + (outside ? ' outside' : '');
    const dayEntries = state.history.filter(h => new Date(h.date).toDateString()===dKey);
    const benchmarkNames = dayEntries.filter(h=>h.isBenchmark).map(h=>h.benchmarkName);
    let mark = '';
    if(benchmarkNames.length) mark = `<div class="gw-cal-trophy" title="${benchmarkNames.join(', ')}">${ICON_TROPHY}</div>`;
    else if(dayEntries.length) mark = '<div class="gw-cal-dot"></div>';
    cell.innerHTML = `<div class="gw-cal-num">${d.getDate()}</div>${mark}`;
    if(!outside){
      cell.onclick = ()=>{ state.logFilterDate = (state.logFilterDate===dKey) ? null : dKey; renderLogPage(); };
    }
    return cell;
  }

  if(!state.logCalExpanded){
    // the day-of-week header above (built from ['SU','MO',...]) is Sunday-first — this row of
    // cells has to start from the same Sunday, not Monday, or every date lands one column off
    // from its own weekday label (this week's Thursday rendering under the Wednesday header, etc.)
    const dow = today.getDay();
    const sunday = new Date(today);
    sunday.setDate(today.getDate() - dow);
    for(let i=0;i<7;i++){
      const d = new Date(sunday);
      d.setDate(sunday.getDate()+i);
      grid.appendChild(makeCell(d, false));
    }
  } else {
    const viewDate = calendarViewDate();
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const leadDays = new Date(year, month, 1).getDay();
    for(let i=leadDays;i>0;i--) grid.appendChild(makeCell(new Date(year, month, 1-i), true));
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for(let i=1;i<=daysInMonth;i++) grid.appendChild(makeCell(new Date(year, month, i), false));
    const trailDays = (7 - grid.children.length % 7) % 7;
    for(let i=1;i<=trailDays;i++) grid.appendChild(makeCell(new Date(year, month+1, i), true));
  }
  card.appendChild(grid);
  container.appendChild(card);
}
function buildTimelineCard(h){
  const card = document.createElement('div');
  card.className = 'gw-timeline-card';

  if(h.kind==='external'){
    const mappedLabel = h.mappedType ? DAY_TYPES.find(d=>d.key===h.mappedType).label : null;
    card.innerHTML = `
      <div class="gw-timeline-title-row">
        <span class="gw-timeline-title">${h.activity}</span>
        <span class="gw-timeline-time">${fmtTime(h.date)}</span>
      </div>
      <div class="gw-timeline-badges"><span class="gw-timeline-badge">Outside Activity</span></div>
      <div class="gw-timeline-stats">
        <div class="gw-timeline-stat"><div class="gw-timeline-stat-num${numCls(h.duration)}">${h.duration || '—'}</div><div class="gw-timeline-stat-label">Minutes</div></div>
        <div class="gw-timeline-stat"><div class="gw-timeline-stat-num gw-txt">${RPE_LABELS[h.intensity]||'—'}</div><div class="gw-timeline-stat-label">Felt</div></div>
        <div class="gw-timeline-stat"><div class="gw-timeline-stat-num gw-txt">${mappedLabel||'—'}</div><div class="gw-timeline-stat-label">Counted As</div></div>
      </div>
      ${h.notes ? `<div class="gw-timeline-notes">${h.notes}</div>` : ''}`;
    return card;
  }

  const typeLabel = DAY_TYPES.find(d=>d.key===h.type).label;
  const perfShort = formatPerformanceShort(h.wodPerformance);
  // when the hero number is a computed total-reps score, the rounds+reps it came from is still
  // worth showing — just as a smaller caption underneath, not competing with the headline number
  const roundsBreakdown = (h.wodPerformance && h.wodPerformance.totalReps != null) ? formatRoundsBreakdown(h.wodPerformance) : '';
  const skipped = [];
  if(h.sectionsDone){
    if(h.sectionsDone.mobility===false) skipped.push('mobility');
    if(h.sectionsDone.warmup===false) skipped.push('warm-up');
    if(h.sectionsDone.skill===false) skipped.push('skill');
    if(h.sectionsDone.core===false) skipped.push('core');
  }
  // PR first — it's the most exciting thing on the card — then what kind of session this was,
  // then how it was done; {text, cls} lets each carry its own color instead of the default coral
  const badges = [];
  if(h.isPR) badges.push({text:'PR', cls:'badge-pr', icon:true});
  if(h.isBenchmark) badges.push({text:`Benchmark: ${h.benchmarkName}`});
  if(h.bw) badges.push({text:'Travel'});
  if(h.rxStatus==='rx') badges.push({text:'Full Workout', cls:'badge-rx'});
  if(h.rxStatus==='scaled') badges.push({text:'Modified Workout', cls:'badge-scaled'});
  const feel = RPE_LABELS[h.wodRpe] || RPE_LABELS[h.rpe] || '—';
  const movementsText = h.movements && h.movements.length ? h.movements.join(', ') : '';
  // what the session WAS (format + movements) — the score, load, and feel already have their own
  // prominent spots above, so this line is pure background context, kept short and muted
  const meta = `${h.format}${movementsText ? ' · '+movementsText : ''}`;
  // load only means something for a session built around a specific lift — otherwise it's just
  // an empty tile, so it's dropped rather than shown as "Load: —"
  const loadStat = h.liftKey
    ? `<div class="gw-timeline-stat"><div class="gw-timeline-stat-num">${h.loggedLoad} lb</div><div class="gw-timeline-stat-label">${LIFT_LABELS[h.liftKey]}</div></div>`
    : '';

  card.innerHTML = `
    <div class="gw-timeline-title-row">
      <span class="gw-timeline-title">${typeLabel}</span>
      <span class="gw-timeline-time">${fmtTime(h.date)}</span>
    </div>
    ${badges.length ? `<div class="gw-timeline-badges">${badges.map(b=>`<span class="gw-timeline-badge ${b.cls||''}">${b.icon?ICON_TROPHY:''}${b.text}</span>`).join('')}</div>` : ''}
    ${perfShort ? `<div class="gw-timeline-result${numCls(perfShort)}">${perfShort}</div>${roundsBreakdown ? `<div class="gw-timeline-result-sub">${roundsBreakdown}</div>` : ''}` : ''}
    <div class="gw-timeline-stats">
      ${loadStat}
      <div class="gw-timeline-stat"><div class="gw-timeline-stat-num${numCls(feel)}">${feel}</div><div class="gw-timeline-stat-label">Felt</div></div>
    </div>
    <div class="gw-timeline-meta">${meta}</div>
    ${skipped.length ? `<div class="gw-timeline-caveat">Skipped ${skipped.join(', ')}</div>` : ''}
    ${h.notes ? `<div class="gw-timeline-notes">${h.notes}</div>` : ''}`;
  return card;
}
// one timeline node per day (dot + date header), holding a card for every session logged that day
function buildTimeline(entries, container){
  if(entries.length===0){
    const none = document.createElement('div');
    none.style.cssText = 'color:var(--muted); font-size:13px;';
    none.textContent = state.logFilterDate ? 'Nothing logged on this day.' : 'Nothing logged yet — generate and log a workout, or log an outside activity, to start building history.';
    container.appendChild(none);
    return;
  }
  const rail = document.createElement('div');
  rail.className = 'gw-timeline';

  const groups = [];
  [...entries].reverse().forEach(h=>{
    const dKey = new Date(h.date).toDateString();
    const g = groups[groups.length-1];
    if(g && g.dKey===dKey) g.items.push(h);
    else groups.push({dKey, date:h.date, items:[h]});
  });

  groups.forEach(g=>{
    const node = document.createElement('div');
    node.className = 'gw-timeline-node';
    node.innerHTML = `<div class="gw-timeline-dot"></div><div class="gw-timeline-date">${fmtDateHeader(g.date)}</div>`;
    g.items.forEach(h => node.appendChild(buildTimelineCard(h)));
    rail.appendChild(node);
  });
  container.appendChild(rail);
}

function renderLogPage(){
  const container = document.getElementById('gw-log-content');
  container.innerHTML = '';

  // ---- headline stats (moved here from Profile — this is the page about training history) ----
  const statsRow = document.createElement('div');
  statsRow.className = 'gw-stats-row';
  statsRow.style.marginTop = '0';
  [
    {num: countWorkoutsTotal(), label:'Total Workouts'},
    {num: countWorkoutsThisWeek(), label:'This Week'}
  ].forEach(s=>{
    const tile = document.createElement('div');
    tile.className = 'gw-stat-tile';
    tile.innerHTML = `<div class="gw-stat-num${numCls(s.num)}">${s.num}</div><div class="gw-stat-label">${s.label}</div>`;
    statsRow.appendChild(tile);
  });
  container.appendChild(statsRow);

  buildLogCalendar(container);

  // ---- log an outside activity (inline) ----
  const actBtn = mkBtn(state.showActivityForm ? 'Cancel' : '+ Log an Outside Activity', state.showActivityForm ? 'gw-btn' : 'gw-teal', ()=>{
    state.showActivityForm = !state.showActivityForm;
    renderLogPage();
  });
  actBtn.style.cssText = 'margin-top:16px; width:100%;';
  container.appendChild(actBtn);
  if(state.showActivityForm){
    const formWrap = document.createElement('div');
    formWrap.className = 'gw-card';
    container.appendChild(formWrap);
    renderActivityForm(formWrap);
  }

  if(state.history.length===0){
    buildTimeline([], container);
    return;
  }

  if(state.logFilterDate){
    const clearRow = document.createElement('div');
    clearRow.style.cssText = 'font-size:12px; color:var(--coral); cursor:pointer; margin-bottom:12px; text-decoration:underline;';
    clearRow.textContent = `Showing ${new Date(state.logFilterDate).toLocaleDateString(undefined,{month:'short', day:'numeric'})} only — clear filter`;
    clearRow.onclick = ()=>{ state.logFilterDate = null; renderLogPage(); };
    container.appendChild(clearRow);
  }

  // ---- progress summary (only when not filtered to a single day) ----
  if(!state.logFilterDate){
    let summaryHtml = '';
    Object.keys(LIFT_LABELS).forEach(key=>{
      const entries = state.history.filter(h=>h.liftKey===key && h.loggedLoad!=null);
      if(entries.length===0) return;
      const first = entries[0].loggedLoad, latest = entries[entries.length-1].loggedLoad;
      const delta = latest - first;
      summaryHtml += `${LIFT_LABELS[key]}: ${first} → ${latest} lb (${delta>=0?'+':''}${delta} lb over ${entries.length} session${entries.length===1?'':'s'})<br>`;
    });
    if(summaryHtml){
      const summary = document.createElement('div');
      summary.className = 'gw-card';
      summary.style.cssText = 'font-size:12.5px; color:var(--muted); line-height:1.7; padding:16px;';
      summary.innerHTML = `<div style="color:#fff; font-weight:700; margin-bottom:4px;">Lift progress</div>${summaryHtml}`;
      container.appendChild(summary);
    }

    // a chip per focus (big number + label) reads at a glance far better than a wall of muted
    // text — color flags a focus that's gone stale (14+ days, same threshold layoffFactor() uses
    // to ease weight back in) so it stands out instead of blending into the rest of the row
    const lastTrained = document.createElement('div');
    lastTrained.className = 'gw-card';
    lastTrained.style.padding = '16px';
    const ltHeading = document.createElement('div');
    ltHeading.style.cssText = 'color:#fff; font-weight:700; margin-bottom:12px; font-size:13px;';
    ltHeading.textContent = 'Last Trained';
    lastTrained.appendChild(ltHeading);
    const chipGrid = document.createElement('div');
    chipGrid.className = 'gw-lasttrained-grid';
    function buildLastTrainedChip(last, label){
      const days = last===null ? null : daysSince(last);
      const chip = document.createElement('div');
      chip.className = 'gw-lasttrained-chip' + (days===null ? ' never' : (days>14 ? ' stale' : ''));
      const numText = days===null ? '—' : (Math.round(days)===0 ? 'Today' : Math.round(days)+'d');
      chip.innerHTML = `<div class="gw-lasttrained-num${numCls(numText)}">${numText}</div><div class="gw-lasttrained-label">${label}</div>`;
      return chip;
    }
    FOCUS_CHOICES.forEach(f=>{
      chipGrid.appendChild(buildLastTrainedChip(lastSessionDateForFocus(f.key), f.label));
    });
    chipGrid.appendChild(buildLastTrainedChip(lastExternalActivityDate(), 'Outside Activity'));
    lastTrained.appendChild(chipGrid);
    container.appendChild(lastTrained);

    // ---- benchmark progress ----
    const testedBenchmarks = BENCHMARKS.filter(b => state.benchmarks[b.name] && state.benchmarks[b.name].history.length);
    if(testedBenchmarks.length){
      const bmBox = document.createElement('div');
      bmBox.className = 'gw-card';
      bmBox.style.cssText = 'font-size:12.5px; color:var(--muted); line-height:1.8; padding:16px;';
      let bmHtml = '<div style="color:#fff; font-weight:700; margin-bottom:4px;">Benchmark progress</div>';
      testedBenchmarks.forEach(b=>{
        const hist = state.benchmarks[b.name].history;
        const scores = hist.map(h => fmtBenchmarkScore(b, h.score));
        const trend = scores.length > 4 ? ['…', ...scores.slice(-4)] : scores;
        bmHtml += `${b.name}: ${trend.join(' → ')}<br>`;
      });
      const nextDue = eligibleBenchmarks(state.bodyweightOnly).filter(b => !testedBenchmarks.includes(b) || true).map(b=>{
        const hist = (state.benchmarks[b.name] && state.benchmarks[b.name].history) || [];
        const last = hist.length ? hist[hist.length-1].date : null;
        const daysLeft = last===null ? 0 : Math.max(0, BENCHMARK_RETEST_DAYS - Math.round(daysSince(last)));
        return {name:b.name, daysLeft, tested: hist.length>0};
      }).sort((a,b)=>a.daysLeft-b.daysLeft)[0];
      if(nextDue && nextDue.tested && nextDue.daysLeft>0){
        bmHtml += `<span style="font-size:11px;">Next retest (${nextDue.name}) due in ${nextDue.daysLeft} day${nextDue.daysLeft===1?'':'s'}</span>`;
      }
      bmBox.innerHTML = bmHtml;
      container.appendChild(bmBox);
    }
  }

  // ---- timeline (filtered by selected day, if any) ----
  const visibleHistory = state.logFilterDate
    ? state.history.filter(h => new Date(h.date).toDateString()===state.logFilterDate)
    : state.history;
  buildTimeline(visibleHistory, container);
}

// AudioContext is created lazily on first user interaction (required by browsers)
let audioCtx = null;
function beep(freq=880, durationMs=180, delayMs=0, gainLevel=0.35){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delayMs/1000;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(gainLevel, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + durationMs/1000);
    osc.start(t0); osc.stop(t0 + durationMs/1000);
  }catch(e){}
}
// short, low "tick" for the final 3 seconds of any countdown window
function tickBeep(){ beep(360, 110, 0, 0.28); }
// higher, longer "switch" beep for round/minute/phase changes
function switchBeep(){ beep(1000, 320, 0, 0.4); }
function beepTriple(){ beep(1000,180,0,0.4); beep(1000,180,220,0.4); beep(1300,420,440,0.45); }

// Scans any section's text for a recognizable time structure. Returns null if the section isn't time-based.
function parseTimerFromText(text){
  let m;
  if(m = text.match(/(\d+)\s*x\s*FOR TIME\s*\(rest\s*(\d+)s\)/i)) return {kind:'FORTIME_REPEATS', rounds:Number(m[1]), restSeconds:Number(m[2]), cap:null, label:'For Time Repeats'};
  if(m = text.match(/AMRAP\s+(\d+)'/i)) return {kind:'AMRAP', minutes:Number(m[1])};
  if(m = text.match(/EMOM\s+(\d+)'/i)) return {kind:'EMOM', minutes:Number(m[1])};
  if(m = text.match(/Tabata\s+(\d+)"\s*\/\s*(\d+)"\s*(?:x\s*(\d+))?/i)){
    return {kind:'TABATA', workSec:Number(m[1]), restSec:Number(m[2]), rounds:Number(m[3]||8)};
  }
  if(m = text.match(/^(\d+(?:-\d+){1,})/)){
    const rungs = m[1].split('-').map(Number);
    const capM = text.match(/cap\s+(\d+)'/i);
    return {kind:'LADDER', rungs, cap: capM ? Number(capM[1]) : null};
  }
  if(m = text.match(/FOR TIME[\s\S]*?cap\s+(\d+)'/i)) return {kind:'FORTIME', cap:Number(m[1])};
  if(/FOR TIME/i.test(text)) return {kind:'FORTIME', cap:null};
  if(m = text.match(/(\d+)\s*RFT/i)){
    const capM = text.match(/cap\s+(\d+)'/i);
    return {kind:'RFT', cap: capM ? Number(capM[1]) : null, rounds: Number(m[1])};
  }
  if(m = text.match(/(\d+)'\s*accumulate/i) || (m = text.match(/accumulate\s+(\d+)'/i))){
    return {kind:'COUNTDOWN', minutes:Number(m[1])};
  }
  // "5 x 5" / "4 x 8-10" etc — used to bound the rest-interval timer below at the right number of sets
  const setCountMatch = text.match(/(\d+)\s*x\s*\d+/i);
  const setCount = setCountMatch ? Number(setCountMatch[1]) : null;
  if(m = text.match(/every\s+(\d+)\s*min/i)) return {kind:'INTERVAL', minutes:Number(m[1]), totalRounds:setCount};
  if(m = text.match(/rest\s+(\d+)\s*sec/i)) return {kind:'INTERVAL', minutes:Number(m[1])/60, totalRounds:setCount};
  return null;
}

function fmtClock(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

<script>
if ("serviceWorker" in navigator) {
  // a Home Screen app stays alive in memory between uses and never reloads on its own, so a new deploy
  // can sit unseen for days — check for one whenever the app comes back to the front, and when a new
  // version takes over offer a one-tap reload (never an automatic one: that would drop a workout or
  // timer in progress). Saved logs live in localStorage and are untouched either way.
  const hadController = !!navigator.serviceWorker.controller;
  let swReg = null;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!hadController || document.getElementById("gw-update-banner")) return;
    const bar = document.createElement("div");
    bar.id = "gw-update-banner";
    bar.style.cssText = "position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top, 0px)); z-index:300; background:#fff; color:#0c1420; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; font:800 13px Inter,-apple-system,sans-serif; box-shadow:0 8px 24px rgba(0,0,0,0.4);";
    bar.innerHTML = '<span style="flex:1">New version ready</span><button type="button" style="background:#ff6b6b; color:#0c1420; border:none; border-radius:10px; padding:9px 14px; font:800 13px Inter,-apple-system,sans-serif;">Reload</button>';
    bar.querySelector("button").onclick = () => location.reload();
    document.body.appendChild(bar);
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => { swReg = reg; reg.update(); }).catch(()=>{}));
  document.addEventListener("visibilitychange", () => { if(!document.hidden && swReg) swReg.update().catch(()=>{}); });
}
</script>
