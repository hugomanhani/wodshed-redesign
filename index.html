<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WODSHED</title>
<meta name="description" content="Garage gym workout generator with progressive overload tracking.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WODSHED">
<style>html,body{margin:0; background:#0d1b2a;}</style>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');

  :root{
    --bg:#0c1420;
    --surface:#151f30;
    --surface-2:#0c1420;
    --surface-raised:#1c2a40;
    --coral:#ff6b6b;
    --coral-dark:#e5504f;
    --coral-wash:rgba(255,107,107,0.12);
    --muted:#7c8ba3;
    --muted-2:#54627a;
    --text:#e7e9ee;
    --line:rgba(255,255,255,0.08);
    --line-strong:rgba(255,255,255,0.16);
    --danger:#ff6b6b;
    --good:#5fd0a3;
    --warn:#f5b350;
    --font-num:'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --font-display:var(--font-body); /* all lettering is Inter; only numerals keep --font-num / --font-mono */
    --btn-h:48px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* no button label ever wraps to a second line — long dynamic text (timer names, movement+load
     strings) truncates with an ellipsis instead via the specific overflow rules below */
  button{white-space:nowrap;}
  html, body{
    /* no double-tap-to-zoom on a screen full of rapid taps (round counters, +/- steppers) — taps
       stay taps instead of zooming the page */
    touch-action:manipulation;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    margin:0;
    /* belt-and-suspenders against horizontal scroll on phones — a badge row, a long dynamic
       string, or anything else that briefly overflows its container gets clipped here instead
       of ever handing the whole page a sideways scrollbar */
    overflow-x:hidden;
  }
  #gw-root{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding:0 0 calc(112px + env(safe-area-inset-bottom, 0px));
    min-height:100vh;
    min-height:100dvh;
    position:relative;
  }
  .gw-display{
    font-family:var(--font-display);
    font-weight:900;
    letter-spacing:-0.01em;
    text-transform:uppercase;
  }
  /* ---- top bar: small identity chip + breadcrumb, no shouting hero title ---- */
  #gw-header{
    display:flex; align-items:center; gap:10px;
    padding:calc(16px + env(safe-area-inset-top, 0px)) 20px 6px;
  }
  #gw-header h1, #gw-header .gw-sub{display:none;}

  .gw-btn{
    background:var(--surface); color:#fff; border:1px solid var(--line-strong);
    padding:0 16px; border-radius:8px; cursor:pointer; font-size:12px;
    font-weight:800; letter-spacing:0.03em; text-transform:uppercase; font-family:var(--font-body);
  }
  /* one height for every button (start / round / completed / refresh / set controls / primary actions) */
  .gw-btn, .gw-section-start-btn, .gw-section-round-btn, .gw-starttimer-btn,
  .gw-timer-full, #gw-actions > .gw-btn-hero, #gw-actions > .gw-btn-secondary{
    box-sizing:border-box; min-height:var(--btn-h); padding-top:0; padding-bottom:0;
    display:inline-flex; align-items:center; justify-content:center; line-height:1.2;
  }
  .gw-section-start-btn, .gw-section-round-btn, .gw-starttimer-btn, .gw-timer-full,
  #gw-actions > .gw-btn-hero, #gw-actions > .gw-btn-secondary{display:flex;}
  .gw-btn:hover{background:var(--surface-raised);}
  .gw-btn.gw-primary{background:var(--coral); color:var(--bg); border:none; font-family:var(--font-body); font-size:14px; letter-spacing:0.02em;}
  .gw-btn.gw-primary:hover{background:var(--coral-dark);}
  .gw-btn.gw-teal{background:var(--coral); color:var(--bg); border:none; font-family:var(--font-body); font-size:14px; letter-spacing:0.02em;}
  .gw-btn.gw-teal:hover{background:var(--coral-dark);}
  .gw-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .gw-btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---- hero: today's workout, styled after a plan-card (name + meta + pills) ---- */
  /* the intro (title, a one-line read on today's focus, the two dropdowns) is the page's own full-bleed
     background, running up under the status bar; the workout below is a sheet in the app's base colour
     that slides up over it with rounded top corners */
  #gw-page-wod.gw-page{padding-top:0; padding-bottom:0;}
  #gw-intro{
    margin:calc(-22px - env(safe-area-inset-top, 0px)) -20px 0; padding-bottom:40px;
    background:radial-gradient(120% 90% at 0% 0%, rgba(255,107,107,0.12) 0%, rgba(255,107,107,0) 55%), linear-gradient(165deg, #17233a 0%, #101a2c 100%);
  }
  #gw-sheet{
    position:relative; margin:-26px -20px 0; padding:28px 20px 20px; min-height:60vh;
    background:var(--bg); border-radius:28px 28px 0 0; box-shadow:0 -4px 14px rgba(0,0,0,0.12);
  }
  #gw-hero{padding:calc(42px + env(safe-area-inset-top, 0px)) 20px 0;}
  .gw-hero-title{
    font-family:var(--font-body); font-weight:800; font-size:32px;
    color:#fff; line-height:1.08; letter-spacing:-0.02em;
  }
  .gw-hero-title-btn{
    display:flex; align-items:center; gap:6px; background:none; border:none; padding:0; cursor:pointer; text-align:left;
  }
  .gw-hero-title-btn svg{width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:2.4; flex:none; margin-top:4px;}
  .gw-hero-title-btn:hover svg{stroke:var(--coral);}
  .gw-hero-meta{color:#b9c6da; font-size:13.5px; font-weight:500; margin:0 0 6px;}
  .gw-hero-meta b{font-weight:inherit;}
  #gw-controls{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:16px 20px 20px; font-size:12px;
  }
  .gw-pill{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:9px 14px; font-family:var(--font-body); font-weight:700; font-size:13px; color:#fff;
    cursor:pointer;
  }
  .gw-pill.gw-pill-on{background:var(--coral-wash); border-color:var(--coral); color:var(--coral);}
  #gw-controls.gw-travel-on .gw-pill-equip{background:var(--coral); color:var(--bg); border-color:var(--coral);}
  #gw-controls label.gw-time, #gw-controls label.gw-equip{display:flex; align-items:center; gap:4px;}
  /* -webkit-appearance:none is the fix, not just decoration — without it, some mobile browsers
     (iOS Safari especially) render the CLOSED select with their own native control chrome instead
     of respecting this background/color, which can pair a light system background with this
     white text and make it unreadable even though it looks fine in a desktop preview. Removing the
     native appearance also removes the native dropdown arrow, so a custom chevron replaces it. */
  #gw-time-select, #gw-equip-select{
    background:none; border:none; color:#fff; padding:0 2px; font-size:13px; font-weight:700;
    font-family:var(--font-body); cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  #gw-time-select:focus, #gw-equip-select:focus{outline:none;}
  #gw-time-select option, #gw-equip-select option{background:var(--surface); color:#fff;}
  .gw-select-chevron{width:11px; height:11px; stroke:var(--muted); fill:none; stroke-width:2.8; flex:none; pointer-events:none;}
  /* the pill's own text color (#fff, set on #gw-time-select/#gw-equip-select above) would read as
     near-white-on-coral once the pill itself goes coral for the "on" state — needs its own override */
  #gw-controls.gw-travel-on .gw-pill-equip #gw-equip-select{color:var(--bg);}
  #gw-controls.gw-travel-on .gw-pill-equip .gw-select-chevron{stroke:var(--bg);}
  #gw-daytabs-menu, #gw-rate-drawer-backdrop, #gw-profile-drawer-backdrop{
    display:none; position:fixed; inset:0; background:rgba(12,20,32,0.7); z-index:120;
    align-items:flex-end; justify-content:center;
  }
  #gw-daytabs-menu.show, #gw-rate-drawer-backdrop.show, #gw-profile-drawer-backdrop.show{display:flex;}
  /* the rating sheet opens the instant a timer finishes — it has to sit above the timer drawer (210),
     not under it, or a rating that opens while that drawer is still mid-close is simply invisible */
  #gw-rate-drawer-backdrop{z-index:230;}
  .gw-daytabs-sheet{
    width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
    padding:10px 10px calc(20px + env(safe-area-inset-bottom, 0px)); max-height:70vh; overflow-y:auto;
  }
  .gw-daytabs-sheet-handle{width:36px; height:4px; border-radius:4px; background:var(--line-strong); margin:6px auto 14px;}
  .gw-daytabs-sheet-title{font-size:12px; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); padding:0 10px 10px;}
  /* the profile drawers' content sits flush with the sheet's own 10px inset (no per-row padding of
     its own) — the shared sheet-title class adds another 10px on top of that, which visibly
     misaligns the title from the rows below it here specifically, so this drawer's title is
     pulled back in line instead */
  #gw-profile-drawer-title{padding:0 0 10px;}

  /* ---- bottom floating nav ---- */
  #gw-pagetabs{
    display:flex; gap:4px; justify-content:space-between;
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(8px + env(safe-area-inset-bottom, 0px));
    width:calc(100% - 16px); max-width:464px; z-index:100;
    background:rgba(13,27,42,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:24px; padding:13px 20px;
    box-shadow:0 12px 24px rgba(0,0,0,0.45);
  }
  .gw-pagetab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; color:var(--muted);
  }
  .gw-pagetab svg{width:21px; height:21px; fill:var(--muted);}
  .gw-pagetab .gw-navlabel{
    font-family:var(--font-body); font-weight:700; font-size:10.5px; letter-spacing:0.01em;
  }
  .gw-pagetab .gw-navdot{display:none;}
  .gw-pagetab.active{color:var(--coral);}
  .gw-pagetab.active svg{fill:var(--coral);}
  .gw-page{padding:8px 20px 20px; min-height:70vh; min-height:70dvh; box-sizing:border-box;}

  /* ---- LOG expandable calendar ---- */
  .gw-cal-card{padding:16px;}
  .gw-cal-headrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .gw-cal-title{font-family:var(--font-display); font-weight:900; font-size:20px; color:#fff;}
  .gw-cal-toggle{
    display:flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
    color:var(--coral); font-family:var(--font-body); font-weight:800; font-size:13px; letter-spacing:0.02em; padding:4px;
  }
  .gw-cal-toggle svg{width:13px; height:13px; stroke:var(--coral); fill:none; stroke-width:2.6; transition:transform 0.2s;}
  .gw-cal-toggle.expanded svg{transform:rotate(180deg);}
  .gw-cal-navrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .gw-cal-navbtn{background:none; border:none; cursor:pointer; padding:4px 8px; display:flex;}
  .gw-cal-navbtn svg{width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2.6;}
  .gw-cal-navbtn:hover svg{stroke:var(--coral);}
  .gw-cal-navlabel{font-family:var(--font-body); font-weight:800; font-size:14px; color:#fff;}
  .gw-cal-today-link{text-align:center; font-size:11px; color:var(--coral); cursor:pointer; text-decoration:underline; margin:-4px 0 12px;}
  .gw-cal-dow-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .gw-cal-dow{text-align:center; font-size:10px; font-weight:800; letter-spacing:0.04em; color:var(--muted); text-transform:uppercase;}
  .gw-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .gw-cal-cell{text-align:center; padding:8px 2px; border-radius:10px; background:var(--surface-2); cursor:pointer; position:relative;}
  .gw-cal-cell:hover{background:#232f47;}
  .gw-cal-cell.today{box-shadow:inset 0 0 0 1px var(--coral);}
  .gw-cal-cell.selected{background:var(--coral);}
  .gw-cal-cell.selected .gw-cal-num{color:var(--bg);}
  .gw-cal-cell.outside{opacity:0.35; cursor:default;}
  .gw-cal-num{font-size:14px; font-weight:800; color:#fff; font-family:var(--font-body);}
  .gw-cal-dot{width:4px; height:4px; border-radius:50%; background:var(--coral); margin:4px auto 0;}
  .gw-cal-cell.selected .gw-cal-dot{background:var(--bg);}
  .gw-cal-trophy{display:flex; justify-content:center; color:var(--coral); margin-top:3px;}
  .gw-cal-cell.selected .gw-cal-trophy{color:var(--bg);}

  /* ---- LOG "last trained" chips ---- */
  .gw-lasttrained-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;}
  .gw-lasttrained-chip{background:var(--surface-2); border-radius:12px; padding:12px 4px; text-align:center;}
  .gw-lasttrained-num{font-family:var(--font-num); font-weight:900; font-size:20px; color:var(--coral); line-height:1;}
  .gw-lasttrained-chip.never .gw-lasttrained-num{color:var(--muted);}
  .gw-lasttrained-chip.stale .gw-lasttrained-num{color:var(--warn);}
  .gw-lasttrained-label{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.02em; font-weight:800; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- LOG timeline ---- */
  .gw-timeline{position:relative; margin-left:5px; padding-left:22px; border-left:2px solid var(--line-strong);}
  .gw-timeline-node{position:relative; margin-bottom:22px;}
  .gw-timeline-node:last-child{margin-bottom:0;}
  .gw-timeline-dot{position:absolute; left:-28px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--coral); border:3px solid var(--bg);}
  .gw-timeline-date{font-family:var(--font-body); font-weight:800; font-size:12.5px; color:var(--muted); letter-spacing:0.02em; text-transform:uppercase; margin-bottom:8px;}
  .gw-timeline-card{background:var(--surface); border-radius:16px; padding:16px;}
  .gw-timeline-card + .gw-timeline-card{margin-top:8px;}
  .gw-timeline-title-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .gw-timeline-title{font-family:var(--font-body); font-weight:800; font-size:15px; color:#fff;}
  .gw-timeline-time{font-family:var(--font-mono); font-size:11px; color:var(--muted); flex:none;}
  .gw-timeline-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .gw-timeline-badge{font-size:10px; font-weight:900; letter-spacing:0.03em; text-transform:uppercase; color:var(--coral); background:var(--coral-wash); border-radius:999px; padding:3px 8px;}
  .gw-timeline-badge.badge-rx{color:var(--good); background:rgba(95,208,163,0.14);}
  .gw-timeline-badge.badge-scaled{color:var(--muted); background:var(--surface-2);}
  .gw-timeline-badge.badge-pr{color:var(--warn); background:rgba(245,179,80,0.16); display:inline-flex; align-items:center; gap:3px;}
  .gw-timeline-badge.badge-pr svg{width:10px; height:10px; flex:none;}
  .gw-timeline-result{font-family:var(--font-num); font-weight:900; font-size:24px; color:var(--coral); margin-top:10px;}
  .gw-timeline-result-sub{font-size:11px; color:var(--muted); font-weight:700; margin-top:1px;}
  .gw-timeline-stats{display:flex; gap:8px; margin-top:12px;}
  .gw-timeline-stat{flex:1 1 120px; max-width:160px; min-width:0; background:var(--surface-2); border-radius:10px; padding:8px; text-align:center;}
  .gw-timeline-stat-num{font-family:var(--font-num); font-weight:900; font-size:14px; color:var(--coral); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gw-timeline-stat-label{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:800; margin-top:2px;}
  .gw-timeline-meta{color:var(--muted); font-size:12px; margin-top:10px; line-height:1.5;}
  /* --muted-2 only measures ~3:1 against this dark card background, below the 4.5:1 small-text
     floor — --muted (~5.3:1) reads the same "quiet" but stays legible */
  .gw-timeline-caveat{color:var(--muted); font-size:11px; margin-top:6px; font-style:italic;}
  .gw-timeline-notes{color:var(--text); opacity:0.82; font-size:12.5px; margin-top:10px; line-height:1.5; font-style:italic; padding-left:10px; border-left:2px solid var(--line-strong);}

  #gw-focusline{display:none;}
  .gw-daytabs-sheet-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 12px; border-radius:12px; cursor:pointer; color:#fff;
    font-family:var(--font-body); font-weight:700; font-size:14.5px;
  }
  .gw-daytabs-sheet-item:hover{background:var(--surface-raised);}
  .gw-daytabs-sheet-item.active{background:var(--coral-wash); color:var(--coral);}
  .gw-daytabs-sheet-item .gw-rec-pill{
    font-size:10px; font-weight:900; letter-spacing:0.03em; text-transform:uppercase; color:var(--coral);
    background:var(--coral-wash); border-radius:999px; padding:3px 8px;
  }

  #gw-timebanner{
    font-size:12.5px; color:var(--muted); background:none; border:none;
    padding:0 0 14px; margin-bottom:0; display:none; font-weight:600;
  }
  /* coach notes live in the intro, on the same gradient and in the same voice as the line above them */
  #gw-coachnotes{
    font-size:13.5px; color:#b9c6da; font-weight:500; line-height:1.5;
    margin:0 20px; padding:14px 0 0; border-top:1px solid var(--line-strong); display:none;
  }
  #gw-coachnotes strong{color:var(--coral); font-weight:800;}

  /* ---- workout board / cards ---- */
  #gw-board{ display:flex; flex-direction:column; gap:22px; margin-bottom:20px; }
  /* a section is a TITLE (with a check-off circle in front) sitting above a CARD that holds only the
     workout itself */
  .gw-section{ }
  .gw-section-titlerow{display:flex; align-items:center; gap:12px; padding:0 2px 10px;}
  .gw-section-title{font-family:var(--font-body); font-weight:800; font-size:16px; color:#fff; letter-spacing:0;}
  .gw-section-card{border-radius:18px; overflow:hidden; background:var(--surface); border:1px solid var(--line);}
  .gw-section.gw-section-done .gw-section-body > *:not(.gw-section-round-btn){opacity:0.68;}
  .gw-radio{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--line-strong); background:none; padding:0;
    display:inline-flex; align-items:center; justify-content:center; flex:none; cursor:pointer; color:transparent;
  }
  .gw-radio svg{width:13px; height:13px; display:block;}
  .gw-radio:hover{border-color:var(--coral);}
  .gw-radio.is-done{background:var(--good); border-color:var(--good); color:var(--bg);}
  .gw-tag{
    color:var(--coral); font-size:10px; font-weight:900; letter-spacing:0.04em;
    background:var(--coral-wash); padding:4px 10px; border-radius:999px; text-transform:uppercase;
  }
  /* swap out just this section — a quiet inline link under the start/round button, never competing with it */
  .gw-section-suggest{display:block; margin:2px auto 0; text-align:center;}
  .gw-timer-inline-btn{
    background:none; color:var(--bg); border:1px solid var(--coral); border-radius:999px;
    font-size:11px; font-weight:900; letter-spacing:0.02em; padding:8px 14px; cursor:pointer;
    text-transform:uppercase; font-family:var(--font-body);
  }
  .gw-timer-inline-btn:hover{background:rgba(255,107,107,0.1);}
  .gw-timer-full{
    display:block; width:100%; text-align:center; border-radius:8px; padding:0 20px; box-sizing:border-box;
    font-family:var(--font-body); font-size:18px; font-weight:900; text-transform:none;
    background:none; border:1px solid var(--coral); color:var(--coral); cursor:pointer;
  }
  .gw-timer-full:hover{background:rgba(255,107,107,0.08);}
  .gw-section-start-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--coral); border:none; border-radius:12px; padding:0 14px; margin-top:14px;
    color:var(--bg); font-family:var(--font-body); font-weight:800; font-size:13.5px;
    text-transform:none; letter-spacing:0; cursor:pointer;
  }
  .gw-section-start-btn:hover{background:var(--coral-dark);}
  .gw-section-start-btn:disabled{background:var(--surface-2); color:var(--muted); border:1px solid var(--line-strong); cursor:not-allowed;}
  .gw-section-start-btn:disabled:hover{background:var(--surface-2);}
  .gw-section-start-btn svg{width:16px; height:16px; flex:none;}
  .gw-section-start-btn span{overflow:hidden; text-overflow:ellipsis; min-width:0;}
  /* minimized timer's live progress — a dark fill that grows left-to-right under the label as
     the running-in-the-background timer advances, so "still going" is visible without opening it */
  .gw-resume-btn{position:relative; overflow:hidden;}
  .gw-resume-fill{position:absolute; top:0; left:0; bottom:0; width:0%; background:rgba(0,0,0,0.2); transition:width 0.3s linear; z-index:0;}
  .gw-resume-btn svg, .gw-resume-btn span{position:relative; z-index:1;}
  .gw-icon-btn{
    background:none; color:var(--muted); border:1px solid var(--line-strong); border-radius:50%;
    font-size:13px; width:34px; height:34px; line-height:1; cursor:pointer; padding:0; flex:none;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .gw-icon-btn:hover{border-color:var(--coral); color:var(--coral);}
  .gw-icon-btn.gw-done-btn.is-done{background:var(--good); border-color:var(--good); color:var(--bg);}

  .gw-section-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:14px;}
  .gw-section-headline{font-family:var(--font-body); font-weight:800; font-size:17px; color:#fff; line-height:1.3; text-transform:none; word-break:break-word;}
  .gw-headline-row{display:flex; flex-direction:column; align-items:flex-start; gap:6px;}
  .gw-headline-row .gw-tag{flex-shrink:0;}
  .gw-section-detail{font-family:var(--font-body); font-weight:500; font-size:13.5px; color:var(--text); line-height:1.7; white-space:pre-line;}
  .gw-format-explainer{font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--muted); line-height:1.4;}
  .gw-roundlog{display:flex; flex-direction:column; gap:2px; width:100%;}
  .gw-roundlog:empty{display:none;}
  /* in the timer drawer the rounds sit above the clock in a capped-height strip that scrolls on its own,
     so a long AMRAP never pushes the clock or the controls off screen */
  #gw-focus .gw-roundlog{max-height:min(22dvh, 132px); overflow-y:auto; overscroll-behavior:contain; flex:none;}
  #gw-focus .gw-roundlog-row{padding:8px 2px; flex:none;}
  .gw-roundlog-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);
    font-family:var(--font-body); font-weight:700; font-size:14px; color:#fff;
  }
  .gw-roundlog-row .gw-roundlog-time{color:var(--muted); font-family:var(--font-mono);}
  .gw-roundlog-row .gw-roundlog-delta{font-size:12px; margin-left:8px;}
  .gw-roundlog-delta.pos{color:var(--danger);}
  .gw-roundlog-delta.neg{color:#fff;}
  .gw-roundlog-done{font-family:var(--font-display); font-weight:900; font-size:12px; letter-spacing:0.04em; color:var(--coral); text-transform:uppercase; padding-top:8px;}
  .gw-movement-list{display:flex; flex-direction:column; gap:2px;}
  .gw-movement-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-family:var(--font-body); font-weight:600; font-size:14.5px; color:#fff;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .gw-movement-row:last-child{border-bottom:none;}
  .gw-movement-main{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
  .gw-movement-name{overflow-wrap:anywhere;}
  .gw-movement-tappable{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .gw-movement-tappable .gw-movement-name::after{
    content:'i'; display:inline-block; box-sizing:border-box; width:12px; height:12px; margin-left:6px; vertical-align:1px;
    border-radius:50%; background:var(--line-strong); color:var(--muted);
    font:800 8px/12px var(--font-body); font-style:normal; text-align:center;
  }
  .gw-movement-tappable:active .gw-movement-name{color:var(--coral);}
  .gw-movement-tappable:focus-visible{outline:2px solid var(--coral); outline-offset:2px; border-radius:6px;}
  .gw-movement-reps{color:var(--muted); font-size:12px; font-weight:600;}

  .gw-setlist{width:100%;}
  .gw-setlist-row-done{opacity:0.45;}
  .gw-setlist-done-badge{color:var(--good); display:flex; flex:none; margin-left:auto;}
  .gw-load-name{flex:1; min-width:0; color:var(--text); font-weight:600; font-size:13.5px;}
  .gw-setlist-weight{display:flex; align-items:center; gap:5px; flex:none;}
  .gw-setlist-weight input{
    height:34px; background:var(--surface-2); border:1px solid var(--line-strong); color:#fff;
    border-radius:7px; text-align:center; font-size:13px; font-weight:800; font-family:var(--font-body);
  }
  .gw-setlist-weight input{width:64px;}
  .gw-setlist-weight span{font-size:11px; color:var(--muted); font-weight:700;}
  /* add / remove a set: plain inline links, a step quieter than the timer and refresh buttons */
  .gw-setlist-links{display:flex; gap:18px; margin-top:-2px;}
  .gw-inline-link{
    background:none; border:none; padding:6px 0; cursor:pointer; font-family:var(--font-body); font-weight:700;
    font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px;
  }
  .gw-inline-link:hover{color:var(--coral);}
  .gw-inline-link:disabled{opacity:0.4; cursor:default; text-decoration:none;}

  .gw-drawer-handle{width:36px; height:4px; border-radius:4px; background:var(--line-strong); margin:6px auto 16px;}

  #gw-empty{ text-align:center; padding:60px 20px; color:var(--muted); }
  #gw-empty .gw-btn{margin-top:14px;}
  .gw-plates{font-size:12px; color:#fff; font-weight:700;}

  #gw-actions{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
  #gw-actions .gw-btn-row{width:100%;}
  #gw-actions > .gw-btn-hero{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--coral); color:var(--bg); border:none; border-radius:999px;
    padding:0 19px; font-family:var(--font-body); font-size:15px; font-weight:800; text-transform:none; letter-spacing:0;
    box-shadow:0 10px 28px rgba(255,107,107,0.28);
    margin-bottom:10px;
  }
  #gw-actions > .gw-btn-hero:hover{background:var(--coral-dark); box-shadow:0 10px 32px rgba(255,107,107,0.42);}
  #gw-actions > .gw-btn-hero svg{width:24px; height:24px;}
  #gw-actions > .gw-btn-secondary{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:none; color:var(--muted); border:1px solid var(--line-strong); border-radius:10px;
    padding:0 14px; font-family:var(--font-body); font-size:13px; font-weight:800; letter-spacing:0.02em;
  }
  #gw-actions > .gw-btn-secondary:hover{color:#fff; border-color:var(--coral);}
  #gw-actions > .gw-btn-secondary svg{width:15px; height:15px;}
  .gw-btn-with-icon{display:inline-flex; align-items:center; gap:8px;}
  .gw-btn-with-icon svg{flex-shrink:0;}
  .gw-icon-btn svg{width:16px; height:16px; display:block;}
  #gw-actions .gw-btn.gw-primary, #gw-actions .gw-btn.gw-teal{width:100%;}
  .gw-rate-block{background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:16px; width:100%;}
  .gw-rate-block .gw-rate-label{font-size:11px; font-weight:900; color:#fff; letter-spacing:0.02em; text-transform:uppercase; margin-bottom:12px; font-family:var(--font-body);}
  .gw-rate-options{display:flex; gap:8px;}
  .gw-rate-options .gw-btn{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    border-radius:4px; text-align:center; padding:8px; font-size:12px;
  }
  .gw-rate-options .gw-btn.gw-primary{background:var(--surface-2); border-color:var(--coral); color:var(--coral);}

  #gw-log-content, #gw-profile-content{
    background:transparent; padding:0; margin-bottom:20px;
  }
  #gw-log-content h3, #gw-profile-content h3{margin:0 0 12px; font-size:13px; letter-spacing:0.08em; color:var(--muted); font-weight:900; text-transform:uppercase; font-family:var(--font-body);}
  .gw-card{background:var(--surface); border-radius:16px; padding:20px; margin-bottom:20px;}
  .gw-setting-row{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .gw-setting-row label, .gw-setting-row > span:first-child{font-size:11px; color:var(--muted); font-weight:900; letter-spacing:0.04em; text-transform:uppercase; font-family:var(--font-body);}
  .gw-setting-row input, .gw-setting-row select, .gw-setting-row textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:#fff;
    border-radius:8px; padding:12px 16px; font-size:16px; font-weight:500; font-family:var(--font-body);
  }
  .gw-bw-label-row{display:flex; align-items:center; justify-content:space-between;}
  .gw-bw-label-row > span{font-size:11px; color:var(--muted); font-weight:900; letter-spacing:0.04em; text-transform:uppercase; font-family:var(--font-body);}
  .gw-unit-toggle{display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; flex:none;}
  .gw-unit-btn{
    background:none; border:none; padding:5px 11px; font-size:11px; font-weight:800; color:var(--muted);
    cursor:pointer; font-family:var(--font-body); letter-spacing:0.03em;
  }
  .gw-unit-btn.active{background:var(--coral); color:var(--bg);}
  .gw-activity-select{
    background:var(--surface-2); border:1px solid var(--line); color:#fff; border-radius:8px; padding:12px 16px; font-size:16px; width:100%; font-family:var(--font-body);
  }
  .gw-stats-row{display:flex; gap:10px; margin-top:16px;}
  .gw-stat-tile{flex:1; min-width:0; background:var(--surface-2); border-radius:12px; padding:12px 8px; text-align:center;}
  .gw-txt{font-family:var(--font-body) !important; font-weight:800 !important;} /* a value slot that holds words, not digits */
  .gw-stat-num{font-family:var(--font-num); font-weight:900; font-size:17px; color:var(--coral); line-height:1.15; overflow-wrap:break-word;}
  .gw-stat-label{font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-top:4px;}
  .gw-profile-list{background:var(--surface); border-radius:16px; overflow:hidden; margin-bottom:20px;}
  .gw-profile-list-row{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
    border-bottom:1px solid var(--line); cursor:pointer; font-weight:700; color:#fff; font-size:14px;
    font-family:var(--font-body);
  }
  .gw-profile-list-row:last-child{border-bottom:none;}
  .gw-profile-list-row:hover{background:var(--surface-raised);}
  .gw-profile-list-row svg{width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2.4; flex:none;}
  .gw-skill-group-title{
    font-size:11px; font-weight:900; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted);
    padding:14px 0 6px; font-family:var(--font-body);
  }
  .gw-skill-row{
    display:flex; align-items:center; justify-content:space-between; padding:11px 0;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .gw-skill-row:last-child{border-bottom:none;}
  .gw-skill-row-label{font-size:13.5px; font-weight:600; color:#fff; font-family:var(--font-body);}
  .gw-skill-row input[type=checkbox]{width:21px; height:21px; accent-color:var(--coral); flex:none;}
  .gw-skill-search{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:#fff;
    border-radius:10px; padding:11px 14px; font-size:15px; font-family:var(--font-body); margin-bottom:4px;
  }
  .gw-skill-search::placeholder{color:var(--muted);}

  /* ---- Profile: Equipment cards ---- */
  .gw-equip-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
  .gw-equip-card{background:var(--surface-2); border-radius:14px; padding:18px 10px 14px; text-align:center; position:relative; border:0; font:inherit; color:inherit; cursor:pointer; width:100%; transition:opacity .15s;}
  .gw-equip-card.off{opacity:.45;}
  .gw-equip-card.off .gw-equip-check{display:none;}
  .gw-equip-card:focus-visible{outline:2px solid var(--coral); outline-offset:2px;}
  .gw-plate-summary{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface-2); border-radius:14px; padding:12px 14px; margin-top:12px; font-size:13px; color:#fff;}
  .gw-plate-row{display:flex; align-items:center; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--line);}
  .gw-plate-size{font-size:14px; font-weight:700; color:#fff;}
  .gw-plate-stepper{display:flex; align-items:center; gap:10px;}
  .gw-plate-stepper button{min-width:38px; height:38px; border-radius:19px; border:0; background:var(--surface-2); color:#fff; font:inherit; font-size:18px; font-weight:700; cursor:pointer;}
  .gw-plate-stepper button.gw-plate-on{background:var(--coral); color:var(--bg);}
  .gw-plate-count{min-width:24px; text-align:center; font-weight:700; color:#fff; font-variant-numeric:tabular-nums;}
  .gw-equip-icon{
    width:44px; height:44px; border-radius:50%; background:var(--coral-wash); color:var(--coral);
    display:flex; align-items:center; justify-content:center; margin:0 auto 10px;
  }
  .gw-equip-name{font-size:13px; font-weight:700; color:#fff; font-family:var(--font-body);}
  .gw-equip-check{position:absolute; top:10px; right:10px; color:var(--coral); display:flex;}
  .gw-equip-check svg{width:14px; height:14px;}

  /* ---- Profile: Benchmarks ---- */
  .gw-benchmark-card{background:var(--surface-2); border-radius:14px; padding:14px; margin-bottom:10px;}
  .gw-benchmark-card:last-of-type{margin-bottom:0;}
  .gw-benchmark-headrow{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .gw-benchmark-name{font-family:var(--font-display); font-weight:900; font-size:18px; color:#fff;}
  .gw-benchmark-best{font-size:11.5px; color:var(--coral); font-weight:700; flex:none;}
  .gw-benchmark-detail{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .gw-activity-notes{
    width:100%; min-height:56px; background:var(--surface-2); border:1px solid var(--line); color:#fff;
    border-radius:8px; padding:12px 16px; font-size:16px; font-family:var(--font-body); resize:vertical;
  }
  .gw-split-inputs{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .gw-split-inputs input{
    width:64px; height:36px; background:var(--surface-2); border:1px solid var(--line); color:#fff;
    border-radius:6px; text-align:center; font-size:16px; font-weight:800; font-family:var(--font-body);
  }
  .gw-split-inputs span{color:var(--muted); font-size:12.5px; font-weight:700;}
  .gw-gloss-item{padding:10px 0; border-bottom:1px solid var(--line);}
  .gw-gloss-item .gw-gloss-name{font-weight:900; font-size:13px; color:var(--coral);}
  .gw-gloss-item .gw-gloss-desc{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .gw-gloss-item .gw-gloss-link{font-size:12px; color:#fff; font-weight:700; text-decoration:underline; display:inline-block; margin-top:4px;}
  #gw-toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:#fff; color:var(--bg); padding:10px 20px; border-radius:24px;
    font-size:13px; font-weight:800; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:150;
    font-family:var(--font-body);
  }
  #gw-toast.show{opacity:1;}
  #gw-modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(13,27,42,0.8); z-index:160;
    align-items:center; justify-content:center; padding:20px;
  }
  #gw-modal-backdrop.show{display:flex;}
  #gw-modal{
    background:var(--surface); border-radius:16px;
    max-width:360px; width:100%; padding:24px;
  }
  #gw-modal h4{margin:0 0 10px; color:var(--coral); font-size:22px; font-family:var(--font-display); font-weight:900; text-transform:uppercase;}
  #gw-modal p{margin:0; font-size:14px; line-height:1.6; color:var(--text); font-family:var(--font-body);}
  #gw-modal-link{margin-top:12px; display:none; font-family:var(--font-body);}
  #gw-modal-link a{color:#fff; font-size:13px; font-weight:700; text-decoration:underline; font-family:var(--font-body);}
  #gw-modal-link .gw-modal-credit{display:block; font-size:11px; color:var(--muted); margin-top:2px; font-family:var(--font-body);}
  #gw-modal button{margin-top:16px; width:100%;}

  /* ---- Timer Drawer: the timer opens as a bottom sheet over the homepage, not a separate page ---- */
  #gw-timer-drawer-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:210;
    align-items:flex-end; justify-content:center;
  }
  #gw-timer-drawer-backdrop.show{display:flex;}
  #gw-timer-drawer{
    width:100%; max-width:480px; max-height:92dvh; background:var(--surface);
    border-radius:22px 22px 0 0; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,0.5);
  }
  #gw-timer-drawer-scroll{overflow-y:auto; flex:1; padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px));}
  #gw-focus{display:flex; flex-direction:column; gap:18px; padding:10px 0 12px;}
  #gw-focus-header{
    display:flex; justify-content:space-between; align-items:center; flex:none;
    padding:8px 16px 4px;
  }
  #gw-focus-header-name{
    font-family:var(--font-display); font-weight:900; font-size:18px; color:#fff; text-transform:uppercase; letter-spacing:0.01em;
  }
  #gw-focus-close{
    width:36px; height:36px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line-strong);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  #gw-focus-close:hover{border-color:var(--coral); color:var(--coral);}
  #gw-focus-close svg{width:18px; height:18px;}
  .gw-focus-tapcounter{
    background:var(--surface); border:1px solid var(--coral); border-radius:16px; padding:16px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .gw-focus-tapcounter-label{font-size:12px; font-weight:900; letter-spacing:0.04em; text-transform:uppercase; color:var(--coral); font-family:var(--font-body);}
  .gw-focus-tapcounter-number{font-family:var(--font-mono); font-weight:700; font-size:32px; color:#fff;}
  .gw-focus-tapcounter.gw-tap-flash{background:var(--coral-dark);}
  .gw-focus-headrow{display:flex; align-items:center; justify-content:space-between;}
  .gw-focus-section-name{font-family:var(--font-display); font-weight:900; font-size:26px; color:#fff; text-transform:uppercase;}
  .gw-focus-section-name .gw-focus-num{color:var(--coral);}
  .gw-focus-tag{font-size:10px; font-weight:900; letter-spacing:0.04em; color:var(--coral); text-transform:uppercase; background:var(--surface); border:1px solid var(--line-strong); padding:5px 10px; border-radius:999px;}

  .gw-focus-detail{
    background:var(--surface); border-radius:16px; padding:16px 18px; font-size:14px; color:var(--text);
    line-height:1.6; white-space:pre-line; font-family:var(--font-body); font-weight:500;
  }

  .gw-starttimer-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--coral); border:none; border-radius:14px; padding:0 18px;
    color:var(--bg); font-family:var(--font-body); font-weight:900; font-size:15px;
    text-transform:uppercase; letter-spacing:0.02em; cursor:pointer;
  }
  .gw-starttimer-btn:hover{background:var(--coral-dark);}
  .gw-starttimer-btn svg{width:20px; height:20px;}
  .gw-section-round-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--coral); border:none; border-radius:12px; padding:0 14px; margin-top:14px;
    color:var(--bg); font-family:var(--font-body); font-weight:800; font-size:13.5px;
    text-transform:none; letter-spacing:0; cursor:pointer;
  }
  .gw-section-round-btn:hover{background:var(--coral-dark);}
  .gw-section-round-btn span:not(.gw-round-target):not(.gw-navmid-badge){overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .gw-round-target{opacity:0.7; font-size:13px;}
  .gw-section-round-btn:disabled{background:var(--good); color:var(--bg); cursor:default;}
  .gw-section-round-btn:disabled svg{width:18px; height:18px;}
  .gw-navmid-badge{
    width:22px; height:22px; border-radius:50%; background:var(--bg); color:var(--coral);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; font-family:var(--font-mono);
  }

  /* ---- Timer: big plain numbers (like the Apple stopwatch) and two big round controls under them —
     the left one is whatever the workout needs (round counter / next set), the play button sits at the right ---- */
  .gw-stage{
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:4px 4px 4px;
  }
  .gw-dial{display:flex; justify-content:center; width:100%; padding:18px 0 6px;}
  .gw-dial-center{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; width:100%; text-align:center;}
  .gw-stage-headline{font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--muted); text-align:center; min-height:18px;}
  .gw-dial-clock{font-family:var(--font-mono); font-weight:700; font-size:76px; line-height:1.05; color:#fff; letter-spacing:-0.03em;}
  .gw-dial-clock.warn{color:var(--danger);}
  .gw-dial-secondary{font-family:var(--font-body); font-weight:600; font-size:12px; color:var(--muted); text-align:center; min-height:0;}
  .gw-dial-secondary:empty{display:none;}
  .gw-stage-weight{display:flex; align-items:center; gap:16px; margin:2px 0;}
  .gw-stage-weight button{
    width:36px; height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--line-strong);
    color:var(--coral); font-size:16px; font-weight:900; cursor:pointer; font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .gw-stage-weight-mid{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .gw-stage-weight-val{font-family:var(--font-mono); font-weight:700; font-size:24px; color:#fff; min-width:80px; text-align:center;}
  .gw-stage-weight-val span{font-family:var(--font-body); font-weight:700; font-size:11px; color:var(--muted); margin-left:4px;}
  .gw-stage-weight-plates{font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--muted);}

  /* the control row: left = round counter / next, right = play-pause, both the same size */
  .gw-ctl-row{display:flex; justify-content:space-between; align-items:center; width:100%; padding:2px 14px 0;}
  .gw-ctl-slot{flex:1; min-width:0; height:84px; display:flex; align-items:center; justify-content:flex-start;}
  .gw-ctl{
    width:84px; height:84px; border-radius:50%; border:none; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:var(--surface-raised); color:#fff; font-family:var(--font-body);
    box-shadow:0 0 0 3px var(--surface), 0 0 0 4.5px var(--line-strong);
    -webkit-tap-highlight-color:transparent; transition:background 0.12s ease;
  }
  .gw-ctl:disabled{opacity:0.4; cursor:default;}
  .gw-ctl.gw-tap-flash{background:var(--coral-wash);}
  .gw-dial-play{background:var(--coral); color:var(--bg); box-shadow:0 0 0 3px var(--surface), 0 0 0 4.5px rgba(255,107,107,0.5);}
  .gw-dial-play svg{width:30px; height:30px;}
  .gw-dial-play.is-running{background:var(--coral-wash); color:var(--coral);}
  .gw-stage-round-badge{font-family:var(--font-mono); font-weight:700; font-size:28px; line-height:1; color:#fff;}
  .gw-stage-round-badge.gw-long{font-size:21px;}
  .gw-stage-round-label{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); line-height:1.1; text-align:center;}
  /* what's being done now, and what's next (Tabata / alternating EMOM) */
  .gw-nownext{flex-direction:column; justify-content:center; gap:10px; min-width:0; padding-right:12px;}
  .gw-nn-block{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .gw-nn-label{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);}
  .gw-nn-name{font-size:15px; font-weight:700; color:var(--muted); line-height:1.2; overflow-wrap:anywhere;}
  .gw-nn-sub{font-size:13px; font-weight:600; color:var(--muted); line-height:1.2;}
  .gw-nn-name.gw-nn-now{font-size:19px; font-weight:800; color:var(--coral);}
  .gw-nn-name.gw-nn-now.rest{color:#fff;}
  /* hold-to-finish: the ring around the circle fills while the press is held */
  .gw-hold-finish{position:relative; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; touch-action:none; --p:0;}
  .gw-hold-finish::before{
    content:''; position:absolute; inset:-5px; border-radius:50%; pointer-events:none;
    background:conic-gradient(var(--coral) calc(var(--p) * 360deg), transparent 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  }
  .gw-hold-finish svg{width:24px; height:24px;}
  .gw-hold-finish span{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); line-height:1.15; text-align:center; max-width:58px; white-space:normal;}
  .gw-floatcard-next{display:flex;}
  .gw-floatcard-next .gw-ctl svg{width:24px; height:24px; color:#fff;}
  .gw-floatcard-next .gw-ctl span{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);}

  .gw-showworkout-toggle{
    display:flex; align-items:center; gap:6px; justify-content:center; background:none; border:none;
    color:var(--muted); font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer; padding:10px;
    margin:0 auto; -webkit-tap-highlight-color:transparent;

  .gw-focus-phaseword{font-family:var(--font-body); font-weight:800; font-size:13px; text-transform:uppercase; color:var(--coral); min-height:16px; letter-spacing:0.1em;}
  .gw-focus-phaseword.rest{color:var(--muted);}





  .gw-focus-nav{display:flex; gap:10px;}
  .gw-focus-nav .gw-btn{flex:1; padding:18px;}
  .gw-focus-exit{
    text-align:center; font-size:12px; color:var(--muted); font-weight:700; text-decoration:underline;

  #gw-timerstop-backdrop{

    align-items:center; justify-content:center; padding:20px;
  }
  #gw-timerstop-backdrop.show{display:flex;}
  #gw-timerstop{background:var(--surface); border-radius:16px; max-width:340px; width:100%; padding:24px;}
  #gw-timerstop h4{margin:0 0 10px; color:#fff; font-size:20px; font-family:var(--font-display); font-weight:900; text-transform:uppercase;}
  #gw-timerstop p{margin:0 0 18px; font-size:13.5px; line-height:1.55; color:var(--muted); font-family:var(--font-body);}
  .gw-stopconfirm-row{display:flex; gap:10px;}
  .gw-stopconfirm-row .gw-btn{flex:1; padding:14px; font-size:13px;}


  /* ---- new timer-taxonomy widgets: buy-in/out, alternate/cycle badges, AMReps tally ---- */

    background:var(--surface); border:1px dashed var(--line-strong); border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; gap:12px; cursor:pointer;

  .gw-buyin-check{

  .gw-buyin-check svg{width:14px; height:14px;}
  .gw-buyin-text{flex:1;}
  .gw-buyin-label{font-size:10px; font-weight:900; letter-spacing:0.05em; text-transform:uppercase; color:var(--coral);}

  .gw-splitlog-row{

    font-family:var(--font-body); font-weight:700; font-size:13.5px; color:#fff;
  }

// Falls back to localStorage when not running inside a Claude artifact (e.g. deployed standalone).
if(!window.storage){
  window.storage = {
    async get(key){ const v = localStorage.getItem(key); return v!=null ? {key, value:v, shared:false} : null; },
    async set(key, value){ localStorage.setItem(key, value); return {key, value, shared:false}; },
    async delete(key){ const existed = localStorage.getItem(key)!=null; localStorage.removeItem(key); return {key, deleted:existed, shared:false}; },
    async list(prefix){ const keys = Object.keys(localStorage).filter(k=>!prefix || k.startsWith(prefix)); return {keys, prefix, shared:false}; }
  };

const LIFT_PATTERNS = {backSquat:'squat', frontSquat:'squat', deadlift:'hinge', floorPress:'push', powerClean:'hinge', powerSnatch:'hinge'};
// tallies how often each pattern showed up in this focus's last few logged sessions — the basis for
// steering movement selection away from whatever's already been hammered
function recentPatternTally(type, sessions){
  const typeHistory = state.history.filter(h=>h.type===type && h.movementNames);
  const tally = {};
  typeHistory.slice(-sessions).forEach(h=>h.movementNames.forEach(name=>{
    const p = MOVEMENT_PATTERNS[name];
    if(p) tally[p] = (tally[p]||0)+1;
  }));
  return tally;
}

  const set = new Set();

  return [...set].sort();
}

// since a fully-filtered pool would leave a format builder nothing to pick from
function knownSkillFilter(pool){
  if(!state.unknownSkills || !state.unknownSkills.length) return pool;
  const filtered = pool.filter(m=>!state.unknownSkills.includes(m.name));
  return filtered.length >= 2 ? filtered : pool;
}

  'Exercise reference data adapted from the Open WOD Database (WodWiz), https://www.wodwiz.com/benchmarks, licensed CC BY 4.0, with changes.',
  'Muscle information adapted from the Free Exercise DB (public domain).',
  'Programming ideas drawn from CrossFit’s published training guides and articles. WODshed is not affiliated with or endorsed by CrossFit, LLC.'
];
function exNorm(s){
  return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()
    .split(' ').map(w=>w.length>3 && w.endsWith('s') ? w.slice(0,-1) : w).join(' ');
}
let EX_REF_INDEX = null;
function exRefIndex(){
  if(EX_REF_INDEX) return EX_REF_INDEX;
  EX_REF_INDEX = new Map();
  Object.keys(EX_REF).forEach(n=>EX_REF_INDEX.set(exNorm(n), n)); // real names win over aliases
  Object.keys(EX_REF).forEach(n=>(EX_REF[n].a||[]).forEach(a=>{ const k = exNorm(a); if(!EX_REF_INDEX.has(k)) EX_REF_INDEX.set(k, n); }));
  return EX_REF_INDEX;
}
// canonical app name for any spelling we know, or null
function exCanonical(name){ return exRefIndex().get(exNorm(name)) || null; }
function exRef(name){ const c = exCanonical(name); return c ? Object.assign({name:c}, EX_REF[c]) : null; }
// pattern lookups fall back to the original tables, so nothing changes when a name is unknown
function exPattern(name){ const r = exRef(name); return r ? r.p : null; }
function exEquipment(name){
  const r = exRef(name);
  if(r) return r.e;
  for(const k in MOVEMENT_LIB){ const m = MOVEMENT_LIB[k].find(x=>x.name===name); if(m) return m.equip==='none' ? [] : [m.equip]; }
  return null;
}
// consistency check used by the test page: every library name resolves, equipment agrees with the
// original single-label field, and no alias points at two different exercises
function exRefSelfCheck(){
  const problems = [];
  const names = new Set();
  Object.values(MOVEMENT_LIB).forEach(pool=>pool.forEach(m=>{
    names.add(m.name);
    const r = exRef(m.name);
    if(!r){ problems.push('no reference for '+m.name); return; }
    if(r.name!==m.name) problems.push(m.name+' resolves to '+r.name);
    const want = m.equip==='none' ? '' : m.equip;
    if(r.e.length<=1 && typeof r.e[0]!=='object' && r.e.join(',')!==want) problems.push(m.name+' equipment '+r.e.join(',')+' vs '+want);
  }));
  Object.keys(MOVEMENT_PATTERNS).forEach(n=>{ if(!exRef(n)) problems.push('pattern name without reference: '+n); });
  const seen = {};
  Object.keys(EX_REF).forEach(n=>(EX_REF[n].a||[]).forEach(a=>{
    const k = exNorm(a); if(k===exNorm(n)) return;
    if(seen[k] && seen[k]!==n) problems.push('alias "'+a+'" used by both '+seen[k]+' and '+n);
    seen[k] = n;
  }));
  return {names:names.size, refs:Object.keys(EX_REF).length, problems};
}

// ---------- EQUIPMENT: what is switched on decides which exercises and templates can be picked ----------
const EQUIP_DEFAULT_ON = ['barbell','rack','plates','bar','rings','kb','rope','pvc']; // what every workout assumed before equipment was selectable
function equipmentSet(){ return state.bodyweightOnly ? new Set() : new Set(state.equipment); }
function equipmentCovers(needs){ const have = equipmentSet(); return needs.every(k=>Array.isArray(k) ? k.some(x=>have.has(x)) : have.has(k)); }
// lifts that need a rack. A front squat does not: light ones can be cleaned up, and the heavy Skill version asks for the rack itself.
const NEEDS_RACK = new Set(['Back Squat','Back-Rack Lunges','Bench Press','Close-Grip Bench Press','Incline Bench Press','Box Squat']);
// a loaded barbell movement needs the bar and plates; benchmarks only need the bar (see benchmarkNeeds)
function movementNeeds(m){
  const base = exEquipment(m.name) || (m.equip==='none' ? [] : [m.equip]);
  const needs = [];
  base.forEach(k=>{ if(k==='barbell') needs.push('barbell','plates'); else needs.push(k); });
  if(NEEDS_RACK.has(m.name)) needs.push('rack');
  return needs;
}
function movementAllowed(m){
  if(!equipmentCovers(movementNeeds(m))) return false;
  // a standard load the plates cannot make (the lighter of the two numbers) hides the movement from generated workouts
  const std = WOD_LOAD_STANDARDS[m.name];
  if(std && (exEquipment(m.name)||[]).includes('barbell') && std.w > maxBarbellLoad()) return false;
  return true;
}
// Skill, Warm-Up and Core templates are plain text, so what they need is read from the words in them.
// Each group lists alternatives (any one will do); every group has to be covered.
function templateNeedGroups(text, liftKey){
  let rest = String(text||'');
  const groups = [];
  if(liftKey) groups.push(['barbell'], ['plates']);
  if(/bar or rings/i.test(rest)){ groups.push(['bar','rings']); rest = rest.replace(/bar or rings/ig, ''); }
  if(/barbell|w-bar|main bar|2nd bar|\(rack\)/i.test(rest)) groups.push(['barbell']);
  if(/\(rack\)/i.test(rest)) groups.push(['rack']);
  if(/main bar/i.test(rest)) groups.push(['plates']);
  if(/\bkb\b|kettlebell/i.test(rest)) groups.push(['kb']);
  if(/dumbbell|\bdb\b/i.test(rest)) groups.push(['dumbbell']);
  if(/\bbox\b/i.test(rest)) groups.push(['box']);
  if(/toes to bar|knees to elbow|hanging|bar muscle-up|dead hang|hang from the bar/i.test(rest)) groups.push(['bar']);
  else if(/pull-up|chin-up|pull up/i.test(rest)) groups.push(['bar','rings']);
  if(/\brings?\b/i.test(rest)) groups.push(['rings']);
  if(/single unders?|double unders?|jump rope|\bunders\b/i.test(rest)) groups.push(['rope']);
  if(/pvc|dislocate|pass-through/i.test(rest)) groups.push(['pvc','barbell']);
  return groups;
}
function templateOk(text, liftKey){
  const have = equipmentSet();
  return templateNeedGroups(text, liftKey).every(g=>g.some(k=>have.has(k)));
}
// pools: bodyweight mode keeps its dedicated alternates; otherwise templates and movements are filtered
// by the Equipment list, and if that leaves a section with nothing, the bodyweight alternate stands in
function warmupPoolFor(type){
  if(state.bodyweightOnly) return WARMUPS_BW[type] || WARMUPS[type];
  const ok = WARMUPS[type].filter(t=>templateOk(t));
  return ok.length ? ok : (WARMUPS_BW[type] || WARMUPS[type]);
}
function skillPoolFor(type){
  if(state.bodyweightOnly) return SKILLS_BW[type];
  const ok = SKILLS[type].filter(s=>templateOk(s.text, s.liftKey));
  return ok.length ? ok : SKILLS_BW[type];
}
function movementPoolFor(type){ return MOVEMENT_LIB[type].filter(movementAllowed); }
function benchmarkNeeds(b){
  const seen = new Set(), needs = [];
  const add = k=>{ const id = JSON.stringify(k); if(!seen.has(id)){ seen.add(id); needs.push(k); } };
  if(b.equip && b.equip!=='none') add(b.equip);
  b.movements.forEach(m=>{ const e = exEquipment(m.name); if(e) e.forEach(add); if(NEEDS_RACK.has(m.name)) add('rack'); });
  return needs;
}

// ---------- FOCUSES ----------
// What the focus picker offers. Strength and Weightlifting are now one Heavy Lifting day (a heavy day can
// be any lift: squat, hinge, press or an Olympic lift). Each session is still saved as 'strength' or
// 'weightlifting', so earlier logs, loads and per-focus history keep their meaning. Accessory is no longer
// a day; its work lives in the Extra block (see pickExtra). Its key stays in DAY_TYPES so old logs display.
const FOCUS_CHOICES = [
  {key:'heavy', label:'Heavy Lifting', types:['strength','weightlifting']},
  {key:'gymnastics', label:'Gymnastics', types:['gymnastics']},
  {key:'conditioning', label:'Conditioning', types:['conditioning']}
];
function focusKeyOf(type){ const c = FOCUS_CHOICES.find(f=>f.types.includes(type)); return c ? c.key : type; }
function focusLabel(key){
  const c = FOCUS_CHOICES.find(f=>f.key===key); if(c) return c.label;
  const d = DAY_TYPES.find(x=>x.key===key); return d ? d.label : key;
}
function focusDetail(type){ const d = DAY_TYPES.find(x=>x.key===type); return (d && d.detail) || ''; }
function lastSessionDateForFocus(key){
  const c = FOCUS_CHOICES.find(f=>f.key===key);
  const types = c ? c.types : [key];
  let best = null;
  types.forEach(t=>{ const d = lastSessionDate(t); if(d!==null && (best===null || d>best)) best = d; });
  return best;
}
// turns a picker choice into the concrete session type the generator works with
function resolveFocus(key){
  const c = FOCUS_CHOICES.find(f=>f.key===key);
  if(!c) return key;
  if(c.types.length===1) return c.types[0];
  // no barbell on means no Olympic lifting: heavy work falls to the strength side
  if(!state.bodyweightOnly && (!state.equipment.includes('barbell') || !state.equipment.includes('plates'))) return 'strength';
  let bestDays = -1, pool = [];
  c.types.forEach(t=>{
    const last = lastSessionDate(t);
    const days = last===null ? 9999 : daysSince(last);
    if(days>bestDays){ bestDays = days; pool = [t]; } else if(days===bestDays){ pool.push(t); }
  });
  return pool[Math.floor(Math.random()*pool.length)];
}

function cooldownAreas(type, liftKey){
  if(type==='weightlifting') return ['lower','upper'];
  if(type==='gymnastics') return ['hang','upper'];

  return ['general','lower'];

function extraPoolFor(kind, type, liftKey){
  if(kind==='accessory'){

    const areas = cooldownAreas(type, liftKey);

function pickExtraKind(type){

// ---------- LOOK-BACK PLANNER ----------
// Programming Basics Part 2: review the last one to two weeks of training, find what was neglected, and
// set goals for the next workout. Here the review counts the CrossFit scaling patterns across logged
// WODs and Skill lifts, and today's WOD leans toward any pattern that was clearly light.
const LOOKBACK_DAYS = 14, LOOKBACK_MIN_SESSIONS = 3;
const PATTERN_PLAIN = {
  'upper-press': 'upper-body pressing', 'upper-pull': 'upper-body pulling', 'lower-press': 'squatting and lunging',
  'lower-pull': 'hinging and pulling from the floor'
}; // the four strength patterns; cardio is left out because most pools hold few cardio movements, so it would always look light
const LIFT_TO_SCALING_PATTERN = {squat:'lower-press', hinge:'lower-pull', push:'upper-press'};
function lookBack(){
  const since = Date.now() - LOOKBACK_DAYS*86400000;
  const recent = state.history.filter(h=>h.kind!=='external' && h.date>=since);
  const tally = {};
  Object.keys(PATTERN_PLAIN).forEach(k=>tally[k] = 0);
  recent.forEach(h=>{
    (h.movementNames||[]).forEach(n=>{ const p = exPattern(n); if(p in tally) tally[p]++; });
    const lp = h.liftKey && LIFT_PATTERNS[h.liftKey];
    if(lp && LIFT_TO_SCALING_PATTERN[lp]) tally[LIFT_TO_SCALING_PATTERN[lp]]++;
  });
  return {sessions: recent.length, tally};
}
// patterns clearly under-trained recently that today's pool can actually supply, or null when there is
// not enough recent history to judge
function lookBackGoals(pool){
  const lb = lookBack();
  if(lb.sessions < LOOKBACK_MIN_SESSIONS) return null;
  const vals = Object.values(lb.tally);
  const mean = vals.reduce((a,b)=>a+b,0) / vals.length;
  const gaps = Object.keys(lb.tally).filter(k=>lb.tally[k] < mean*0.5 && pool.some(m=>exPattern(m.name)===k));
  return gaps.length ? {gaps, sessions: lb.sessions} : null;
}
function lookBackNote(goals){
  return `The last ${LOOKBACK_DAYS} days (${goals.sessions} sessions) were light on ${goals.gaps.map(g=>PATTERN_PLAIN[g]).join(' and ')}, so today's WOD leans that way.`;
}

function wodMovementDisplayName(name, load){
  if(load !== undefined && load !== null) return load ? `${name} ${load}` : name; // a benchmark's own written load
  const std = WOD_LOAD_STANDARDS[name];
  return std ? `${name} ${std.w}/${std.m}` : name;
}
function loadPresetFor(liftKey, tier){
  const rx = LOAD_PRESETS[liftKey] || 45;
  if(tier==='scaled') return Math.round(rx*0.8/5)*5;
  if(tier==='rxPlus') return Math.round(rx*1.25/5)*5;
  return rx;
}
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
// movements where a single rep is inherently done on one side only — without a qualifier the rep
// count is genuinely ambiguous (10 total, or 10 each?). Movements whose own description already
// says "switch arms/sides between sets" (KB Snatch, KB Clean & Press, Renegade Rows) are left out
// on purpose — that phrasing already tells you the count is a total split across the switch.
const UNILATERAL_LEG_MOVEMENTS = new Set(['Front-Rack Lunges', 'Back-Rack Lunges', 'Dumbbell Overhead Lunges', 'Dumbbell Walking Lunges', 'Dumbbell Front-Rack Lunges', 'Bulgarian Split Squats', 'Shrimp Squats', 'Barbell Step-Ups', 'Dumbbell Box Step-Ups', 'KB Overhead Lunges', 'KB Front-Rack Lunges', 'Pistol Squats', 'Reverse Lunges', 'Walking Lunges', 'Barbell Walking Lunges']);
const UNILATERAL_ARM_MOVEMENTS = new Set(['Dumbbell Rows', 'Single-Arm Dumbbell Thrusters', 'Single-Arm KB Thrusters', 'Single-Arm KB Swings', 'KB Clean and Jerks', 'Dumbbell Cleans', 'Dumbbell Power Cleans', 'Dumbbell Squat Cleans', 'Dumbbell Hang Squat Cleans', 'Turkish Get-Ups', 'Single-Arm KB Push Press', 'KB Cleans', 'Dumbbell Snatches', 'Dumbbell Hang Power Cleans']);
function repsSuffixFor(name){
  if(UNILATERAL_LEG_MOVEMENTS.has(name)) return ' each leg';
  if(UNILATERAL_ARM_MOVEMENTS.has(name)) return ' each arm';
  return '';
}
function movementsFor(pool, type, n, volume, rungs){
  const defs = pickMovementsLRU(pool, type, n);
  return defs.map(m => ({ name:m.name, reps: rungs ? rungs.join('-') : repsFor(m, '', volume||1) }));
}
function singleMovementTask(pool, reps){
  const m = pool[Math.floor(Math.random()*pool.length)];
  const count = Math.max(m.step, Math.round(reps/m.step)*m.step);
  return {text:`${count} ${m.name}${repsSuffixFor(m.name)}`, name:m.name, reps:count};
}

// ---------- WOD FORMAT CATALOG ----------
// Each builder returns {formatDisplay, movements, timerSpec}. timerSpec is consumed directly by the
// Focus Mode timer engine (see focusOpenTimer / focusUpdateDisplay) — no text-parsing round trip needed.
const WOD_FORMAT_DEFS = {
  amrap(ctx){
    const minutes = ctx.wodMinutes || pickOne([10,12,15]);
    return { formatDisplay:`AMRAP ${minutes}'`, movements: movementsFor(ctx.pool, ctx.type, 3, ctx.volume),
      timerSpec:{kind:'AMRAP', minutes, mode:'rounds', label:'AMRAP'} };
  },
  amreps(ctx){
    const minutes = ctx.wodMinutes || pickOne([6,8,10]);
    return { formatDisplay:`AMReps ${minutes}'`, movements: movementsFor(ctx.pool, ctx.type, 1, ctx.volume),
      timerSpec:{kind:'AMRAP', minutes, mode:'reps', label:'AMReps'} };
  },
  amrapMulti(ctx){
    // total time = cycles*minutes + (cycles-1)*restMinutes — sized to land near the time budget
    // when one's set, instead of picking cycles/minutes/rest with no regard for it at all
    let minutes, cycles, restMinutes;
    if(ctx.wodMinutes){
      cycles = ctx.wodMinutes >= 20 ? pickOne([3,4]) : pickOne([2,3]);
      restMinutes = ctx.wodMinutes <= 15 ? 1 : pickOne([1,2]);
      minutes = Math.max(2, Math.round((ctx.wodMinutes - (cycles-1)*restMinutes) / cycles));
    } else {
      minutes = pickOne([4,5]); cycles = pickOne([3,4]); restMinutes = pickOne([1,2]);
    }
    return { formatDisplay:`${cycles} x AMRAP ${minutes}' (rest ${restMinutes}')`, movements: movementsFor(ctx.pool, ctx.type, 3, ctx.volume),
      timerSpec:{kind:'AMRAP', minutes, mode:'rounds', cycles, restMinutes, label:'Multiple AMRAP Intervals'} };
  },
  amrapBuyIn(ctx){
    const minutes = ctx.wodMinutes || pickOne([10,12]);
    const buyIn = singleMovementTask(ctx.pool, pickOne([30,40,50]));
    // the buy-in is a real part of the WOD (done once, before the clock's rounds), so it belongs
    // in the exercises list alongside everything else, not just mentioned in the description
    const movements = [{name:buyIn.name, reps:buyIn.reps, tag:'Buy-In'}, ...movementsFor(ctx.pool, ctx.type, 2, ctx.volume)];
    return { formatDisplay:`Buy-In + AMRAP ${minutes}'`, movements,
      timerSpec:{kind:'AMRAP', minutes, mode:'rounds', buyIn:{text:buyIn.text}, label:'AMRAP with Buy-In'} };
  },
  amrepsAscending(ctx){
    const minutes = ctx.wodMinutes || pickOne([8,10,12]);
    const increment = pickOne([2,3]);
    return { formatDisplay:`Ascending AMReps ${minutes}' (+${increment}/rd)`, movements: movementsFor(ctx.pool, ctx.type, 1, ctx.volume),
      timerSpec:{kind:'AMRAP', minutes, mode:'ascending', startReps:increment, increment, label:'Varying Ascending AMReps'} };
  },
  forTime(ctx){
    const cap = ctx.wodMinutes || null;
    return { formatDisplay: cap ? `FOR TIME - cap ${cap}'` : 'FOR TIME', movements: movementsFor(ctx.pool, ctx.type, 3, ctx.volume),
      timerSpec:{kind:'FORTIME', cap, label:'For Time'} };
  },
  rft(ctx){
    const rounds = ctx.mode==='short' ? 3 : pickOne([3,4,5]), cap = ctx.wodMinutes || null;
    return { formatDisplay: `${rounds} RFT` + (cap?` - cap ${cap}'`:''), movements: movementsFor(ctx.pool, ctx.type, 3, ctx.volume),
      timerSpec:{kind:'RFT', rounds, cap, label:'Rounds for Time'} };
  },
  rftSameLadder(ctx){
    const rungs = ctx.mode==='short' ? pickOne([[10,8,6],[5,4,3]]) : pickOne(CROSSFIT_REP_SCHEMES.ladderDesc), cap = ctx.wodMinutes || null;
    return { formatDisplay: rungs.join('-') + (cap?` - cap ${cap}'`:''), movements: movementsFor(ctx.pool, ctx.type, 3, ctx.volume, rungs),
      timerSpec:{kind:'LADDER', rungs, cap, label:'RFT: Same Varying Reps'} };
  },
  rftMultiLadder(ctx){
    const rungsA = ctx.mode==='short' ? pickOne([[10,8,6],[5,4,3]]) : pickOne(CROSSFIT_REP_SCHEMES.ladderDesc);
    const sameLen = CROSSFIT_REP_SCHEMES.ladderDesc.filter(r=>r.length===rungsA.length && r!==rungsA);
    const rungsB = sameLen.length ? pickOne(sameLen) : rungsA;
    const cap = ctx.wodMinutes || null;
    const defs = pickMovementsLRU(ctx.pool, ctx.type, 2);
    const movements = [
      {name:defs[0].name, reps:rungsA.join('-')},
      {name:(defs[1]||defs[0]).name, reps:rungsB.join('-')}
    ];
    return { formatDisplay: `${rungsA.join('-')} / ${rungsB.join('-')}` + (cap?` - cap ${cap}'`:''), movements,
      timerSpec:{kind:'LADDER', rungs:rungsA, cap, label:'RFT: Multiple Varying Reps'} };
  },
  forTimeRepeats(ctx){
    const rounds = ctx.mode==='short' ? 3 : pickOne([3,4,5]), restSeconds = ctx.mode==='short' ? 60 : pickOne([60,90,120]);
    const cap = ctx.wodMinutes || null;
    return { formatDisplay:`${rounds} x FOR TIME (rest ${restSeconds}s)` + (cap?` - cap ${cap}'`:''), movements: movementsFor(ctx.pool, ctx.type, 2, ctx.volume),
      timerSpec:{kind:'FORTIME_REPEATS', rounds, restSeconds, cap, label:'For Time Repeats'} };
  },
  rftBookends(ctx){
    const rounds = ctx.mode==='short' ? 3 : pickOne([3,4,5]), cap = ctx.wodMinutes || null;
    const buyIn = singleMovementTask(ctx.pool, pickOne([20,30]));
    const buyOut = singleMovementTask(ctx.pool, pickOne([20,30]));
    // buy-in and buy-out are real, once-through parts of the WOD — list them with the rest of the
    // exercises (buy-in first, buy-out last) instead of only mentioning them in the description
    const movements = [
      {name:buyIn.name, reps:buyIn.reps, tag:'Buy-In'},
      ...movementsFor(ctx.pool, ctx.type, 2, ctx.volume),
      {name:buyOut.name, reps:buyOut.reps, tag:'Buy-Out'}
    ];
    return { formatDisplay:`Buy-In + ${rounds} RFT + Buy-Out` + (cap?` - cap ${cap}'`:''), movements,
      timerSpec:{kind:'RFT', rounds, cap, buyIn:{text:buyIn.text}, buyOut:{text:buyOut.text}, label:'RFT with Bookends'} };
  },
  forTimeBetween(ctx){
    const rounds = ctx.mode==='short' ? 3 : pickOne([3,4]), cap = ctx.wodMinutes || null;
    const between = singleMovementTask(ctx.pool, pickOne([10,15,20]));
    const movements = [...movementsFor(ctx.pool, ctx.type, 2, ctx.volume), {name:between.name, reps:between.reps, tag:'Between Rounds'}];
    return { formatDisplay:`${rounds} RFT + ${between.text} between rounds` + (cap?` - cap ${cap}'`:''), movements,
      timerSpec:{kind:'RFT', rounds, cap, betweenMovement:{text:between.text}, label:'For Time with Movement In Between'} };
  }
};

const BENCHMARK_RETEST_DAYS = 21;

function eligibleBenchmarks(bw){
  return BENCHMARKS.filter(b => equipmentCovers(benchmarkNeeds(b)));
}
// picks the most-overdue eligible benchmark if one is due for a retest, else null
function dueBenchmark(){
  // at most one benchmark a week, so a long list of benchmarks never takes over every conditioning day
  if(state.history.some(h=>h.isBenchmark && daysSince(h.date) < 7)) return null;
  const candidates = eligibleBenchmarks(state.bodyweightOnly);
  let best = null, bestDays = -1;
  candidates.forEach(b=>{
    const hist = (state.benchmarks[b.name] && state.benchmarks[b.name].history) || [];
    const last = hist.length ? hist[hist.length-1].date : null;
    const days = last===null ? Infinity : daysSince(last);
    if(days >= BENCHMARK_RETEST_DAYS && days > bestDays){ bestDays = days; best = b; }
  });
  return best;
}
function computeBenchmarkScore(benchmark, perf){
  if(!perf) return null;
  if(benchmark.scoreType==='rounds'){
    if(perf.rounds==null) return null;
    return perf.rounds*(benchmark.repsPerRound||0) + (perf.extraReps||0);
  }
  if(benchmark.scoreType==='time'){
    if(!perf.time) return null;
    const parts = perf.time.split(':').map(Number);
    if(parts.length!==2 || parts.some(isNaN)) return null;
    return parts[0]*60 + parts[1];
  }
  return null;
}
// an AMRAP's real, comparable score is total reps — a benchmark already carries its reps-per-round,
// but a custom AMRAP doesn't store that anywhere on the history entry, so it's computed once here,
// at save time, from the live workout's actual movement list (skipping a Buy-In, which only
// happens once at the start, not every round, so it isn't part of the per-round rep count)
function computeAmrapTotalReps(w){
  const perf = w.wodPerformance;
  if(!perf || perf.rounds == null) return null;
  let repsPerRound = null;
  if(w.isBenchmark){
    const benchmark = BENCHMARKS.find(b=>b.name===w.benchmarkName);
    repsPerRound = benchmark ? benchmark.repsPerRound : null;
  } else if(w.wodMovements){
    repsPerRound = w.wodMovements.filter(m=>m.tag!=='Buy-In').reduce((sum,m)=> sum + (typeof m.reps==='number' ? m.reps : 0), 0);
  }
  if(!repsPerRound) return null;
  return perf.rounds*repsPerRound + (perf.extraReps||0);
}
function fmtBenchmarkScore(benchmark, score){
  if(score==null) return '—';
  if(benchmark.scoreType==='rounds') return `${score} reps`;
  return fmtClock(score);
}
// scores a benchmark result against its history, records it (so it shows up in the Profile
// Benchmarks drawer and resets dueBenchmark()'s 21-day clock), and flags a PR — shared by the
// auto-served benchmark flow in logWorkout() and the user-triggered Quick Log WOD flow, so a
// benchmark logged either way stays comparable to the same history
async function recordBenchmarkResult(benchmark, perf){
  const score = computeBenchmarkScore(benchmark, perf);
  if(!benchmark || score==null) return {score:null, isPR:false, message:null};
  const prevHist = (state.benchmarks[benchmark.name] && state.benchmarks[benchmark.name].history) || [];
  const prevBest = prevHist.length
    ? (benchmark.scoreType==='rounds' ? Math.max(...prevHist.map(h=>h.score)) : Math.min(...prevHist.map(h=>h.score)))
    : null;
  const isPR = prevBest!=null && ((benchmark.scoreType==='rounds' && score>prevBest) || (benchmark.scoreType==='time' && score<prevBest));
  state.benchmarks[benchmark.name] = state.benchmarks[benchmark.name] || {history:[]};
  state.benchmarks[benchmark.name].history.push({date: Date.now(), score});
  await saveBenchmarks();
  const message = isPR
    ? `New best on ${benchmark.name}! ${fmtBenchmarkScore(benchmark, score)} (previous: ${fmtBenchmarkScore(benchmark, prevBest)})`
    : (prevBest==null ? `${benchmark.name} baseline set: ${fmtBenchmarkScore(benchmark, score)}. Next retest will compare against this.` : null);
  return {score, isPR, message};
}

// ---------- EXERCISE GLOSSARY ----------
// Explains the workout format abbreviations (AMRAP, RFT, EMOM, etc.) — shown as clickable "FORMAT:" links
// Short, plain-English explainer shown directly under the format headline — uses the real
// prescribed numbers (minutes/rounds/work-rest) rather than generic copy.
// Detects a straight-sets rep scheme in Skill text (e.g. "5-5-3-3-2-2" or "5 x 5") so it can be
// rendered as a numbered checklist with a weight input per set. Returns an array of rep counts, or null.
// For non-timer steps (e.g. Warm-Up's "2X:" rounds) — how many rounds counts as done
function parseRoundTarget(text){
  if(!text) return 1;
  const m = text.match(/(\d+)\s*(?:x\b|sets?\b|rds?\b|rounds?\b)/i);
  return m ? Number(m[1]) : 1;
}

function refreshStepCompletion(w, currentKey, stepData){
  let done = false;
  if(stepData.timerSpec){
    done = !!(focusTimer && focusTimer.doneBeeped);
  } else {
    done = state.focusTapCount >= parseRoundTarget(stepData.text);
    if(done && !state.focusStepDone[currentKey]){
      const log = document.getElementById('gw-roundlog');
      if(log && !log.querySelector('.gw-roundlog-done')){
        const doneLine = document.createElement('div');
        doneLine.className = 'gw-roundlog-done';
        doneLine.textContent = 'DONE';
        log.appendChild(doneLine);
      }
    }
  }
  state.focusStepDone[currentKey] = done;
}

// Appends a round to the live in-content log, computing the split (time since last round) and
// the delta vs the previous split — matches the "Round 2  01:20  -10s" pattern from the design.
function buildRoundLogRow(entry){
  const row = document.createElement('div');
  row.className = 'gw-roundlog-row';
  let html = `<span>Round ${entry.round}</span>`;
  if(entry.split!=null){
    html += `<span><span class="gw-roundlog-time">${fmtClock(entry.split)}</span>`;
    if(entry.delta!=null && entry.delta!==0){
      const sign = entry.delta>0 ? '+' : '';
      html += `<span class="gw-roundlog-delta ${entry.delta>0?'pos':'neg'}">${sign}${entry.delta}s</span>`;
    }
    html += `</span>`;
  }
  row.innerHTML = html;
  return row;
}
function logRoundTap(elapsedSeconds){
  const log = document.getElementById('gw-roundlog');
  const roundNum = state.focusRoundLog.length + 1;
  const prevElapsed = state.focusRoundLog.length ? state.focusRoundLog[state.focusRoundLog.length-1].elapsedAtTap : 0;
  const splitSeconds = elapsedSeconds!=null ? Math.round(elapsedSeconds - prevElapsed) : null;
  const prevSplit = state.focusRoundLog.length ? state.focusRoundLog[state.focusRoundLog.length-1].split : null;
  const delta = (splitSeconds!=null && prevSplit!=null) ? splitSeconds - prevSplit : null;
  const entry = {round: roundNum, elapsedAtTap: elapsedSeconds, split: splitSeconds, delta};
  state.focusRoundLog.push(entry);
  if(log){ log.appendChild(buildRoundLogRow(entry)); log.scrollTop = log.scrollHeight; }
}

function timerExplainer(spec){
  if(!spec) return '';
  if(spec.kind==='AMRAP'){
    const buyPart = spec.buyIn ? ` Buy-in first: ${spec.buyIn.text}.` : '';
    if(spec.cycles) return `${spec.cycles} x ${spec.minutes} min AMRAP, rest ${spec.restMinutes} min between.${buyPart}`;
    if(spec.mode==='reps') return `Rack up as many total reps as you can.${buyPart}`;
    if(spec.mode==='ascending') return `Reps go up by ${spec.increment} every round — keep going as long as you can.${buyPart}`;
    return `Do as many rounds as you can.${buyPart}`;
  }
  if(spec.kind==='EMOM'){
    if(spec.openEnded) return spec.amrap ? `Do as many reps as you can each minute. Keep going until you can't hit the rep target.` : `Start a new round every minute. Keep going until you can't hold the pace.`;
    if(spec.alternate) return `New minute starts, alternate ${spec.alternate[0]} / ${spec.alternate[1]}. ${spec.minutes} times.`;
    return `New minute starts, do the work, rest till next minute. ${spec.minutes} times.`;
  }
  if(spec.kind==='TABATA'){
    if(spec.phases) return `${spec.phases.map(ph=>`${ph.sec}s ${ph.label.toLowerCase()}`).join(' → ')}. ${spec.rounds} rounds.`;
    if(spec.alternate) return `${spec.workSec}s ${spec.alternate[0]} / ${spec.workSec}s ${spec.alternate[1]}, ${spec.restSec}s rest between. ${spec.rounds} rounds total.`;
    return `${spec.workSec} sec work, ${spec.restSec} sec rest. ${spec.rounds} rounds.`;
  }
  if(spec.kind==='RFT'){
    const capPart = spec.cap ? ` — time cap ${spec.cap} min` : '';
    const bookends = [spec.buyIn ? `buy-in: ${spec.buyIn.text}` : null, spec.buyOut ? `buy-out: ${spec.buyOut.text}` : null].filter(Boolean).join(', ');
    const betweenPart = spec.betweenMovement ? ` ${spec.betweenMovement.text} between each round.` : '';
    return `For Time — ${spec.rounds} identical rounds, finish as fast as you can${capPart}.${betweenPart}` + (bookends ? ` (${bookends})` : '');
  }
  if(spec.kind==='LADDER'){
    const capPart = spec.cap ? ` — time cap ${spec.cap} min` : '';
    return `Finish as fast as you can${capPart}.`;
  }
  if(spec.kind==='FORTIME'){
    const capPart = spec.cap ? ` — time cap ${spec.cap} min` : '';
    return `One round through, finish as fast as you can${capPart}.`;
  }
  if(spec.kind==='FORTIME_REPEATS'){
    const capPart = spec.cap ? ` — time cap ${spec.cap} min` : '';
    return `${spec.rounds} efforts, each for time — rest ${spec.restSeconds}s between${capPart}. Every round is scored.`;
  }
  if(spec.kind==='INTERVAL'){
    // 'X Rest Between Sets' is a literal rest countdown tapped between sets — everything else
    // (e.g. 'For X Cycles') is a continuous running clock the lift happens inside of, not a rest
    if(spec.label==='X Rest Between Sets') return 'Rest between sets.';
    return spec.totalRounds ? `Every ${fmtMinutesShort(spec.minutes)} — ${spec.totalRounds} sets total.` : `Every ${fmtMinutesShort(spec.minutes)} — repeat as prescribed.`;
  }
  if(spec.kind==='COUNTDOWN') return `Go until the clock hits zero.`;
  return '';
}
