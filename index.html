  "KB Clean and Jerks": {"desc": "A kettlebell clean immediately followed by driving it overhead with a jerk-style dip and drive."},
  "KB Overhead Lunges": {"desc": "Lunge with a kettlebell locked out overhead throughout, which demands shoulder stability on top of the single-leg squat pattern."},
  "KB Front-Rack Lunges": {"desc": "Lunge holding one or two kettlebells in the front rack against the shoulders."},
  "American KB Swings": {"desc": "Kettlebell swing driven all the way to an overhead lockout at the top of each rep, rather than stopping at chest height."},
  "Single-Arm KB Swings": {"desc": "Kettlebell swing performed with one arm, often switching hands mid-set, which adds an anti-rotation core demand to the standard two-handed swing."},
  "Single-Arm KB Thrusters": {"desc": "Kettlebell thruster performed holding the bell in one arm's front rack, adding an anti-rotation core demand."},
  "Wall Ball Shots": {"desc": "Squatting with a medicine ball held at the chest, then standing and throwing it to hit a target on the wall at a marked height, catching it on the way down into the next squat.", "url": "https://www.crossfit.com/essentials/the-wall-ball"},
  "Ball Slams": {"desc": "Raising a medicine ball overhead and slamming it forcefully into the ground, then picking it back up for the next rep."},
  "Medicine Ball Cleans": {"desc": "A medicine ball pulled from the floor and received at the shoulder/chest in a partial squat, similar in spirit to a barbell clean but with a ball instead of a bar.", "url": "https://www.crossfit.com/essentials/the-medicine-ball-clean"},
  "Medicine Ball Sit-Ups": {"desc": "Sit-up performed holding a medicine ball at the chest (or throwing it to a partner at the top), adding load to the standard sit-up."},
  "Biking": {"desc": "Riding a prescribed distance or calorie count on a stationary bike."},
  "Bodyweight Clean and Jerk": {"desc": "A clean-and-jerk loaded relative to the athlete's own bodyweight rather than a fixed load, so the percentage, not the number on the bar, is the prescription."},
  "Burpee Bar Muscle-Ups": {"desc": "A standard burpee immediately followed by one bar muscle-up before the next rep begins."},
  "Burpee Muscle-Ups": {"desc": "A standard burpee immediately followed by one muscle-up before the next rep begins."},
  "Clean": {"desc": "Barbell pulled from the floor and received in a front-rack squat in one continuous motion, the catch-all term for the squat clean unless a variant is specified.", "url": "https://www.crossfit.com/essentials/the-clean-2"},
  "Double KB Farmers Carry": {"desc": "Walking a set distance holding a kettlebell in each hand at the sides."},
  "Double KB Front-Rack Carry": {"desc": "Walking a set distance holding a kettlebell in each hand racked at the shoulders."},
  "Double KB Front Rack Lunges": {"desc": "Lunge holding a kettlebell in each hand racked at the shoulders, alternating legs."},
  "Double KB Overhead Carry": {"desc": "Walking a set distance with a kettlebell locked out overhead in each hand."},
  "Dumbbell Carry": {"desc": "Carrying one or two dumbbells over a set distance, position (front rack, overhead, or at the sides) specified by the workout."},
  "Dumbbell Hang Split Snatch": {"desc": "Dumbbell snatch initiated from the hang and received in a front-to-back split stance overhead."},
  "Dumbbell Split Clean": {"desc": "Dumbbell clean received in a front-to-back split stance rather than a squat, similar in spirit to a split jerk's receiving position."},
  "Farmers Carry": {"desc": "Walking a set distance holding a heavy dumbbell (or other implement) in each hand at the sides, a grip- and core-bracing loaded carry."},
  "Forward Rolls": {"desc": "A tucked forward somersault along the ground, rolling from the shoulders through to standing."},
  "Freestanding Handstand Push-Ups": {"desc": "Handstand push-up performed balancing in the middle of the floor with no wall for support, which demands full handstand balance in addition to the press.", "url": "https://www.crossfit.com/essentials/the-freestanding-handstand-push-up"},
  "Handstand": {"desc": "Balancing inverted on the hands, whether freestanding or against a wall, holding the body in a straight vertical line.", "url": "https://www.crossfit.com/essentials/freestanding-handstand"},
  "Hanging Hip Touch": {"desc": "Hanging from a bar or rings, raising the legs to touch the hips to the bar/rings, an advanced core movement between knees-to-elbows and toes-to-bar in difficulty."},
  "Jerk": {"desc": "Barbell driven from the front rack to locked-out overhead using a dip-drive and a foot-split (or push jerk) receiving position, the second half of the clean-and-jerk."},
  "L Pull-Ups": {"desc": "Strict pull-up performed with the legs held straight out in front at a 90-degree angle (an L-sit position) for the entire rep, which adds a core-and-hip-flexor demand to the pull.", "url": "https://www.crossfit.com/essentials/the-l-pull-up"},
  "Muscle-Ups": {"desc": "A pull-up that continues past the bar/rings into a dip lockout above them in one continuous motion, which combines a pull and a press into a single rep."},
  "Overhead Walk": {"desc": "Walking a set distance with a loaded barbell locked out overhead, a loaded carry that tests overhead stability and core bracing under fatigue."},
  "Overhead Walking Lunges": {"desc": "Walking lunge performed with the arms locked out overhead throughout, adding a stability demand to the traveling lunge."},
  "Ring Handstand Push-Ups": {"desc": "Handstand push-up performed with the hands on gymnastics rings instead of the floor, adding significant instability to the press."},
  "Ring Lower": {"desc": "Lowering the body from a support or muscle-up position on the rings down to a hang (or through the dip) under control, isolating the eccentric portion of a ring movement."},
  "Shuttle Sprints": {"desc": "Sprinting to a marked line and back (or between two lines repeatedly) rather than a single straight-line distance."},
  "Snatch": {"desc": "Barbell pulled from the floor to locked-out overhead in one continuous motion, caught in a full overhead squat, the most technical lift in the sport.", "url": "https://www.crossfit.com/essentials/the-snatch"},
  "Sprinting": {"desc": "Running a short distance at maximum effort/speed."},
  "Triple Unders": {"desc": "Jump rope pass where the rope passes under the feet three times in a single jump, an advanced, very fast turn."},
  "Weighted Pull-Ups": {"desc": "Pull-up performed with additional external load (a vest, belt, or dumbbell between the feet) beyond bodyweight."},
  "A Skip": {"desc": "A running drill that pairs a skip with a high knee drive, one leg at a time."},
  "B Skip": {"desc": "A running drill like the A-skip, with the lower leg extended forward and then pulled down and back under the hip."},
  "Barbell Overhead Lunges": {"desc": "Barbell locked out overhead while lunging forward or walking, which combines overhead stability with a single-leg squat pattern."},
  "Barbell Squat Jumps": {"desc": "A jump from a squat with a light barbell held on the back, landing softly back into the squat."},
  "Behind the Neck Jerk": {"desc": "A jerk where the barbell starts and returns across the back of the shoulders, which asks for an upright torso and good shoulder mobility."},
  "Bradford Press": {"desc": "A barbell press that alternates between the front and back of the head, never locking out overhead, which keeps the shoulders under constant tension."},
  "Calf Raises": {"desc": "Rising onto the balls of the feet and lowering again, usually with added weight, to work the calf muscles."},
  "Copenhagen Plank": {"desc": "A side plank with the top leg resting on a bench and the bottom leg hanging beneath it, which loads the inner thigh."},
  "Cossack Squat": {"desc": "A wide-stance side-to-side squat, shifting weight fully onto one bent leg while the other stays straight, then shifting to the other side."},
  "Crab Walks": {"desc": "Moving on hands and feet with the belly facing up and the hips lifted off the floor."},
  "GHD Hip Extension": {"desc": "Hip-focused variation of the back extension on a GHD, emphasizing glute drive to extend the hips rather than lower-back rounding/extension.", "url": "https://www.crossfit.com/essentials/the-ghd-hip-extension"},
  "Glute Ham Raises": {"desc": "On a glute-ham developer, lowering the torso toward the floor from the knees, then curling back up with the hamstrings and glutes."},
  "Hip Extension": {"desc": "General term for extending the hips from a flexed position back to neutral/extended against resistance or bodyweight, as prescribed on a GHD or hyperextension bench."},
  "Jefferson Curls": {"desc": "Rolling down one vertebra at a time toward the floor under a light load and rolling back up, a loaded spinal flexion exercise."},
  "KB Halo": {"desc": "Circling a kettlebell around the head, close to the skull, reversing direction each rep or set, a shoulder-mobility and control movement, not a strength lift."},
  "KB Windmill": {"desc": "Standing with a kettlebell locked out overhead, hinging sideways at the hips to touch (or reach toward) the opposite foot while keeping the arm vertical, an overhead-stability and hip-mobility drill."},
  "Legless Rope Climbs": {"desc": "Rope climb performed using the arms and grip alone, with no assistance from the legs or feet on the rope.", "url": "https://www.crossfit.com/essentials/the-legless-rope-climb"},
  "Pull Over": {"desc": "Starting in a support position on a bar, rotating the body up and over the bar in a continuous swing to return to support facing the other way.", "url": "https://www.crossfit.com/essentials/the-pull-over"},
  "Ring Hamstring Curls": {"desc": "Lying on the back with the heels in rings, lifting the hips and curling the heels toward the glutes."},
  "Shuttle Runs": {"desc": "Running back and forth between two fixed points a set number of times, rather than a single straight-line distance."},
  "Ski Erg": {"desc": "A prescribed distance or calorie count on a SkiErg machine, mimicking a double-pole cross-country ski motion."},
  "Snatch Pull": {"desc": "The pulling portion of a snatch (floor to full extension, wide grip) performed without the catch, which builds pull speed and positions without receiving the bar."},
  "Sots Press": {"desc": "Overhead press performed from the bottom of an overhead squat position, bar taken from behind the neck, an advanced overhead-mobility and stability drill.", "url": "https://www.crossfit.com/essentials/the-sots-press"},
  "Squat Jerk": {"desc": "A jerk caught in a full overhead squat, with the barbell driven off the shoulders and received at depth."},
  "Strict Knee Raises": {"desc": "Hanging from a bar and raising the knees toward the chest without swinging."},
  "Strict Knees To Chest": {"desc": "Hanging from a bar and drawing the knees all the way to the chest under control, with no kip."},
  "Strides": {"desc": "Short, controlled accelerations of 50 to 100 meters run at a fast but relaxed pace, used for speed and as a warm-up."},
  "Tall Clean": {"desc": "A clean started from a standing position with the bar at the hips, catching it in a quarter squat or less with an emphasis on the fast turnover."},
  "Toy Soldier": {"desc": "Walking forward with straight legs, kicking each leg up toward the opposite outstretched hand."},
  "Z Press": {"desc": "A strict overhead press from a seated position on the floor with the legs out front, which removes any help from the legs."},
  "Knees to Elbows": {"desc": "Hang from the bar and bring your knees up until they touch your elbows, then lower under control. Keep your arms long and use a small, controlled swing. It is a step up from a hanging knee raise."},
  "KB Swings": {desc: "Hinge at the hips (not a squat) and hike the kettlebell back between your legs, then snap your hips forward to drive it up to chest/eye height. Arms stay relaxed — the hips do the work."},
  "Pull-Ups": {desc: "Hang from the bar with an overhand grip, pull your chin over the bar, then lower under control. Kip or use a band if you can't do strict reps yet.", url: "https://www.crossfit.com/essentials/the-kipping-pull-up"},
  "Ring Push-Ups": {desc: "Push-ups with your hands on the rings instead of the floor — the instability hits your chest, shoulders, and core harder than a standard push-up.", url: "https://www.crossfit.com/essentials/the-ring-push-up"},
  "Ring Rows": {desc: "Set the rings low, lean back with feet on the floor and body straight, then pull your chest to the rings. The more horizontal your body, the harder it is.", url: "https://www.crossfit.com/essentials/the-ring-row"},
  "Ring Dips": {desc: "Support yourself on the rings with arms locked out, lower until your shoulders are below your elbows, then press back up. Keep the rings close to your body.", url: "https://www.crossfit.com/essentials/the-ring-dip"},
  "Single Unders": {desc: "Regular jump rope — one jump per rope pass under your feet.", url: "https://www.crossfit.com/essentials/the-single-under"},
  "Double Unders": {desc: "Jump rope where the rope passes under your feet twice per jump. Jump a little higher than normal and speed up your wrist turnover, not your jump height.", url: "https://www.crossfit.com/essentials/the-double-under"},
  "Air Squats": {desc: "Bodyweight squat: feet shoulder-width, sit your hips back and down until thighs are at least parallel, drive back up through your heels.", url: "https://www.crossfit.com/essentials/the-air-squat"},
  "KB Goblet Squats": {desc: "Hold the kettlebell close to your chest with both hands and squat, keeping your torso upright and elbows brushing your knees at the bottom."},
  "Toes to Bar": {desc: "Hang from the pull-up bar and raise your feet to touch the bar, keeping some control on the way down. Scale to hanging knee raises if needed.", url: "https://www.crossfit.com/essentials/the-kipping-toes-to-bar"},
  "Thrusters": {desc: "Front squat into an overhead press in one motion — dip down, then drive up and punch the bar overhead as your legs finish extending.", url: "https://www.crossfit.com/essentials/the-thruster"},
  "Burpees": {desc: "Drop to the floor, chest touches down, feet jump back to plank, jump feet back in, then jump up with hands overhead.", url: "https://www.crossfit.com/essentials/the-burpee-2"},
  "Deadlift": {desc: "Feet hip-width, bar over midfoot, flat back, drive through the floor with your legs and hips to stand tall — bar stays close to your body the whole way.", url: "https://www.crossfit.com/essentials/the-deadlift"},
  "Broad Jumps": {desc: "Two-foot standing jump for maximum forward distance, landing softly with bent knees."},
  "Jump Squats": {desc: "Air squat that finishes with an explosive vertical jump, landing softly back into the next squat."},
  "Sit-Ups": {desc: "Lie on your back, knees bent, feet anchored or flat; curl your torso all the way up to touch your toes, then lower with control.", url: "https://www.crossfit.com/essentials/the-abmat-sit-up"},
  "Jumping Lunges": {desc: "Alternate lunge where you jump and switch legs in the air each rep, landing softly in the next lunge."},
  "Push-Ups": {desc: "Hands under shoulders, body in a straight line from head to heels, lower your chest to the floor and press back up.", url: "https://www.crossfit.com/essentials/the-push-up"},
  "Barbell Floor Press": {desc: "Lie on your back (mat) with the barbell at chest height, press it straight up until arms lock out, then lower until your triceps touch the floor."},
  "Back Squat": {desc: "Bar racked across your upper back/traps, squat down until hips drop below knee level, then drive back up.", url: "https://www.crossfit.com/essentials/the-back-squat"},
  "Front Squat": {desc: "Bar racked across the front of your shoulders (fingertip grip, elbows high), squat down keeping your torso upright, then stand.", url: "https://www.crossfit.com/essentials/the-front-squat"},
  "Push Jerk": {desc: "Dip slightly at the knees, then drive the bar overhead explosively while re-bending your knees to catch it locked out overhead.", url: "https://www.crossfit.com/essentials/the-push-jerk"},
  "Power Clean": {desc: "Pull the bar from the floor explosively, shrug and pull yourself under it to catch it on your shoulders in a quarter-squat, then stand.", url: "https://www.crossfit.com/essentials/the-power-clean"},
  "Power Snatch": {desc: "Same explosive pull as a power clean, but the bar goes straight overhead in one motion, caught in a quarter-squat with arms locked out.", url: "https://www.crossfit.com/essentials/the-power-snatch"},
  "Snatch Deadlift": {desc: "A deadlift using the wide snatch grip — same mechanics as a normal deadlift, just a wider hand placement to groove snatch positioning."},
  "Hang Power Snatch": {desc: "Power snatch started from a hang position (bar around knee/thigh height) instead of the floor.", url: "https://www.crossfit.com/essentials/the-hang-power-snatch"},
  "OHS": {desc: "Overhead Squat — squat down while holding the bar locked out overhead with a wide grip, keeping the bar balanced over your midfoot the whole way.", url: "https://www.crossfit.com/essentials/the-overhead-squat"},
  "Good Mornings": {desc: "Bar on your back like a back squat, hinge forward at the hips with a flat back until you feel a hamstring stretch, then return to standing.", url: "https://www.crossfit.com/essentials/the-good-morning"},
  "Strict Press": {desc: "Standing, press the bar from your shoulders straight overhead without using your legs to drive it.", url: "https://www.crossfit.com/essentials/the-shoulder-press"},
  "Muscle Snatch": {desc: "A snatch pulled straight through without dropping under the bar — press/pull it directly overhead, keeping elbows high and outside.", url: "https://www.crossfit.com/essentials/the-muscle-snatch"},
  "KB Deadlifts": {desc: "Hinge at the hips to pick the kettlebell up from the floor between your feet, standing tall with a flat back, then lower it back down."},
  "Walking Lunges": {desc: "Step forward into a lunge, back knee grazing the floor, then bring your back foot through into the next lunge — continuous forward walking.", url: "https://www.crossfit.com/essentials/the-walking-lunge"},
  "Dislocates": {desc: "Hold a light bar/PVC with a wide grip and rotate it from in front of your hips over your head to behind your back, keeping arms straight — a shoulder mobility drill."},
  "W-bar Curls": {desc: "Standard bicep curl using the curved W-bar (curl bar) — easier on the wrists than a straight bar."},
  "W-bar Skull Crushers": {desc: "Lying down, lower the W-bar toward your forehead by bending only your elbows, then extend back up — isolates the triceps."},
  "Single Arm KB Row": {desc: "Hinge forward with one hand braced, row the kettlebell up to your ribcage keeping your elbow close to your body."},
  "V-ups": {desc: "Lying flat, simultaneously raise your straight legs and torso to touch your hands to your toes in a 'V' shape, then lower back down."},
  "Russian Twists": {desc: "Sit with knees bent and torso leaned back slightly, rotate your torso side to side, tapping the floor (or a plate) on each side."},
  "Flutter Kicks": {desc: "Lying on your back, hands under your hips, alternate small up-and-down kicks with straight legs a few inches off the floor."},
  "Plank Hold": {desc: "Forearms and toes on the floor, body in a straight line from head to heels, core braced — hold the position."},
  "Side Plank": {desc: "Balance on one forearm and the outside edge of one foot, body in a straight line, hips lifted — hold, then switch sides."},
  "Mountain Climbers": {desc: "In a plank position, drive your knees alternately toward your chest at a quick pace, keeping your hips low."},
  "Leg Raises": {desc: "Lying on your back, keep legs straight and raise them to vertical (or a bar overhead if hanging), then lower with control."},
  "Superman": {desc: "Lying face down, simultaneously lift your arms, chest, and legs off the floor, squeezing your lower back and glutes, then release."},
  "Scap Pull-Ups": {desc: "Hang from the bar and, without bending your elbows, pull your shoulder blades down and together to lift your body an inch or two — builds the base for kipping/strict pull-ups."},
  "Hollow Rocks": {desc: "Lie on your back, arms and legs extended and slightly off the floor in a 'banana' shape, and rock gently back and forth keeping the shape rigid."},
  "L-sit": {desc: "Support yourself on the rings, bar, or floor with arms locked out and legs held straight out in front at hip height — hold the position.", url: "https://www.crossfit.com/essentials/the-l-sit"},
  "High Knees": {desc: "Jog in place driving your knees up toward your chest as quickly as you can, staying light on your feet."},
  "PVC Pass-throughs": {desc: "Hold a light bar/PVC wide with both hands and pass it from in front of your body over your head to behind your back and back again, keeping arms straight — a shoulder warm-up."},
  "Bulgarian Split Squat": {desc: "Rear foot elevated behind you on a bench/step, front leg does the work — lower straight down and drive back up, then switch legs."},
  "Pistol Squat": {desc: "Single-leg squat — one leg extended straight out in front, lower yourself down on the standing leg as far as you can control, then stand back up.", url: "https://www.crossfit.com/essentials/the-single-leg-squat"},
  "Half Burpee": {desc: "A burpee without the push-up and without the jump — drop to plank, step or jump feet back in, and stand up (no clap overhead).", url: "https://www.crossfit.com/essentials/the-burpee-2"},
  "Half Burpees": {desc: "A burpee without the push-up and without the jump — drop to plank, step or jump feet back in, and stand up (no clap overhead).", url: "https://www.crossfit.com/essentials/the-burpee-2"},
  "Glute Bridges": {desc: "Lying on your back, knees bent, feet flat — squeeze your glutes to lift your hips until your body forms a straight line from shoulders to knees, then lower."},
  "Lying Leg Raises": {desc: "Lying on your back, hands under your hips, keep legs straight and raise them to vertical, then lower with control without letting your lower back arch off the floor."},
  "Plank Shoulder Taps": {desc: "Hold a push-up plank position and alternate tapping each hand to the opposite shoulder, keeping your hips as still and square as possible."},
  "Inchworms": {desc: "Stand tall, fold forward and walk your hands out to a plank, then walk your feet up to your hands and stand back up — a full-body warm-up flow."},
  "Star Jumps": {desc: "Squat slightly then jump up, spreading your arms and legs out into an 'X' shape at the top, landing softly back into the next squat."},
  "Diamond Push-Ups": {desc: "Push-up with your hands close together under your chest, thumbs and index fingers touching to form a diamond — shifts more load onto the triceps."},
  "Bicycle Crunches": {desc: "Lying on your back, alternate bringing opposite elbow to opposite knee in a pedaling motion, extending the other leg straight out."},
  "Jumping Jacks": {desc: "Jump your feet out while raising your arms overhead, then jump back to standing with arms at your sides — classic full-body cardio move."},
  "Superman Pulls": {desc: "Lying face down like a Superman hold, pull your elbows back as if rowing while squeezing your shoulder blades together, then release forward — a no-equipment substitute for a pulling movement."},
  "Handstand Hold": {desc: "Kick up into a handstand against a wall for support, arms locked out and body as straight as you can hold, and hold the position.", url: "https://www.crossfit.com/essentials/the-freestanding-handstand"},
  "Pistol Squat Progression": {desc: "Working toward a single-leg squat — use a wall, a slow controlled descent, or partial range of motion on one leg at a time until you can do a full pistol.", url: "https://www.crossfit.com/essentials/the-single-leg-squat"},
  "KB Romanian Deadlift": {desc: "Holding a kettlebell in front of your thighs, push your hips back and lower it down your legs keeping a flat back and slight knee bend, then squeeze your glutes to stand back up."},
  "KB Snatch": {desc: "Hike the kettlebell back like a swing, then pull it explosively overhead in one motion, punching your hand through at the top so the bell rests on your forearm. Switch arms between sets.", url: "https://www.crossfit.com/essentials/the-kettlebell-snatch"},
  "KB Clean & Press": {desc: "Hike the bell back, pull it up and rotate your hand through to catch it racked at your shoulder, then press it overhead. Switch arms between sets."},
  "Wall Walks": {desc: "Start in a plank with feet against a wall, walk your feet up the wall while walking your hands in until your chest is close to the wall, then reverse back down."},
  "Reverse Lunges": {desc: "Step backward into a lunge, back knee grazing the floor, then drive through your front heel back to standing. Easier on the knees than a walking lunge."},
  "KB Farmer Carry": {desc: "Hold the kettlebell at your side (or one in each hand if you have two) and walk tall with a braced core, steady steps — count each step as a rep."},
  "Handstand Push-Ups": {desc: "Kick up into a handstand against a wall, lower your head toward the floor under control, then press back up to full lockout. Scale with a pike push-up or partial range of motion.", url: "https://www.crossfit.com/essentials/the-handstand-push-up"},
  "Sumo Deadlift High Pulls": {desc: "Wide stance, hike the kettlebell between your legs like a swing, then pull it up close to your body to chin height, elbows high and out.", url: "https://www.crossfit.com/essentials/the-sumo-deadlift-high-pull"},
  "Renegade Rows": {desc: "In a plank with one hand on the kettlebell, row the bell to your ribs while bracing hard to keep your hips square, then lower and switch sides."},
  "Bear Crawl": {desc: "Hands and feet on the floor, knees hovering just off the ground, crawl forward moving opposite hand and foot together — count each step as a rep."},
  "Overhead Squat": {desc: "Squat down while holding the bar locked out overhead with a wide grip, keeping the bar balanced over your midfoot the whole way.", url: "https://www.crossfit.com/essentials/the-overhead-squat"},
  "Bent-Over Row": {desc: "Hinge forward with a flat back, bar hanging at arm's length, then row it to your lower ribs by driving your elbows back, and lower under control."},
  "Chest-to-Bar Pull-Ups": {desc: "Same as a pull-up, but pull high enough that your chest makes contact with the bar each rep — more range and more pulling power than a chin-over-bar pull-up.", url: "https://www.crossfit.com/essentials/the-kipping-pull-up"},
  "Push Press": {desc: "Dip slightly at the knees and hips, then drive explosively through your legs to help press the bar overhead to lockout.", url: "https://www.crossfit.com/essentials/the-push-press"},
  "Hang Power Clean": {desc: "Starting with the bar at the hang (around knee height, not the floor), pull explosively and drop under it to catch on your shoulders in a quarter-squat, then stand.", url: "https://www.crossfit.com/essentials/the-hang-power-clean"},
  "Single-Arm KB Push Press": {desc: "Rack the kettlebell at your shoulder, dip slightly, then drive through your legs to press it overhead. Switch arms between sets."},
  "KB Thrusters": {desc: "Hold the kettlebell racked at your shoulder or in a goblet grip, squat down, then drive up and press it overhead in one motion as your legs finish extending."},
  "Squat Clean": {desc: "Pull the bar from the floor explosively and drop into a full squat to catch it racked on your shoulders, then stand up to finish the lift.", url: "https://www.crossfit.com/essentials/the-squat-clean"},
  "Squat Snatch": {desc: "Pull the bar from the floor in one explosive motion and drop into a full squat to catch it locked out overhead, then stand up to finish the lift.", url: "https://www.crossfit.com/essentials/the-squat-snatch"},
  "Split Jerk": {desc: "Dip and drive the bar off your shoulders, then split your feet front-to-back as you drop under it to catch it locked out overhead, and bring your feet back together to stand.", url: "https://www.crossfit.com/essentials/the-split-jerk"},
  "Sumo Deadlift": {desc: "Wide stance with hands inside your knees, chest up and back flat, drive through the floor to stand tall — the wide stance shifts more of the load to your legs than a conventional deadlift.", url: "https://www.crossfit.com/essentials/the-sumo-deadlift"},
  "Turkish Get-Ups": {desc: "Lying down with the kettlebell locked out overhead in one hand, work your way up to standing one step at a time while keeping the bell locked out the whole way, then reverse it back down.", url: "https://www.crossfit.com/essentials/the-turkish-get-up"},
  "KB Push Press": {desc: "Hold the kettlebell racked at your shoulder, dip slightly at the knees, then drive through your legs to help press it overhead."},
  "Bar Muscle-Ups": {desc: "From a hang, pull explosively and lean back to bring your hips to the bar, then press out on top so you finish with straight arms above the bar."},
  "Ring Muscle-Ups": {desc: "Pull explosively while pulling the rings into your body, transition your hands over the top as your chest clears the rings, then press out to lockout."},
  "Handstand Walk": {desc: "Kick up into a handstand and walk forward on your hands, keeping your body tight and your gaze between your hands — count each hand step as a rep."},

const INFO_GENERIC = new Set(['Clean','Snatch','Jerk','Handstand','Muscle-Ups','Running','Rowing','Biking','Sprinting']);
function findKnownMovements(text){
  const found = [];
  const lower = text.toLowerCase();
  Object.keys(EXERCISE_INFO).forEach(name=>{
    if(INFO_GENERIC.has(name)) return;
    if(lower.includes(name.toLowerCase()) && !found.includes(name)) found.push(name);
  });
  return found;
}

// ---------- selection helpers (favor whatever hasn't been used in the longest time, per focus) ----------
function sessionsAgoUsed(type, value, fieldGetter){
  const typeHistory = state.history.filter(h=>h.type===type);
  for(let i=typeHistory.length-1;i>=0;i--){
    const field = fieldGetter(typeHistory[i]);
    const match = Array.isArray(field) ? field.includes(value) : field===value;
    if(match) return typeHistory.length-1-i;
  }
  return Infinity;
}
function pickLRU(pool, type, fieldGetter){
  let bestScore = -1, best = [];
  pool.forEach(candidate=>{
    const score = sessionsAgoUsed(type, candidate, fieldGetter);
    if(score > bestScore){ bestScore = score; best = [candidate]; }
    else if(score === bestScore){ best.push(candidate); }
  });
  return best[Math.floor(Math.random()*best.length)];
}
// set by generateWorkout right before it asks a WOD_FORMAT_DEFS builder for movements — patterns
// that already dominated recent sessions or today's skill lift get deprioritized (not excluded;
// the pools are small enough that ruling a pattern out entirely could leave nothing left to pick)
let currentAvoidPatterns = null;
let currentPreferPatterns = null; // set by the look-back planner: patterns that were light in recent sessions
function pickMovementsLRU(pool, type, n){
  const scored = pool.map(m=>{
    const score = sessionsAgoUsed(type, m.name, h=>h.movementNames||[]);
    let s = (score===Infinity ? 999 : score) + Math.random()*0.75;
    if(currentAvoidPatterns && currentAvoidPatterns.has(MOVEMENT_PATTERNS[m.name])) s -= 3;
    if(currentPreferPatterns && currentPreferPatterns.has(exPattern(m.name))) s += 3;
    return {m, score: s};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0, Math.min(n, pool.length)).map(s=>s.m);
}
function buildWodText(format, wodMovements){
  return `${format}\n` + wodMovements.map(m => `- ${m.reps} ${m.name}${repsSuffixFor(m.name)}${m.tag ? ' ('+m.tag+')' : ''}`).join('\n');
}
function repsFor(movement, formatStr, multiplier=1){
  let [lo, hi] = movement.range;
  lo = lo*multiplier; hi = hi*multiplier;
  if(/^EMOM/.test(formatStr)){ hi = lo + (hi-lo)*0.5; } // EMOM = smaller per-minute chunks
  const steps = Math.max(1, Math.round((hi-lo)/movement.step));
  let count = lo + Math.floor(Math.random()*(steps+1))*movement.step;
  count = Math.round(count/movement.step)*movement.step;
  return Math.max(movement.step, count);
}
// ---------- PLATES: what you own decides which loads exist ----------
// Pounds only. Plates are counted one by one; a side takes half of each size, so an odd plate stays unused.
const PLATE_SIZES = [45,35,25,15,10,5,2.5,1.25];
// the set every workout assumed before plates were selectable: 35, 25, 25, 15, 10 on each side
const PLATES_DEFAULT = {45:0, 35:2, 25:4, 15:2, 10:2, 5:0, 2.5:0, 1.25:0};
let plateCache = null;
function platePairs(){ const o = {}; PLATE_SIZES.forEach(s=>{ o[s] = Math.floor(((state.plates||{})[s]||0)/2); }); return o; }
function barWeight(){ return state.barWeight || 45; }
// the heaviest barbell you can load; with Plates switched off that is the empty bar
function maxBarbellLoad(){
  if(!state.equipment.includes('plates')) return barWeight();
  const p = platePairs();
  return barWeight() + 2*PLATE_SIZES.reduce((a,s)=>a+s*p[s], 0);
}
// every per-side total your plates can make, lightest first
function loadableSides(){
  const pairs = platePairs(), key = JSON.stringify(pairs);
  if(plateCache && plateCache.key===key) return plateCache.sides;
  let sides = new Set([0]);
  PLATE_SIZES.forEach(sz=>{
    const n = pairs[sz]; if(!n) return;
    const next = new Set(sides);
    sides.forEach(v=>{ for(let k=1;k<=n;k++) next.add(Math.round((v+sz*k)*100)/100); });
    sides = next;
  });
  const arr = [...sides].sort((a,b)=>a-b);
  plateCache = {key, sides:arr};
  return arr;
}
// the nearest barbell total you can really load (a tie goes lighter), never above your maximum
function fitToPlates(total){
  if(state.bodyweightOnly || !state.equipment.includes('plates')) return total;
  const bar = barWeight(), target = Math.max(0, (total-bar)/2);
  let best = 0;
  loadableSides().forEach(s=>{ if(Math.abs(s-target) < Math.abs(best-target) - 1e-9) best = s; });
  return bar + 2*best;
}
// the fewest plates (biggest first) that make exactly one side's weight, or null
function plateCombo(sideTarget){
  const pairs = platePairs(), sizes = PLATE_SIZES.filter(s=>pairs[s]>0);
  const go = (i, remaining)=>{
    if(Math.abs(remaining) < 1e-9) return [];
    if(i >= sizes.length) return null;
    const sz = sizes[i], maxK = Math.min(pairs[sz], Math.floor(remaining/sz + 1e-9));
    for(let k=maxK;k>=0;k--){ const rest = go(i+1, remaining-k*sz); if(rest) return Array(k).fill(sz).concat(rest); }
    return null;
  };
  return go(0, sideTarget);
}
function plateBreakdown(totalWeight){
  const bar = barWeight(), sideTarget = Math.max(0, (totalWeight-bar)/2);
  if(sideTarget <= 0) return 'Empty bar';
  const sides = loadableSides();
  const exact = sides.some(s=>Math.abs(s-sideTarget) < 1e-9) ? plateCombo(sideTarget) : null;
  if(exact) return `${exact.join('+')} lb per side`;
  let near = 0; sides.forEach(s=>{ if(s <= sideTarget + 1e-9) near = s; });
  const combo = near > 0 ? plateCombo(near) : [];
  return `${combo && combo.length ? combo.join('+') + ' lb per side' : 'Empty bar'} · closest with your plates (${bar + 2*near} lb)`;
}
// splits available minutes across warmup/skill/wod/core; trims skill/core first when time is tight
// One-time choice (not saved): Shorter changes how today's session is built.
// Short (15): heavy days keep their lift and drop the WOD to a short one; other days drop Skill.
function allocateTime(total, type){
  if(!total) return null;
  total = Math.max(10, Math.round(total));
  const heavy = type==='strength' || type==='weightlifting';
  const mobility = 2;
  let warmup, skill, core;
  if(total <= 15){ warmup=4; skill = heavy ? 5 : 0; core=0; }
  else if(total <= 25){ warmup=5; skill=5; core=0; }
  else { warmup=5; skill=10; core=5; }
  const wod = Math.max(total<=15 && heavy ? 4 : 6, total - mobility - warmup - skill - core);
  const mode = total<=15 ? 'short' : null;
  return {mobility, warmup, skill, core, wod, skipSkill: skill===0, skipCore: core===0, mode};
}
// rough per-section minutes for whichever timer a section actually has — used to show a real total
// even when no time budget was chosen (allocateTime has nothing to go on in that case)
// one TABATA round's length — either the classic work+rest pair, or the sum of an explicit
// `phases` list (e.g. hold / hold / rest) for rounds that aren't a simple work-then-rest
function tabataRoundSec(spec){
  return spec.phases ? spec.phases.reduce((a,ph)=>a+ph.sec, 0) : spec.workSec + spec.restSec;
}
function estimateTimerMinutes(spec){
  if(!spec) return 5;
  switch(spec.kind){
    case 'AMRAP': return spec.cycles ? spec.cycles*(spec.minutes+(spec.restMinutes||0)) : spec.minutes;
    case 'EMOM': return spec.minutes || 10;
    case 'TABATA': return Math.ceil(spec.rounds*tabataRoundSec(spec)/60);
    case 'RFT': return spec.cap || spec.rounds*3;
    case 'LADDER': return spec.cap || 12;
    case 'FORTIME': return spec.cap || 10;
    case 'FORTIME_REPEATS': return spec.cap || Math.ceil(spec.rounds*(spec.restSeconds/60+3));
    case 'INTERVAL': return spec.totalRounds ? spec.totalRounds*spec.minutes : spec.minutes;
    case 'COUNTDOWN': return spec.minutes;
    default: return 5;
  }
}
// neither of these shows up in any single section's own timer, so a raw sum of section timers
// always reads short next to how a session actually feels — this adds them back in
const SECTION_TRANSITION_MIN = 2; // catching your breath / moving to the next section's setup
const WEIGHT_ADJUST_MIN = 3; // loading and unloading plates between sets of a tracked barbell lift
function estimateWorkoutMinutes(w){
  if(!w) return null;
  let total = 4; // warm-up has no formal timer to read — flat rough guess
  let sectionCount = 1; // the warm-up itself
  if(w.mobility){ total += 2; sectionCount++; }
  if(w.skillTplText){
    total += estimateTimerMinutes(w.skillTimer);
    sectionCount++;
    if(w.skillLiftKey) total += WEIGHT_ADJUST_MIN;
  }
  total += estimateTimerMinutes(w.wodTimerSpec || parseTimerFromText(w.format));
  sectionCount++;
  if(w.core){
    total += estimateTimerMinutes(w.coreTimer);
    sectionCount++;
  }
  total += (sectionCount - 1) * SECTION_TRANSITION_MIN;
  return Math.round(total);
}
// counts distinct known movements across the whole day (warm-up through core), not just the WOD —
// answers "how many exercises am I actually doing today"
function countWorkoutExercises(w){
  if(!w) return 0;
  const wodText = buildWodText(w.format, w.wodMovements);
  const parts = [w.mobility, w.warmup, w.skillTplText, wodText, w.core].filter(Boolean);
  const found = findKnownMovements(parts.join('\n'));
  return found.filter(k=>!found.some(j=>j!==k && j.toLowerCase().includes(k.toLowerCase()))).length;
}

function daysSince(ts){ return (Date.now() - ts) / (1000*60*60*24); }
// any logged outside activity, regardless of whether it maps to one of the 5 focuses — activities
// like Walking/Hiking or Yoga (mappedType: null) never show up in a per-focus "last trained" chip
// otherwise, so this is the only place they're reflected at all
function lastExternalActivityDate(){
  let last = null;
  state.history.forEach(h=>{
    if(h.kind==='external' && (last===null || h.date>last)) last = h.date;
  });
  return last;
}
function lastSessionDate(type){
  let last = null;
  state.history.forEach(h=>{
    const t = h.kind==='external' ? h.mappedType : h.type;
    if(t===type && (last===null || h.date>last)) last = h.date;
  });

}
// if it's been a while since this focus was last trained, ease back in rather than jumping straight to the progressed weight/volume
function layoffFactor(type){
  const last = lastSessionDate(type);
  if(last===null) return {factor:1, days:null, isReturning:false};
  const days = daysSince(last);
  if(days > 14) return {factor:0.9, days:Math.round(days), isReturning:true};
  return {factor:1, days:Math.round(days), isReturning:false};
}
// if a hard external activity mapped to this focus happened very recently, ease off today rather than stacking fatigue
function recentExternalLoadFactor(type){
  const recent = [...state.history].reverse().find(h => h.kind==='external' && h.mappedType===type && daysSince(h.date) < 1.5);
  if(recent && recent.intensity==='hard') return {factor:0.9, activity:recent.activity};
  return {factor:1, activity:null};
}
// picks the best focus for today: whatever's gone longest without training, avoiding an immediate repeat of last time
function recommendedFocus(){
  if(state.history.length===0) return {type: FOCUS_CHOICES[0].key, days:null};
  const lastGenerated = [...state.history].reverse().find(h=>h.kind!=='external');
  const lastKey = lastGenerated ? focusKeyOf(lastGenerated.type) : null;
  const scored = FOCUS_CHOICES.map(f=>{
    const last = lastSessionDateForFocus(f.key);
    return {key:f.key, days: last===null ? Infinity : daysSince(last)};
  });
  // Level 2: a heavy day at least once a week
  const heavy = scored.find(x=>x.key==='heavy');
  if(heavy && heavy.days>=7 && lastKey!=='heavy') return {type:'heavy', days: heavy.days===Infinity ? null : Math.round(heavy.days)};
  const candidates = scored.filter(x=>x.key!==lastKey);
  const pool = candidates.length ? candidates : scored;
  pool.sort((p,q)=>q.days-p.days);
  return {type: pool[0].key, days: pool[0].days===Infinity ? null : Math.round(pool[0].days)};
}

function computeSuggestedLoad(liftKey){
  const entries = state.history.filter(h=>h.liftKey===liftKey && h.loggedLoad != null);
  if(entries.length===0) return {load: state.weights[liftKey], deload:false};
  const last = entries[entries.length-1];
  const prevLoad = last.loggedLoad;
  const prevRpe = last.rpe || 'right';
  if(entries.length>=2){
    const secondLast = entries[entries.length-2];
    if(prevRpe==='hard' && secondLast.rpe==='hard') return {load: Math.round((prevLoad*0.9)/5)*5, deload:true};
  }
  const adj = (ADJUST[liftKey] && ADJUST[liftKey][prevRpe] != null) ? ADJUST[liftKey][prevRpe] : 5;
  return {load: Math.round((prevLoad+adj)/5)*5, deload:false};
}

// pulls a per-set rep scheme out of a skill's prescription text, e.g. "5-5-3-3-2-2" or "5 x 5"
// matches "5 x 5", "6 sets x 3", "5 sets x 8-10 (strict or banded)", "5 sets x 10 superman pulls" —
// the "sets" word and any trailing qualifier/movement text are optional and ignored
const SET_SCHEME_X_RE = /^(\d+)\s*(?:sets?)?\s*x\s*(\d+(?:-\d+)?)/i;
function parseSetScheme(text){
  if(!text) return null;
  const lines = text.split('\n');
  for(const line of lines){
    const trimmed = line.trim();
    const dashMatch = trimmed.match(/^(\d+(?:-\d+){1,})$/);
    if(dashMatch) return trimmed.split('-').map(Number);
    const xMatch = trimmed.match(SET_SCHEME_X_RE);
    if(xMatch){
      // a prescribed range ("5-8") starts at its top — the field holds one number, and starting
      // at the ceiling means a mid-workout drop is a deliberate edit rather than a blank to fill in
      const reps = Number(xMatch[2].split('-').pop());
      return Array(Number(xMatch[1])).fill(reps);
    }
  }
  return null;
}
// only fabricate a straight-sets editor when there's real set structure to log: a genuine
// repeated-sets timer (INTERVAL), or a lift whose weight is worth adjusting set by set. An EMOM
// (or similar) with no lift and no explicit "N x R" text is minute-by-minute work, not discrete
// sets — there's nothing meaningful to edit reps/weight for, so it gets no editor at all.
// a block-style prescription ("4 sets:" / "SUPERSET x4:" followed by several movements, each with its
// own rep count in the text) has no single "reps per set" number — so its sets carry null reps
// (the set rows show just "Set N" and a done check) instead of an invented default that
// contradicts the text
function parseBlockSetCount(text){
  if(!text) return null;
  for(const line of text.split('\n')){
    const t = line.trim();
    let m = t.match(/^(\d+)\s*sets?\b/i) || t.match(/superset\s*x\s*(\d+)/i);
    if(m) return Number(m[1]);
  }
  return null;
}
function buildSkillSetReps(skillTplText, skillTimer, hasLiftKey){
  const scheme = parseSetScheme(skillTplText);
  if(scheme) return scheme;
  const blockN = parseBlockSetCount(skillTplText);
  if(blockN && (hasLiftKey || (skillTimer && skillTimer.kind==='INTERVAL'))) return Array(blockN).fill(null);
  if(hasLiftKey || (skillTimer && skillTimer.kind==='INTERVAL')){
    const n = (skillTimer && skillTimer.totalRounds) || 3;
    return Array(n).fill(null);
  }
  return [];
}
// the weight(s) to use for a skill's loaded movements that aren't a tracked barbell lift — one number
// per movement, remembered from the last time it was logged
const SKILL_LOAD_DEFS = [

  {re:/single arm KB row/i, key:'kbRow', label:'Single-arm KB row', def:35},

function buildSkillLoads(text){

function buildSkillSetWeights(n, suggestedLoad){

}
// mirror image of parseSetScheme: turns a rep array back into "N x R" (constant), "R-R-R" (a plain
// numeric ladder), or "R / R / R" (varying and at least one set is itself a range like "8-10" —
// joining those with dashes too would run its range-boundary dashes into the set separators)
function formatSetScheme(reps){
  const allSame = reps.every(r=>r===reps[0]);
  if(allSame) return `${reps.length} x ${reps[0]}`;
  const hasRange = reps.some(r=>typeof r==='string' && r.includes('-'));
  return hasRange ? reps.join(' / ') : reps.join('-');
}
// rewrites just the scheme line inside the skill's prescription text so the description stays in
// sync when sets are added, removed, or a rep value is edited — everything else in the text (lift
// name, "Every 2 min") stays put
function updateSkillSchemeText(text, newReps){
  if(!text) return text;
  if(newReps.some(r=>r===null)){
    // block-style sets: only the set COUNT is in the text ("4 sets:" / "SUPERSET x4:")
    const n = newReps.length;
    return text.replace(/^(\d+)(\s*sets?\b)/im, `${n}$2`).replace(/(superset\s*x\s*)\d+/i, `$1${n}`);
  }
  const lines = text.split('\n');
  const newLine = formatSetScheme(newReps);
  for(let i=0;i<lines.length;i++){
    const trimmed = lines[i].trim();
    if(/^\d+(?:-\d+){1,}$/.test(trimmed) || SET_SCHEME_X_RE.test(trimmed) || trimmed.includes(' / ')){
      const suffix = SET_SCHEME_X_RE.test(trimmed) ? trimmed.replace(SET_SCHEME_X_RE, '') : '';
      lines[i] = newLine + suffix;
      return lines.join('\n');
    }
  }
  return text;
}

function generateWorkout(focus){
  const type = resolveFocus(focus);
  state.currentType = type;
  const bw = state.bodyweightOnly;
  const alloc = allocateTime(state.timeAvailable, type);
  const layoff = layoffFactor(type);
  const external = recentExternalLoadFactor(type);
  const coachNotes = [];
  if(focus==='heavy' && !bw && (!state.equipment.includes('barbell') || !state.equipment.includes('plates'))) coachNotes.push("Heavy Lifting works best with a barbell and plates, and one of them is off in your Equipment list. Today's heavy work uses what is on. Switch them on in Profile for heavier loading.");

  const warmupPool = warmupPoolFor(type);
  const warmup = pickLRU(warmupPool, type, h=>h.warmup);

  let skillTplText = null, skillLiftKey = null, suggestedLoad = null, deload = false, skillTimer = null;
  if(!(alloc && alloc.skipSkill)){
    const skillPool = skillPoolFor(type);
    if(!bw && skillPool===SKILLS_BW[type]) coachNotes.push("Your Equipment list doesn't cover any "+DAY_TYPES.find(d=>d.key===type).label+" Skill templates, so today's Skill is bodyweight work. Switch more equipment on in Profile to change that.");
    skillTplText = pickLRU(skillPool.map(s=>s.text), type, h=>h.skillTplText);
    const skillTpl = skillPool.find(s=>s.text===skillTplText);
    skillTimer = skillTpl.timer || null;
    skillLiftKey = (!bw && skillTpl.liftKey) ? skillTpl.liftKey : null;
    if(skillLiftKey){
      const result = computeSuggestedLoad(skillLiftKey);
      suggestedLoad = result.load; deload = result.deload;
      if(deload) coachNotes.push(`${LIFT_LABELS[skillLiftKey]}: last two sessions rated Hard — backing off ~10% today.`);
      if(layoff.isReturning){
        suggestedLoad = Math.round((suggestedLoad*layoff.factor)/5)*5;
        coachNotes.push(`It's been ${layoff.days} days since your last ${DAY_TYPES.find(d=>d.key===type).label} session — easing the load back ~10% today.`);
      }
      if(external.activity){
        suggestedLoad = Math.round((suggestedLoad*external.factor)/5)*5;
        coachNotes.push(`You logged a hard ${external.activity} session recently — easing the load back ~10% today.`);
      }
      const fittedLoad = fitToPlates(suggestedLoad);
      if(suggestedLoad > maxBarbellLoad() && fittedLoad < suggestedLoad) coachNotes.push(`Your plates top out at ${fittedLoad} lb, so ${LIFT_LABELS[skillLiftKey]} is held there today. Add plates in Equipment to keep progressing.`);
      suggestedLoad = fittedLoad;
    }
  }

  const baseVolume = state.volume[type];
  const effectiveVolume = clamp(baseVolume * layoff.factor * external.factor, 0.5, 1.4);
  if(Math.abs(baseVolume - 1.0) >= 0.09){
    const pct = Math.round((baseVolume-1)*100);
    coachNotes.push(`${DAY_TYPES.find(d=>d.key===type).label} volume ${pct>0?'up':'down'} ${Math.abs(pct)}% based on how recent sessions felt.`);
  }
  if(layoff.isReturning && !skillLiftKey){
    coachNotes.push(`It's been ${layoff.days} days since your last ${DAY_TYPES.find(d=>d.key===type).label} session — dialing back volume ~10% today.`);
  }
  if(external.activity && !skillLiftKey){
    coachNotes.push(`You logged a hard ${external.activity} session recently — dialing back volume ~10% today.`);
  }

  let movementPool = movementPoolFor(type);
  movementPool = knownSkillFilter(movementPool);
  const wodMinutes = alloc ? alloc.wod : null;
  const formatId = pickLRU(WOD_FORMAT_CATALOG[type], type, h=>h.formatId);
  // steer WOD movement selection away from whatever pattern today's skill lift already hit, and
  // away from whatever's dominated this focus's last couple of sessions — workload-aware balance,
  // not just avoiding the exact same movement name twice
  const skillPattern = skillLiftKey ? LIFT_PATTERNS[skillLiftKey] : null;
  const recentTally = recentPatternTally(type, 2);
  const recentDominant = Object.keys(recentTally).sort((a,b)=>recentTally[b]-recentTally[a])[0] || null;
  const avoidPatterns = new Set([skillPattern, recentDominant].filter(Boolean));
  currentAvoidPatterns = avoidPatterns.size ? avoidPatterns : null;
  const lookBackPlan = lookBackGoals(movementPool);
  currentPreferPatterns = lookBackPlan ? new Set(lookBackPlan.gaps) : null;
  const built = WOD_FORMAT_DEFS[formatId]({pool:movementPool, type, volume:effectiveVolume, wodMinutes, mode: alloc ? alloc.mode : null});
  currentAvoidPatterns = null; currentPreferPatterns = null;
  let format = built.formatDisplay;
  let wodMovements = built.movements;
  let wodTimerSpec = built.timerSpec;
  let isBenchmark = false, benchmarkName = null;

  if(type==='conditioning' && (!alloc || alloc.wod >= 15)){
    const benchmark = dueBenchmark();
    if(benchmark){
      isBenchmark = true;
      benchmarkName = benchmark.name;
      format = benchmark.format;
      wodMovements = benchmark.movements.map(m => ({ name: m.name, reps: m.reps, load: m.load }));
      wodTimerSpec = parseTimerFromText(format) || {kind:'FORTIME', cap:null, label:'For Time'};
      // a benchmark is always shown; loads above what your plates can make get a scaling note instead of hiding it
      const loadCap = maxBarbellLoad();
      const heaviest = Math.max(0, ...benchmark.movements.map(m=>{
        if(!(exEquipment(m.name)||[]).includes('barbell')) return 0;
        const std = WOD_LOAD_STANDARDS[m.name];
        const written = (m.load !== undefined && m.load !== '') ? (/kg/i.test(m.load) ? [] : (String(m.load).match(/\d+(?:\.\d+)?/g)||[]).map(Number)) : (std ? [std.w, std.m] : []);
        return written.length ? Math.max(...written) : 0;
      }));
      if(!bw && heaviest > loadCap) coachNotes.push(`Some loads here are heavier than your plates can make (${loadCap} lb on the bar). Scale them to the weight you have.`);
      const hist = (state.benchmarks[benchmark.name] && state.benchmarks[benchmark.name].history) || [];
      if(hist.length){
        const best = benchmark.scoreType==='rounds'
          ? Math.max(...hist.map(h=>h.score))
          : Math.min(...hist.map(h=>h.score));
        coachNotes.push(`Benchmark retest: ${benchmark.name}. Your best so far is ${fmtBenchmarkScore(benchmark, best)} — let's see where you're at now.`);
      } else {
        coachNotes.push(`Benchmark: ${benchmark.name}. This is your first time testing it — whatever you get today becomes the baseline to beat.`);
      }
    }
  }

  if(lookBackPlan && !isBenchmark) coachNotes.push(lookBackNote(lookBackPlan));

  let core = null, coreTimer = null, extraKind = 'core';
  if(!(alloc && alloc.skipCore)){
    const extra = pickExtra(type, skillLiftKey);
    core = extra.text; coreTimer = extra.timer; extraKind = extra.kind;
  }

  const mobility = mobilityPrimerFor(type, skillLiftKey).join('\n');
  const initSkillSetReps = buildSkillSetReps(skillTplText, skillTimer, !!skillLiftKey);
  state.currentWorkout = {
    type, warmup, skillTplText, skillLiftKey, suggestedLoad, deload, skillTimer,
    skillSetReps: initSkillSetReps,
    skillSetWeights: buildSkillSetWeights(initSkillSetReps.length, suggestedLoad),
    skillLoads: (skillTplText && !bw) ? buildSkillLoads(skillTplText) : [],
    formatId, format, wodMovements, movements: wodMovements.map(m=>m.name), wodTimerSpec,
    core, coreTimer, extraKind, mobility, mobilityTimer: {kind:'COUNTDOWN', minutes:2}, rpe: null, wodRpe: null, bw,
    volumeUsed: effectiveVolume, coachNotes, isBenchmark, benchmarkName,
    rxStatus: 'rx', wodNotes: '',
    sectionsDone: {mobility:false, warmup:false, skill:false, wod:false, core:false}, roundCounts: {}, wodPerformance: {}
  };
  renderTimeBanner(alloc);
  render();
}

function renderTimeBanner(alloc){
  const banner = document.getElementById('gw-timebanner');
  if(!alloc){ banner.style.display='none'; return; }
  const parts = [`~${alloc.mobility}' mobility`, `~${alloc.warmup}' warm-up`];
  parts.push(alloc.skipSkill ? 'skill skipped (time)' : `~${alloc.skill}' skill`);
  parts.push(`${alloc.wod}' WOD`);
  parts.push(alloc.skipCore ? 'core skipped (time)' : `~${alloc.core}' core`);
  banner.textContent = `Fitting today into ${state.timeAvailable}': ${parts.join(' · ')}`;
  banner.style.display = 'block';
}

function renderCoachNotes(notes){
  const box = document.getElementById('gw-coachnotes');
  if(!notes || notes.length===0){ box.style.display='none'; return; }
  box.innerHTML = '<strong>Coach notes:</strong> ' + notes.join(' ');
  box.style.display = 'block';
}

// bare score with no verb, for the timeline's hero number — "12:34" instead of "finished in 12:34".
// an AMRAP's real, comparable score is total reps, not the raw rounds+reps split — when totalReps
// has been computed (see logWorkout), that's what leads; rounds+reps still shows as a sub-caption.
function formatPerformanceShort(perf){
  if(!perf) return '';
  if(perf.completedAll===false && perf.stoppedAt){
    if(perf.roundsDone != null) return `${perf.roundsDone}/${perf.roundsTotal} rounds · stopped ${perf.stoppedAt}`;
    if(perf.totalReps == null && perf.rounds == null && perf.extraReps == null) return `Stopped at ${perf.stoppedAt}`;
  }
  if(perf.totalReps != null) return `${perf.totalReps} reps`;
  if(perf.rounds != null) return `${perf.rounds} rd${perf.rounds===1?'':'s'}${perf.extraReps ? ' + '+perf.extraReps+' reps' : ''}`;
  if(perf.time) return `${perf.time}${perf.hitCap ? ' (cap)' : ''}`;
  if(perf.extraReps != null) return `${perf.extraReps} reps`;
  if(perf.completedAll != null) return perf.completedAll ? 'Completed' : 'Incomplete';
  return '';
}
function formatRoundsBreakdown(perf){
  if(!perf || perf.rounds == null) return '';
  return `${perf.rounds} rd${perf.rounds===1?'':'s'}${perf.extraReps ? ' + '+perf.extraReps+' reps' : ''}`;
}

function buildDeloadNote(w){
  if(!w.skillLiftKey || !w.deload) return null;
  const note = document.createElement('div');
  note.className = 'gw-plates'; note.style.color = 'var(--danger)';
  note.textContent = 'Last two sessions on this lift were rated Hard — suggested weight backs off ~10%.';
  return note;
}

// builds the DOM node for one section (warmup/skill/wod/core); returns null if that section isn't part of today's workout
const SECTION_START_LABELS = {mobility:'Mobility', warmup:'Warmup', skill:'Skill', wod:'WOD', core:'Extra'};
const TIMER_KIND_NAMES = {AMRAP:'AMRAP', EMOM:'EMOM', TABATA:'Tabata', RFT:'Rounds for Time', LADDER:'For Time',
  FORTIME:'For Time', FORTIME_REPEATS:'For Time Repeats', INTERVAL:'Interval', COUNTDOWN:'Countdown'};
// "1:30" for a fractional interval at or past a minute, "2 min" for a whole one, "30 sec" under
// a minute — matches how the prescription text itself already phrases "Every 1:30" / "Every 2 min",
// while staying in plain words (not "0:30") for anything under 60 seconds
// "2 minutes", "1 minute", "1 min 30 sec", "30 seconds" — for the spoken-style "Every …:" line
function everyPhrase(minutes){
  const whole = Math.floor(minutes);
  const sec = Math.round((minutes - whole) * 60);
  if(!whole) return `${sec} seconds`;
  if(!sec) return whole === 1 ? 'minute' : `${whole} minutes`;
  return `${whole} min ${sec} sec`;
}
function fmtMinutesShort(minutes){
  const whole = Math.floor(minutes);
  const sec = Math.round((minutes - whole) * 60);
  if(whole===0 && sec) return `${sec} sec`;
  return sec ? `${whole}:${String(sec).padStart(2,'0')}` : `${whole} min`;
}
// the CTA names whichever timer will actually open — but stays a short, scannable phrase
// (kind + the one number that matters), never the verbose catalog scheme name like
// "RFT: Same Varying Reps" or "Alternate Movements per Interval"
function timerSpecShortLabel(spec){
  switch(spec.kind){
    case 'AMRAP':
      return spec.cycles ? `AMRAP ${spec.cycles}x${fmtMinutesShort(spec.minutes)}` : `AMRAP ${fmtMinutesShort(spec.minutes)}`;
    case 'EMOM':
      return spec.openEnded ? 'EMOM' : `EMOM ${fmtMinutesShort(spec.minutes)}`;
    case 'TABATA':
      return `Tabata ${spec.rounds}x`;
    case 'RFT':
      return `${spec.rounds} Rounds`;
    case 'LADDER':
      return `For Time ${spec.rungs.join('-')}`;
    case 'FORTIME':
      return 'For Time';
    case 'FORTIME_REPEATS':
      return `For Time x${spec.rounds}`;
    case 'INTERVAL':
      // "X Rest Between Sets" doesn't use this — addStartSectionButton gives it its own constant
      // "Start N min Rest" label, since it opens one single rest at a time, not this whole spec
      return spec.totalRounds ? `${fmtMinutesShort(spec.minutes)} x${spec.totalRounds}` : `${fmtMinutesShort(spec.minutes)} Timer`;
    case 'COUNTDOWN':
      return `Countdown ${fmtMinutesShort(spec.minutes)}`;
    default:
      return TIMER_KIND_NAMES[spec.kind] || spec.kind;
  }
}
function sectionStartLabel(key, w){
  if(!w) return `Start ${SECTION_START_LABELS[key]}`;
  const data = getSectionFocusData(w, key);
  const spec = data && data.timerSpec;
  if(!spec) return `Start ${SECTION_START_LABELS[key]}`;
  return `Start ${timerSpecShortLabel(spec)}`;
}
// the checkmark is a real toggle — marking a section undone also resets its inline round counter
// (if it has one) so the round button becomes tappable again instead of staying stuck on "Completed"
function toggleSectionDone(w, key){
  w.sectionsDone[key] = !w.sectionsDone[key];
  if(!w.sectionsDone[key] && w.roundCounts && w.roundCounts[key] != null){
    w.roundCounts[key] = 0;
  }
  render();
  maybePromptRating(w, key);
}
// drawers are for real timers only — a section with no timer (e.g. warmup) gets a plain round
// counter right on the card instead of opening one just to tap through rounds
function buildInlineRoundCounter(key, w, stepData){
  const target = parseRoundTarget(stepData.text);
  if(!w.roundCounts) w.roundCounts = {};
  if(w.roundCounts[key] == null) w.roundCounts[key] = 0;
  const count = w.roundCounts[key];
  const done = count >= target;
  const btn = document.createElement('button');
  btn.className = 'gw-section-round-btn';
  btn.disabled = done;
  btn.innerHTML = done
    ? `${ICON_CHECK}<span>Completed</span>`
    : `<span>Round</span><span class="gw-navmid-badge">${count}</span><span class="gw-round-target">/ ${target}</span>`;
  btn.onclick = ()=>{
    if(w.roundCounts[key] >= target) return;
    w.roundCounts[key]++;
    vibrate(15);
    if(w.roundCounts[key] >= target){
      w.sectionsDone[key] = true;
      vibrate([80,40,120]);
      render();
      maybePromptRating(w, key);
      return;
    }
    render();
  };
  return btn;
}
function isPacedRestSpec(spec){
  return !!(spec && spec.kind==='INTERVAL' && spec.totalRounds && spec.label==='X Rest Between Sets');
}
// only one timer can be live at a time. If a DIFFERENT section's timer is minimized in the background,
// returns that section's name so starting another one can be refused (instead of silently throwing
// the running one away); null when nothing else is running (or the other one was never started).
const SECTION_NAMES = {mobility:'Mobility', warmup:'Warm-Up', skill:'Skill', wod:'WOD', core:'Extra'};
function otherRunningTimerName(key){
  // a timer that was opened but never started doesn't hold anything — only a started one blocks the others
  if(focusTimer && !focusTimer.doneBeeped && focusTimer.sectionKey && focusTimer.sectionKey!==key && (focusTimer.running || focusTimer.leadIn || focusTimer.elapsedBefore>0)){
    return SECTION_NAMES[focusTimer.sectionKey] || 'other';
  }
  return null;
}
function blockedStartButton(name){
  const btn = document.createElement('button');
  btn.className = 'gw-section-start-btn';
  btn.disabled = true;
  btn.innerHTML = `${ICON_TIMER}<span>Finish the ${name} timer first</span>`;
  return btn;
}
function addStartSectionButton(node, key){
  addStartButtonCore(node, key);
  // a finished section has nothing left to swap — it just reads "Completed"
  const w = state.currentWorkout;
  if(!(w && w.sectionsDone && w.sectionsDone[key])) appendSectionRefresh(node);
}
function addStartButtonCore(node, key){
  const w = state.currentWorkout;
  const stepData = w && getSectionFocusData(w, key);
  if(!stepData) return;
  const isPacedRest = isPacedRestSpec(stepData.timerSpec);
  if(w.sectionsDone && w.sectionsDone[key]){
    const doneBtn = document.createElement('button');
    doneBtn.className = 'gw-section-round-btn';
    doneBtn.disabled = true;
    doneBtn.innerHTML = `${ICON_CHECK}<span>Completed</span>`;
    node.bodyEl.appendChild(doneBtn);
  } else if(focusTimer && focusTimer.sectionKey===key && !focusTimer.doneBeeped){
    // minimized but still running in the background — reopen it as-is, no fresh start. The fill
    // bar + label are static here and brought to life by updateMinimizedProgress() right after
    // (and every tick after that, from focusTick) so it reads as visibly, actually still running.
    const btn = document.createElement('button');
    btn.className = 'gw-section-start-btn gw-resume-btn';
    const fallbackLabel = isPacedRest ? 'Resume' : sectionStartLabel(key, w).replace(/^Start /, 'Resume ');
    btn.innerHTML = `<div class="gw-resume-fill" id="gw-resume-fill"></div>${ICON_TIMER}<span id="gw-resume-label">${fallbackLabel}</span>`;
    btn.onclick = ()=>resumeSectionFocus(key);
    node.bodyEl.appendChild(btn);
    updateMinimizedProgress();
  } else if((isPacedRest || stepData.timerSpec) && otherRunningTimerName(key)){
    node.bodyEl.appendChild(blockedStartButton(otherRunningTimerName(key)));
  } else if(isPacedRest){
    // one rest at a time: each tap opens a single, simple countdown for whichever set is next.
    // When it finishes (or is skipped) the drawer closes on its own and that set gets marked done
    // — see openPacedRestSet(). The label is constant since it's always the same kind of rest,
    // never "set N of M" — that progress shows on the set rows themselves instead.
    const btn = document.createElement('button');
    btn.className = 'gw-section-start-btn';
    // progress normally shows on the set rows — when those are hidden (block workouts, core), it
    // goes on the button instead so "which set am I on" is never lost
    const rowsHidden = key==='core' || (key==='skill' && w.skillSetReps && w.skillSetReps.every(r=>r===null) && !w.skillLiftKey);
    const doneSets = (w.roundCounts && w.roundCounts[key]) || 0;
    const progress = rowsHidden && stepData.timerSpec.totalRounds > 1 ? ` · Set ${Math.min(doneSets+1, stepData.timerSpec.totalRounds)} of ${stepData.timerSpec.totalRounds}` : '';
    btn.innerHTML = `${ICON_TIMER}<span>Start ${fmtMinutesShort(stepData.timerSpec.minutes)} Rest${progress}</span>`;
    btn.onclick = ()=>openPacedRestSet(key);
    node.bodyEl.appendChild(btn);
  } else if(stepData.timerSpec){
    const btn = document.createElement('button');
    btn.className = 'gw-section-start-btn';
    btn.innerHTML = `${ICON_TIMER}<span>${sectionStartLabel(key, w)}</span>`;
    btn.onclick = ()=>openSectionFocus(key);
    node.bodyEl.appendChild(btn);
  } else {
    node.bodyEl.appendChild(buildInlineRoundCounter(key, w, stepData));
  }
}

function renderSectionNode(key, w, opts){
  opts = opts || {};
  if(key==='mobility'){
    if(!w.mobility) return null;
    const node = sectionWithChips('Mobility', w.mobility, '', {
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'mobility'),
      isDone: !!w.sectionsDone.mobility,
      timerSpec: w.mobilityTimer
    });
    node.finalize();
    addStartSectionButton(node, 'mobility');
    return node;
  }
  if(key==='warmup'){
    if(!w.warmup) return null;
    const node = sectionWithChips('Warm-Up', w.warmup, '', {
      onReroll: opts.simple ? null : ()=>rerollSection('warmup'),
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'warmup'),
      isDone: !!w.sectionsDone.warmup
    });
    node.finalize();
    addStartSectionButton(node, 'warmup');
    return node;
  }
  if(key==='skill'){
    if(!w.skillTplText) return null;
    const node = sectionWithChips('Skill', w.skillTplText, w.deload ? 'DELOAD' : '', {
      onReroll: opts.simple ? null : ()=>rerollSection('skill'),
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'skill'),
      isDone: !!w.sectionsDone.skill,
      timerSpec: w.skillTimer,
      setsList: w.skillSetReps,
      setsWeights: w.skillLiftKey ? w.skillSetWeights : null,
      loads: w.skillLoads,
      onLoadChange: opts.simple ? null : (idx, val)=>{ w.skillLoads[idx].load = val; },
      doneCount: isPacedRestSpec(w.skillTimer) ? ((w.roundCounts && w.roundCounts.skill) || 0) : 0,
      onWeightChange: opts.simple ? null : (idx, val)=>{
        for(let i=idx; i<w.skillSetWeights.length; i++) w.skillSetWeights[i] = val;
        w.suggestedLoad = w.skillSetWeights[w.skillSetWeights.length-1]; // logged/progression value tracks the last set
      },
      onSetsDelta: opts.simple ? null : (d)=>adjustSets('skill', d)
    });
    const deloadNote = buildDeloadNote(w);
    if(deloadNote) node.bodyEl.appendChild(deloadNote);
    node.finalize();
    addStartSectionButton(node, 'skill');
    return node;
  }
  if(key==='wod'){
    return renderWodSection(w);
  }
  if(key==='core'){
    if(!w.core) return null;
    const node = sectionWithChips(extraTitle(w), w.core, '', {
      onReroll: opts.simple ? null : ()=>rerollSection('core'),
      onDone: opts.simple ? null : ()=>toggleSectionDone(w, 'core'),
      isDone: !!w.sectionsDone.core,
      timerSpec: w.coreTimer
    });
    node.finalize();
    addStartSectionButton(node, 'core');
    return node;
  }
  return null;
}

function buildRateBlock(labelText, currentVal, onPick){
  const block = document.createElement('div');
  block.className = 'gw-rate-block';
  const lbl = document.createElement('div');
  lbl.className = 'gw-rate-label';
  lbl.textContent = labelText;
  block.appendChild(lbl);
  const optsRow = document.createElement('div');
  optsRow.className = 'gw-rate-options';
  ['easy','right','hard'].forEach(r=>{
    const b = mkBtn(RPE_LABELS[r], currentVal===r ? 'gw-primary' : 'gw-btn', ()=>onPick(r));
    optsRow.appendChild(b);
  });
  block.appendChild(optsRow);
  return block;
}

// "How did it feel?" pops up as its own drawer right when a section is marked done, instead of
// sitting as a permanent block at the bottom of the page
function openRateDrawer(kind){
  const w = state.currentWorkout;
  if(!w) return;
  const content = document.getElementById('gw-rate-drawer-content');
  content.innerHTML = '';

  if(kind==='skill'){
    content.appendChild(buildRateBlock(`How did ${LIFT_LABELS[w.skillLiftKey]} feel?`, w.rpe, (r)=>{
      w.rpe = r;
      closeRateDrawer();
      render();
    }));
    rateDrawerOpenedAt = Date.now(); document.getElementById('gw-rate-drawer-backdrop').classList.add('show');
    return;
  }

  // the timer flow (tapping rounds, or running the clock to a finish) is what normally fills in
  // wodPerformance — but tapping "Mark as done" on the section skips all of that entirely, and an
  // AMRAP's tap counter never asks about the partial round in progress when time ran out either.
  // So: whatever this WOD's format actually scores, make sure there's a way to enter it here.
  const spec = w.wodTimerSpec || parseTimerFromText(w.format);
  const wodKind = spec && spec.kind;
  const wodMode = spec && spec.mode;
  if(!w.wodPerformance) w.wodPerformance = {};
  const perf = w.wodPerformance;

  if(wodKind==='FORTIME' || wodKind==='RFT' || wodKind==='LADDER' || wodKind==='FORTIME_REPEATS'){
    const timeParts = (perf.time || '').split(':');
    const row = document.createElement('div');
    row.className = 'gw-setting-row';
    row.innerHTML = '<span>Finishing Time</span>';
    const wrap = document.createElement('div');
    wrap.className = 'gw-split-inputs';
    const minInput = document.createElement('input');
    minInput.type = 'number'; minInput.min = '0'; minInput.placeholder = '0'; minInput.value = timeParts[0] || '';
    const secInput = document.createElement('input');
    secInput.type = 'number'; secInput.min = '0'; secInput.max = '59'; secInput.placeholder = '0'; secInput.value = timeParts[1] || '';
    const syncTime = ()=>{
      perf.time = (minInput.value || secInput.value) ? `${String(minInput.value||0).padStart(2,'0')}:${String(secInput.value||0).padStart(2,'0')}` : null;
    };
    minInput.oninput = syncTime; secInput.oninput = syncTime;
    wrap.appendChild(minInput);
    wrap.appendChild(Object.assign(document.createElement('span'), {textContent:'min'}));
    wrap.appendChild(secInput);
    wrap.appendChild(Object.assign(document.createElement('span'), {textContent:'sec'}));
    row.appendChild(wrap);
    content.appendChild(row);
  } else if(wodKind==='AMRAP' && (wodMode==='reps' || wodMode==='ascending')){
    const row = document.createElement('div');
    row.className = 'gw-setting-row';
    row.innerHTML = '<span>Total Reps — edit if the count is off</span>';
    const repsInput = document.createElement('input');
    repsInput.type = 'number'; repsInput.min = '0'; repsInput.placeholder = '0';
    repsInput.value = perf.extraReps != null ? perf.extraReps : '';
    repsInput.oninput = ()=>{ perf.extraReps = repsInput.value === '' ? null : Number(repsInput.value); };
    row.appendChild(repsInput);
    content.appendChild(row);
  } else if(wodKind==='AMRAP'){
    const row = document.createElement('div');
    row.className = 'gw-setting-row';
    row.innerHTML = '<span>Score — rounds + extra reps into the next round</span>';
    const wrap = document.createElement('div');
    wrap.className = 'gw-split-inputs';
    const roundsInput = document.createElement('input');
    roundsInput.type = 'number'; roundsInput.min = '0'; roundsInput.placeholder = '0';
    roundsInput.value = perf.rounds != null ? perf.rounds : '';
    roundsInput.oninput = ()=>{ perf.rounds = roundsInput.value === '' ? null : Number(roundsInput.value); };
    const repsInput = document.createElement('input');
    repsInput.type = 'number'; repsInput.min = '0'; repsInput.placeholder = '0';
    repsInput.value = perf.extraReps != null ? perf.extraReps : '';
    repsInput.oninput = ()=>{ perf.extraReps = repsInput.value === '' ? null : Number(repsInput.value); };
    wrap.appendChild(roundsInput);
    wrap.appendChild(Object.assign(document.createElement('span'), {textContent:'rounds +'}));
    wrap.appendChild(repsInput);
    wrap.appendChild(Object.assign(document.createElement('span'), {textContent:'reps'}));
    row.appendChild(wrap);
    content.appendChild(row);
  }

  // the WOD rating carries a bit more than feel — RX/Scaled and an optional note — so it's all
  // one drawer with an explicit Done, rather than closing the instant a feel button is tapped
  const rxBlock = document.createElement('div');
  rxBlock.className = 'gw-rate-block';
  const rxLbl = document.createElement('div');
  rxLbl.className = 'gw-rate-label';
  rxLbl.textContent = 'Did you do the full workout, or change something?';
  rxBlock.appendChild(rxLbl);
  const rxRow = document.createElement('div');
  rxRow.className = 'gw-rate-options';
  [{v:'rx', label:'Full Workout'}, {v:'scaled', label:'Modified It'}].forEach(opt=>{
    const b = mkBtn(opt.label, w.rxStatus===opt.v ? 'gw-primary' : 'gw-btn', ()=>{ w.rxStatus = opt.v; openRateDrawer('wod'); });
    rxRow.appendChild(b);
  });
  rxBlock.appendChild(rxRow);
  content.appendChild(rxBlock);

  content.appendChild(buildRateBlock('How did the WOD feel?', w.wodRpe, (r)=>{ w.wodRpe = r; openRateDrawer('wod'); }));

  const notesLabel = document.createElement('div');
  notesLabel.style.cssText = 'font-size:12px; color:var(--muted); margin:14px 0 6px;';
  notesLabel.textContent = 'Notes (optional)';
  content.appendChild(notesLabel);
  const notesInput = document.createElement('textarea');
  notesInput.className = 'gw-activity-notes';
  notesInput.style.minHeight = '44px';
  notesInput.value = w.wodNotes || '';
  notesInput.oninput = ()=>{ w.wodNotes = notesInput.value; };
  content.appendChild(notesInput);

  const doneBtn = mkBtn('Done', 'gw-teal', ()=>{ closeRateDrawer(); render(); });
  doneBtn.style.cssText = 'margin-top:16px; width:100%;';
  content.appendChild(doneBtn);

  rateDrawerOpenedAt = Date.now(); document.getElementById('gw-rate-drawer-backdrop').classList.add('show');
}
function closeRateDrawer(){
  document.getElementById('gw-rate-drawer-backdrop').classList.remove('show');
}

// call right after a section flips to done — opens the matching rate drawer if that rating is still missing
function maybePromptRating(w, key){
  if(!w || !w.sectionsDone || !w.sectionsDone[key]) return;
  if(key==='wod' && w.wodRpe==null){ openRateDrawer('wod'); return; }
  if(key==='skill' && w.skillLiftKey && w.rpe==null){ openRateDrawer('skill'); return; }
}

// builds the Log & Save button; the ratings themselves live in the rate drawer, triggered on completion
function renderRatingAndLogBlock(container, w, onChange){
  const logBtn = mkBtn('Log & Save to History', 'gw-teal', ()=>logWorkout());
  const missingRating = (w.skillLiftKey && !w.rpe) || !w.wodRpe;
  logBtn.disabled = missingRating;
  container.appendChild(logBtn);
  if(missingRating){
    const hint = document.createElement('div');
    hint.style.cssText = 'width:100%; font-size:11.5px; color:var(--coral); text-align:center; font-weight:700; text-decoration:underline; cursor:pointer;';
    hint.textContent = w.skillLiftKey && !w.rpe && !w.wodRpe
      ? "Rate the lift and the WOD to save this session."
      : (w.skillLiftKey && !w.rpe ? "Rate the lift to save this session." : "Rate the WOD to save this session.");
    hint.onclick = ()=>{
      if(w.skillLiftKey && !w.rpe) openRateDrawer('skill');
      else if(!w.wodRpe) openRateDrawer('wod');

}
