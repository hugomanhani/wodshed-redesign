// ---------- Section Focus ----------
function getSectionFocusData(w, key){
  w.wodText = buildWodText(w.format, w.wodMovements);
  const defs = {
    mobility: {label:'Mobility', text: w.mobility},
    warmup: {label:'Warm-Up', text: w.warmup},
    skill: {label:'Skill', text: w.skillTplText},
    wod: {label:'WOD', text: w.wodText},
    core: {label: extraTitle(w), text: w.core}
  };
  const d = defs[key];
  if(!d) return null;
  const explicitSpec = key==='core' ? w.coreTimer : (key==='wod' ? w.wodTimerSpec : (key==='skill' ? w.skillTimer : (key==='mobility' ? w.mobilityTimer : null)));
  const timerSpec = explicitSpec || parseTimerFromText(d.text);
  return {key, label: d.label, text: d.text, timerSpec};
}
function openSectionFocus(key){
  if(!state.currentWorkout) return;
  const busy = otherRunningTimerName(key);
  if(busy){ toast(`Finish or cancel the ${busy} timer first.`); return; }
  if(focusTimer && focusTimer.sectionKey!==key){
    focusStopTicking();
    focusTimer = null;
  }
  state.focusMode = true;
  state.focusSectionKey = key;
  state.focusTapCount = 0;
  state.focusAscendingTotal = 0;
  state.focusAmrepsTotal = 0;
  state.focusSplits = [];
  document.getElementById('gw-timer-drawer-backdrop').classList.add('show');
  renderSectionFocus();
}
// opens ONE simple rest countdown for whichever set is next — not the whole "N sets, rest between
// them" spec. It's a plain COUNTDOWN, tagged with repeatKey/repeatTotal so focusFinish() knows to
// advance that one set instead of marking the whole section done (see advancePacedRestRound()).
// Starts immediately — no lead-in ceremony, no separate play tap — since it's meant to be as
// simple as tapping "start" on a kitchen timer.
function openPacedRestSet(key){
  if(!state.currentWorkout) return;
  const stepData = getSectionFocusData(state.currentWorkout, key);
  const baseSpec = stepData && stepData.timerSpec;
  if(!isPacedRestSpec(baseSpec)) return;
  const busy = otherRunningTimerName(key);
  if(busy){ toast(`Finish or cancel the ${busy} timer first.`); return; }
  if(focusTimer && focusTimer.sectionKey!==key){
    focusStopTicking();
    focusTimer = null;
  }
  state.focusMode = true;
  state.focusSectionKey = key;
  state.focusTapCount = 0;
  document.getElementById('gw-timer-drawer-backdrop').classList.add('show');
  renderSectionFocus({kind:'COUNTDOWN', minutes:baseSpec.minutes, repeatKey:key, repeatTotal:baseSpec.totalRounds});
}
function closeTimerDrawer(){
  state.focusMode = false;
  focusStopTicking();
  focusTimer = null;
  document.getElementById('gw-timer-drawer-backdrop').classList.remove('show');
}
// confirmed "Cancel Timer" in the discard-progress dialog — despite the name, this used to just
// reset the clock back to 0:00 and leave the same drawer open, which read as the button doing
// nothing while the timer was still running (tap it, dialog closes, nothing else visibly changes).
// It should actually discard the session and back out, same as closing a timer with no progress on it.
function cancelTimerAndClose(){
  document.getElementById('gw-timerstop-backdrop').classList.remove('show');
  // this session's timer (and the pause it may have triggered) is about to be discarded entirely
  // — reset the flag so it can't leak into a later timer session that gets its own fresh pause/resume
  cancelPromptAutoPaused = false;
  const key = state.focusSectionKey;
  const w = state.currentWorkout;
  // rounds / reps tallied on an unfinished WOD timer go with it, so they can't turn up later as a result nobody finished
  if(key==='wod' && w && w.wodPerformance && !(w.sectionsDone && w.sectionsDone.wod)){
    delete w.wodPerformance.rounds; delete w.wodPerformance.extraReps;
  }
  focusStopTicking();
  closeTimerDrawer();
  render();
  maybePromptRating(w, key);
}
// stopping the WOD partway and keeping what was done: logged as a modified workout, with where it
// stopped (time, and rounds when the format has a round count) kept as the result and in the notes
function stopTimerAndLogPartial(){
  document.getElementById('gw-timerstop-backdrop').classList.remove('show');
  cancelPromptAutoPaused = false;
  const w = state.currentWorkout;
  if(!w || !focusTimer || focusTimer.sectionKey!=='wod') return;
  const t = focusTimer;
  const stoppedAt = fmtClock(Math.floor(focusCurrentElapsed()));
  const roundCap = t.kind==='RFT' || t.kind==='FORTIME_REPEATS' ? t.rounds : (t.kind==='LADDER' ? t.rungs.length : null);
  if(!w.wodPerformance) w.wodPerformance = {};
  const perf = w.wodPerformance;
  perf.completedAll = false;
  perf.stoppedAt = stoppedAt;
  let note = `Stopped at ${stoppedAt}`;
  if(roundCap){
    perf.roundsDone = state.focusTapCount; perf.roundsTotal = roundCap;
    note += ` — ${state.focusTapCount} of ${roundCap} rounds done`;
  } else if(t.kind==='AMRAP' && !t.cycles && t.mode!=='reps' && state.focusTapCount){
    note += ` — ${state.focusTapCount} round${state.focusTapCount===1 ? '' : 's'}`;
  }
  w.wodNotes = w.wodNotes ? `${note}. ${w.wodNotes}` : note;
  w.rxStatus = 'scaled';
  if(w.sectionsDone) w.sectionsDone.wod = true;
  state.focusStepDone.wod = true;
  focusStopTicking();
  closeTimerDrawer();
  render();
  maybePromptRating(w, 'wod');
}
// tracks whether requestCloseFloatCard() itself paused a running timer to show the confirm
// dialog — vs. it was already paused (the athlete's own choice) before Cancel was even tapped —
// so dismissing the dialog only auto-resumes in the first case, never overriding a pause the
// athlete set deliberately
let cancelPromptAutoPaused = false;
function requestCloseFloatCard(){
  if(!focusTimer || focusTimer.doneBeeped) return;
  if(focusTimer.running || focusTimer.elapsedBefore > 0){
    // pause immediately so the clock visibly freezes the instant "Cancel timer" is tapped —
    // otherwise it keeps ticking behind the confirm dialog and reads as "still not stopped"
    if(focusTimer.running){
      focusPause();
      cancelPromptAutoPaused = true;
    }
    // real progress is on the line — confirm before throwing it away. A rest-between-sets countdown is
    // the exception: the sets already finished are kept on the workout itself.
    const canLogPartial = focusTimer.sectionKey==='wod' && !focusTimer.repeatKey;
    document.getElementById('gw-timerstop-msg').textContent = focusTimer.repeatKey
      ? "This stops the rest timer. Sets you've already finished stay checked off."
      : (canLogPartial
        ? "Cancelling discards its progress, including any rounds or reps you've logged. Or stop here and log what you did as a modified workout."
        : "This stops the timer and discards its progress, including any rounds or reps you've logged.");
    document.getElementById('gw-timerstop-log').style.display = canLogPartial ? '' : 'none';
    document.getElementById('gw-timerstop-backdrop').classList.add('show');
  } else {
    // nothing's happened yet, so there's nothing to confirm discarding — this was a silent
    // no-op before, which read as "the button doesn't work"; just back out like the X does
    requestExitFocus();
  }
}
function cancelCloseFloatCard(){
  document.getElementById('gw-timerstop-backdrop').classList.remove('show');
  if(cancelPromptAutoPaused){
    cancelPromptAutoPaused = false;
    focusStart();
  }
}
// the X (and tapping the backdrop) never asks to confirm anymore — a timer that's still going
// just minimizes so the athlete can glance at the workout, while a finished one has nothing left
// to resume, so it closes outright
function requestExitFocus(){
  if(focusTimer && !focusTimer.doneBeeped){
    minimizeTimerDrawer();
  } else {
    confirmExitFocus();
  }
}
// swaps the drawer's X for a "minimize" icon (arrows pointing in) whenever tapping it will
// actually minimize rather than end the session for good, so that's visible before tapping it —
// not just discoverable after the fact from the "still running" resume button
function updateFocusCloseButton(){
  const btn = document.getElementById('gw-focus-close');
  if(!btn) return;
  const willMinimize = !!(focusTimer && !focusTimer.doneBeeped);
  btn.innerHTML = willMinimize ? ICON_MINIMIZE : ICON_X;
  btn.title = willMinimize ? 'Minimize — the timer keeps running' : 'Close';
  btn.setAttribute('aria-label', willMinimize ? 'Minimize timer — keeps running in the background' : 'Close timer');
}
// hides the drawer but leaves focusTimer running in the background — its own tick loop keeps
// going (and will still auto-finish the section) even while the drawer isn't on screen
function minimizeTimerDrawer(){
  document.getElementById('gw-timer-drawer-backdrop').classList.remove('show');

}
// re-opens the drawer on the timer that's already running in the background, without touching
// focusTimer or any of its accumulated progress (see the isResume guard in renderSectionFocus)
function resumeSectionFocus(key){
  if(!state.currentWorkout) return;
  state.focusMode = true;
  state.focusSectionKey = key;
  document.getElementById('gw-timer-drawer-backdrop').classList.add('show');

}
function confirmExitFocus(){
  const key = state.focusSectionKey;
  const w = state.currentWorkout;

// overrideSpec is how openPacedRestSet() hands in a plain COUNTDOWN (tagged with repeatKey) in
// place of the section's real "N sets, rest between them" spec — everything else about the
// drawer (title, weight adjuster) still comes from stepData/key as normal
// the exercise lines of a section's text ("Toes to Bar" / "6-10 reps") — what the timer names while it runs
function focusExercises(text){
  try{ return parseSectionText(text || '').items.filter(it=>it.kind==='exercise' && it.name).map(it=>({name:it.name, qty:it.qty})); }
  catch(e){ return []; }
}
function renderSectionFocus(overrideSpec){

  document.getElementById('gw-focus-header-name').textContent = stepData.label;

  // focusTimer as-is — a fresh open would otherwise wipe out its progress
  const isResume = !!(focusTimer && focusTimer.sectionKey===key && !focusTimer.doneBeeped);

  // the drawer stays a focused, timer-only view. Weight (for lift-based skill work) is the one thing

  // Resuming reads the spec straight off the already-open focusTimer (it may be an overrideSpec
  // from an earlier openPacedRestSet() call that stepData.timerSpec knows nothing about).
  const spec = isResume ? focusTimer : (overrideSpec || stepData.timerSpec);

    // the strip only exists when the timer has a round button to fill it
    const k0 = spec && spec.kind;
    const hasRoundBtn = stepData.timerSpec && ((k0==='AMRAP' && spec.mode!=='reps') || k0==='RFT' || k0==='LADDER' || k0==='FORTIME_REPEATS');
    if(!stepData.timerSpec || hasRoundBtn) container.appendChild(roundLogEl);
    if(isResume) roundLogEl.scrollTop = roundLogEl.scrollHeight;
  }

  if(stepData.timerSpec){
    const kind = spec.kind;

    const card = document.createElement('div');
    card.className = 'gw-stage';
    card.id = 'gw-floatcard';
    card.innerHTML = `
      <div class="gw-cycle-badge" id="gw-focus-cyclebadge" style="display:none;"></div>
      <div class="gw-dial" id="gw-dial">
        <div class="gw-dial-center">
          <div class="gw-focus-phaseword" id="gw-focus-phase"></div>
          <div class="gw-dial-clock" id="gw-focus-number">00:00</div>
          <div class="gw-stage-headline" id="gw-focus-sub"></div>
          <div class="gw-dial-secondary" id="gw-focus-secondary"></div>
        </div>
      </div>
      <div class="gw-stage-weight" id="gw-stage-weight" style="display:none;">
        <button type="button" id="gw-weight-minus" aria-label="Decrease weight">−</button>
        <div class="gw-stage-weight-mid">
          <div class="gw-stage-weight-val"><span id="gw-weight-value">0</span><span>lb</span></div>
          <div class="gw-stage-weight-plates" id="gw-weight-plates"></div>
        </div>
        <button type="button" id="gw-weight-plus" aria-label="Increase weight">+</button>
      </div>
      <div class="gw-ctl-row">
        <div class="gw-ctl-slot">
          <div class="gw-nownext" id="gw-nownext" style="display:none;">
            <div class="gw-nn-block"><span class="gw-nn-label">Now</span><span class="gw-nn-name gw-nn-now" id="gw-nn-now"></span><span class="gw-nn-sub" id="gw-nn-nowsub"></span></div>
            <div class="gw-nn-block" id="gw-nn-nextblock"><span class="gw-nn-label">Next</span><span class="gw-nn-name" id="gw-nn-next"></span></div>
          </div>
          <button class="gw-ctl gw-hold-finish" id="gw-focus-hold" style="display:none;" type="button" aria-label="Hold to finish">${ICON_CHECK}<span>Hold to finish</span></button>
          <button class="gw-ctl gw-stage-round" id="gw-focus-plus" style="display:none;" type="button">
            <span class="gw-stage-round-badge" id="gw-focus-roundsbadge">0</span>
            <span class="gw-stage-round-label" id="gw-focus-plus-label">Round</span>
          </button>
          <div class="gw-floatcard-next" id="gw-floatcard-next" style="display:none;">
            <button class="gw-ctl" id="gw-focus-skipnext" type="button">${ICON_SKIP}<span>Next</span></button>
          </div>
        </div>
        <button class="gw-ctl gw-dial-play" id="gw-floatcard-playpause" aria-label="Play or pause" type="button">${ICON_PLAY}</button>
      </div>
      <button class="gw-showworkout-toggle" id="gw-floatcard-close" type="button">Cancel timer</button>`;
    container.appendChild(card);

    if(key==='skill' && w.skillLiftKey){
      const weightRow = document.getElementById('gw-stage-weight');
      weightRow.style.display = '';
      const valueEl = document.getElementById('gw-weight-value');
      const platesEl = document.getElementById('gw-weight-plates');
      // the weight shown (and changed) here is the CURRENT set's, and a change carries forward to the
      // sets still to come — same rule as editing a set's weight on the main screen — so the main
      // screen's set rows stay in step with what the timer says instead of drifting apart
      const currentSetIdx = ()=>{
        const last = w.skillSetWeights.length - 1;
        if(isPacedRestSpec(w.skillTimer)) return Math.min(last, (w.roundCounts && w.roundCounts.skill) || 0);
        if(focusTimer && focusTimer.kind==='INTERVAL' && focusTimer.minutes) return Math.min(last, Math.floor(focusCurrentElapsed() / (focusTimer.minutes*60)));
        return 0;
      };
      const shown = ()=> w.skillSetWeights[currentSetIdx()] ?? w.suggestedLoad;
      const paint = ()=>{ valueEl.textContent = shown(); platesEl.textContent = plateBreakdown(shown()); };
      paint();
      const nudge = (delta)=>{
        const idx = currentSetIdx();
        const val = Math.max(0, shown() + delta);
        for(let i=idx; i<w.skillSetWeights.length; i++) w.skillSetWeights[i] = val;
        w.suggestedLoad = w.skillSetWeights[w.skillSetWeights.length-1];
        paint(); vibrate(10);
        render(); // refresh the main screen's set rows behind the drawer
      };
      document.getElementById('gw-weight-minus').onclick = ()=>nudge(-5);
      document.getElementById('gw-weight-plus').onclick = ()=>nudge(5);
    }

    const isAmreps = kind==='AMRAP' && spec.mode==='reps';
    const isAscending = kind==='AMRAP' && spec.mode==='ascending';
    // a plain COUNTDOWN opened via openPacedRestSet() carries repeatKey/repeatTotal — one single
    // rest, no round-tap button needed; "Skip" (the Next/skip-ahead slot, repurposed) is the only
    // way to end it early, same as letting it run out.
    const isRepeatCountdown = kind==='COUNTDOWN' && !!spec.repeatKey;

    // the left circle: a round counter — or, for AMReps, a quick tally of reps (the exact total is asked for when it's done)
    if(kind==='AMRAP' || kind==='RFT' || kind==='LADDER' || kind==='FORTIME_REPEATS'){
      card.querySelector('#gw-focus-plus').style.display = '';
    }
    if(isAmreps) document.getElementById('gw-focus-plus-label').textContent = 'Reps';
    if(kind==='INTERVAL'){
      card.querySelector('#gw-floatcard-next').style.display = '';
    }
    if(isRepeatCountdown){
      card.querySelector('#gw-floatcard-next').style.display = '';
      document.getElementById('gw-focus-skipnext').innerHTML = `${ICON_SKIP}<span>Skip</span>`;
    }
    if(kind==='FORTIME_REPEATS') document.getElementById('gw-focus-plus-label').textContent = 'Round Done';
    // Tabata and EMOMs show what's being done (and what's coming) in the otherwise empty left slot
    if(kind==='TABATA' || (kind==='EMOM' && !spec.openEnded && (spec.alternate || state.focusExercises.length))) card.querySelector('#gw-nownext').style.display = 'flex';
    // plain For Time and open-ended EMOM end on the athlete's own call — hold the left circle to finish
    const holdFinish = kind==='FORTIME' || (kind==='EMOM' && spec.openEnded);
    if(holdFinish){
      const holdBtn = card.querySelector('#gw-focus-hold');
      holdBtn.style.display = '';
      wireHoldToFinish(holdBtn, key);
    }
    if(isAscending) document.getElementById('gw-focus-plus-label').textContent = `+${spec.increment}`;

    const roundCap = (kind==='RFT') ? spec.rounds : (kind==='LADDER' ? spec.rungs.length : (kind==='FORTIME_REPEATS' ? spec.rounds : null));
    if(isAmreps && !isResume) state.focusAmrepsTotal = 0;
    // the circle reads "0/5" (done / prescribed) when there's a prescribed count, else just the number
    const paintRound = ()=>{
      const n = isAmreps ? (state.focusAmrepsTotal||0) : (isAscending ? (state.focusAscendingTotal||0) : state.focusTapCount);
      const badge = document.getElementById('gw-focus-roundsbadge');
      badge.textContent = roundCap ? `${n}/${roundCap}` : n;
      badge.classList.toggle('gw-long', badge.textContent.length > 4);
    };
    paintRound();
    if(isResume && roundCap && state.focusTapCount >= roundCap) document.getElementById('gw-focus-plus').disabled = true;

    document.getElementById('gw-focus-plus').onclick = ()=>{
      const plusEl = document.getElementById('gw-focus-plus');
      if(isAmreps){
        state.focusAmrepsTotal = (state.focusAmrepsTotal||0) + 1;
        if(key==='wod'){ if(!w.wodPerformance) w.wodPerformance = {}; w.wodPerformance.extraReps = state.focusAmrepsTotal; }
        paintRound(); vibrate(10);
        plusEl.classList.add('gw-tap-flash'); setTimeout(()=>plusEl.classList.remove('gw-tap-flash'), 90);
        return;
      }
      if(roundCap && state.focusTapCount >= roundCap) return;
      state.focusTapCount++;
      if(isAscending){
        state.focusAscendingTotal = (state.focusAscendingTotal||0) + (spec.startReps + (state.focusTapCount-1)*spec.increment);
      }
      // this same "+" button also tracks progress toward roundCap for RFT/LADDER/FORTIME_REPEATS,
      // but those are FOR-TIME formats — the goal is finishing fast, not the (fixed, prescribed)
      // round count, so only AMRAP actually logs rounds as the score. Their real score is the
      // elapsed time set by focusManualFinish/focusFinish when the cap is reached or time's called.
      if(key==='wod' && kind==='AMRAP'){
        if(!w.wodPerformance) w.wodPerformance = {};
        w.wodPerformance.rounds = state.focusTapCount;
        if(isAscending) w.wodPerformance.extraReps = state.focusAscendingTotal;
      }
      paintRound();
      plusEl.classList.add('gw-tap-flash');
      setTimeout(()=>plusEl.classList.remove('gw-tap-flash'), 120);
      vibrate(15);
      logRoundTap(focusCurrentElapsed());
      if(roundCap && state.focusTapCount >= roundCap){
        // last prescribed round just got logged — that finishes the WOD, no separate finish control needed
        focusManualFinish(key);
        plusEl.disabled = true;
      } else {
        if(kind==='FORTIME_REPEATS' && focusTimer) focusTimer.restUntil = focusCurrentElapsed() + spec.restSeconds;
        focusUpdateDisplay();
      }
    };
    // a repeat-countdown's "Next" slot is repurposed as "Skip" — ending the rest early counts the
    // same as letting it run out, via the exact same focusFinish() path
    document.getElementById('gw-focus-skipnext').onclick = isRepeatCountdown ? ()=>{ focusFinish(); focusUpdateDisplay(); } : (kind==='INTERVAL' ? focusSkipToNextRound : focusSkipRest);
    document.getElementById('gw-floatcard-playpause').onclick = focusToggleFromTap;
    document.getElementById('gw-floatcard-close').onclick = requestCloseFloatCard;

    if(isResume){
      focusUpdateDisplay();
      focusUpdateButtonStates();
    } else {
      focusOpenTimer(spec, key);
      // a repeat-countdown is meant to be as simple as a kitchen timer: tapping "Start Rest" on
      // the section card should be the one action that starts it, no separate play tap needed
      if(spec.repeatKey) focusStart();
    }
  } else {
    // the only way to reach the drawer is via a Start button gated on stepData.timerSpec — this shouldn't happen
    state.focusMode = false;
    render();
  }
}

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

// hold the circle until its ring fills — a deliberate press, so a stray tap can't end the workout
function wireHoldToFinish(btn, stepKey){
  const HOLD_MS = 900;
  let t0 = 0, raf = 0, active = false;
  const reset = ()=>{ active = false; cancelAnimationFrame(raf); btn.style.setProperty('--p', 0); };
  const tick = ()=>{
    if(!active) return;
    const p = Math.min(1, (performance.now() - t0) / HOLD_MS);
    btn.style.setProperty('--p', p);
    if(p >= 1){ active = false; focusManualFinish(stepKey); }
    else raf = requestAnimationFrame(tick);
  };
  btn.addEventListener('pointerdown', e=>{ if(btn.disabled) return; e.preventDefault(); active = true; t0 = performance.now(); vibrate(10); raf = requestAnimationFrame(tick); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev, reset));
  btn.addEventListener('contextmenu', e=>e.preventDefault());
}


// a finished timer has nothing left to resume, so it closes itself — deferred a beat so the
// "Completed" state/toast is visible for a moment first, and deferred (not synchronous) because
// focusFinish() calls this from inside focusUpdateDisplay(), which still touches focusTimer's
// fields after the fact — nulling it out mid-call would throw
function focusAutoCloseAndRate(key){
  setTimeout(()=>{
    const w = state.currentWorkout;
    closeTimerDrawer();
    render();
    maybePromptRating(w, key);
  }, 1000);
}
function focusManualFinish(stepKey){
  if(!focusTimer) return;
  focusTimer.elapsedBefore = focusCurrentElapsed();
  focusTimer.running = false;
  cancelAnimationFrame(focusTimer.raf);
  focusTimer.doneBeeped = true;
  const w = state.currentWorkout;
  if(stepKey==='wod' && w){
    if(!w.wodPerformance) w.wodPerformance = {};
    w.wodPerformance.time = fmtClock(Math.floor(focusTimer.elapsedBefore));
  }
  if(w && w.sectionsDone) w.sectionsDone[stepKey] = true;
  beepTriple();
  vibrate([80,40,80,40,160]);
  focusUpdateDisplay();
  focusUpdateButtonStates();
  state.focusStepDone[stepKey] = true;
  focusAutoCloseAndRate(stepKey);
}
// a repeat-countdown's completion (natural or skipped) advances the paced-rest set counter
// instead of marking the whole section done outright — only the LAST set's rest actually finishes
// the section. Progress lives on the workout itself (w.roundCounts), not on the transient
// focusTimer, so each fresh countdown remembers where it left off the same way the inline round
// counters (for untimed sections) already do.
function advancePacedRestRound(){
  const key = focusTimer.repeatKey, total = focusTimer.repeatTotal;
  const w = state.currentWorkout;
  if(!w || !key) return;
  if(!w.roundCounts) w.roundCounts = {};
  if(w.roundCounts[key] == null) w.roundCounts[key] = 0;
  w.roundCounts[key] = Math.min(total, w.roundCounts[key] + 1);
  if(w.roundCounts[key] >= total){
    state.focusStepDone[key] = true;
    if(w.sectionsDone) w.sectionsDone[key] = true;
  }
}

// independent timer engine for Focus Mode (mirrors the modal's logic but keeps its own state,
// so opening the section-timer modal separately never conflicts with an in-progress Focus Mode timer)
let focusTimer = null;
function focusCurrentElapsed(){
  if(!focusTimer) return 0;
  const running = focusTimer.running ? (performance.now() - focusTimer.startedAt)/1000 : 0;
  return focusTimer.elapsedBefore + running;
}
function focusOpenTimer(spec, sectionKey){
  focusTimer = { ...spec, running:false, startedAt:null, elapsedBefore:0, lastBeepUnit:-1, lastPhaseKey:null, lastTickSecond:null, doneBeeped:false, halfwayBeeped:false, leadIn:false, sectionKey };
  cancelPromptAutoPaused = false; // a fresh session starts with no pending auto-pause from a prior one
  focusUpdateDisplay();
  focusUpdateButtonStates();
}
function focusMaybeTick(secondsRemaining){
  if(!focusTimer || !focusTimer.running) return;
  const whole = Math.ceil(secondsRemaining);
  if(whole>=1 && whole<=3 && whole !== focusTimer.lastTickSecond){
    tickBeep();
    vibrate(20);
    focusTimer.lastTickSecond = whole;
  } else if(whole>3){
    focusTimer.lastTickSecond = null;
  }
}
function focusFinish(){
  if(focusTimer && !focusTimer.doneBeeped){
    focusTimer.doneBeeped = true;
    focusTimer.running = false;
    beepTriple();
    vibrate([100,60,100,60,200]);
    focusUpdateButtonStates();
    if(focusTimer.repeatKey){
      advancePacedRestRound();
    } else if(focusTimer.sectionKey){
      state.focusStepDone[focusTimer.sectionKey] = true;
      const w = state.currentWorkout;
      if(w && w.sectionsDone) w.sectionsDone[focusTimer.sectionKey] = true;
      if(focusTimer.sectionKey==='wod' && w){
        if(!w.wodPerformance) w.wodPerformance = {};
        if(focusTimer.kind==='FORTIME' || focusTimer.kind==='RFT' || focusTimer.kind==='LADDER' || focusTimer.kind==='FORTIME_REPEATS'){
          w.wodPerformance.time = fmtClock(Math.floor(focusCurrentElapsed()));
        }
      }
    }
    focusAutoCloseAndRate(focusTimer.sectionKey);
  }
}
function focusTick(){
  if(!focusTimer || !focusTimer.running) return;
  // a repeat-countdown's natural finish is checked here unconditionally (not just inside
  // focusUpdateDisplay, which is skipped entirely while the drawer's closed) so a minimized rest
  // still completes — and its set still gets marked done — on time instead of sitting frozen
  // until the drawer's reopened
  if(focusTimer.repeatKey && focusCurrentElapsed() >= focusTimer.minutes*60){
    focusFinish();
  }
  if(!focusTimer || !focusTimer.running) return; // may have just finished
  updateMinimizedProgress();
  if(document.getElementById('gw-focus-number')) focusUpdateDisplay();
  focusTimer.raf = requestAnimationFrame(focusTick);
}
function focusStopTicking(){
  if(focusTimer) cancelAnimationFrame(focusTimer.raf);
}
// what to show on the minimized "Resume" button while the drawer's closed — a lighter-weight
// readout than focusUpdateDisplay() since it only ever touches that one button, never the
// drawer-only DOM. fraction is "how much of the current phase has elapsed" (0 → 1, growing),
// used to fill the button's progress bar; null means there's no fixed length to show progress
// against (an open-ended EMOM/uncapped FOR TIME), so the bar just stays empty.
function minimizedTimerReadout(){
  if(!focusTimer) return null;
  const elapsed = focusCurrentElapsed();
  const k = focusTimer.kind;
  const growing = (total)=> total>0 ? Math.max(0, Math.min(1, elapsed/total)) : 0;

  if(focusTimer.repeatKey){
    const w = state.currentWorkout;
    const done = (w && w.roundCounts && w.roundCounts[focusTimer.repeatKey]) || 0;
    const setNum = Math.min(done+1, focusTimer.repeatTotal);
    const total = focusTimer.minutes*60;
    const remain = Math.max(0, total-elapsed);
    return {text:`Set ${setNum} of ${focusTimer.repeatTotal} — resting ${fmtClock(remain)}`, fraction: growing(total)};
  }
  if((k==='AMRAP'||k==='COUNTDOWN') && !focusTimer.cycles){
    const total = focusTimer.minutes*60;
    return {text:`${fmtClock(Math.max(0,total-elapsed))} left`, fraction: growing(total)};
  }
  if(k==='AMRAP' && focusTimer.cycles){
    const workSec=focusTimer.minutes*60, restSec=(focusTimer.restMinutes||0)*60, cycleLen=workSec+restSec;
    const total = focusTimer.cycles*cycleLen - restSec;
    return {text:`${fmtClock(Math.max(0,total-elapsed))} left`, fraction: growing(total)};
  }
  if(k==='EMOM'){
    if(focusTimer.openEnded) return {text:`${fmtClock(elapsed)} elapsed`, fraction:null};
    const total = focusTimer.minutes*60;
    return {text:`${fmtClock(Math.max(0,total-elapsed))} left`, fraction: growing(total)};
  }
  if(k==='TABATA'){
    const total = tabataRoundSec(focusTimer)*focusTimer.rounds;
    return {text:`${fmtClock(Math.max(0,total-elapsed))} left`, fraction: growing(total)};
  }
  if(k==='INTERVAL'){
    if(focusTimer.totalRounds){
      const total = focusTimer.minutes*60*focusTimer.totalRounds;
      return {text:`${fmtClock(Math.max(0,total-elapsed))} left`, fraction: growing(total)};
    }
    return {text:`${fmtClock(elapsed)} elapsed`, fraction:null};
  }
  if(k==='FORTIME_REPEATS'){
    if(focusTimer.restUntil!=null){
      const remain = Math.max(0, focusTimer.restUntil-elapsed);
      return {text:`Resting ${fmtClock(remain)}`, fraction: focusTimer.restSeconds>0 ? 1-remain/focusTimer.restSeconds : 0};
    }
    return {text:`${fmtClock(elapsed)} elapsed`, fraction:null};
  }
  if((k==='RFT'||k==='LADDER'||k==='FORTIME') && focusTimer.cap){
    const total = focusTimer.cap*60;
    return {text:`${fmtClock(Math.max(0,total-elapsed))} left`, fraction: growing(total)};
  }
  return {text:`${fmtClock(elapsed)} elapsed`, fraction:null};
}
// paints the minimized "Resume" button's live label + progress fill. Cheap and safe to call every
// frame (from focusTick) or on any full-page render — it no-ops instantly when the drawer's open
// (the real drawer owns the display then) or when the button isn't even on screen right now.
function updateMinimizedProgress(){
  if(state.focusMode || !focusTimer) return;
  const fillEl = document.getElementById('gw-resume-fill');
  const labelEl = document.getElementById('gw-resume-label');
  if(!fillEl || !labelEl) return;
  const r = minimizedTimerReadout();
  if(!r) return;
  labelEl.textContent = r.text;
  fillEl.style.width = (r.fraction==null ? 0 : Math.round(r.fraction*100)) + '%';
}
// "3-2-1-go" lead-in before the very first start of a fresh timer — matches how a real class starts a clock
function focusStartWithLeadIn(){
  if(!focusTimer || focusTimer.running || focusTimer.leadIn) return;
  const freshStart = focusTimer.elapsedBefore===0 && !focusTimer.doneBeeped;
  if(!freshStart){ focusStart(); return; }
  focusTimer.leadIn = true;
  const myTimer = focusTimer;
  const numberEl = document.getElementById('gw-focus-number');
  const seq = ['3','2','1','GO'];
  let i = 0;
  function step(){
    if(focusTimer !== myTimer) return;
    if(numberEl) numberEl.textContent = seq[i];
    if(seq[i]==='GO') beepTriple(); else tickBeep();
    vibrate(seq[i]==='GO' ? [80,40,120] : 30);
    i++;
    if(i < seq.length){ setTimeout(step, 700); }
    else { setTimeout(()=>{ if(focusTimer===myTimer){ focusTimer.leadIn = false; focusStart(); } }, 500); }
  }
  step();
}
function focusToggleFromTap(){
  if(!focusTimer || focusTimer.leadIn) return;
  if(focusTimer.running) focusPause();
  else if(focusTimer.elapsedBefore > 0) focusStart();
  else focusStartWithLeadIn();
}
// jumps straight to the next TABATA phase boundary (work->rest or rest->work), tapped from the "Skip rest" link
// lets the athlete manually skip ahead to the next rest interval instead of waiting for it to elapse naturally
function focusSkipToNextRound(){
  if(!focusTimer || focusTimer.kind!=='INTERVAL') return;
  const cycle = focusTimer.minutes*60;
  const elapsed = focusCurrentElapsed();
  const currentUnit = Math.floor(elapsed/cycle);
  const nextBoundary = (currentUnit+1)*cycle;
  focusTimer.elapsedBefore = nextBoundary;
  focusTimer.startedAt = focusTimer.running ? performance.now() : null;
  focusUpdateDisplay();
  vibrate(20);
}
// ends a rest early: multi-interval AMRAP jumps to the start of the next interval, For Time Repeats starts the next round now
function focusSkipRest(){
  if(!focusTimer) return;
  const elapsed = focusCurrentElapsed();
  if(focusTimer.kind==='AMRAP' && focusTimer.cycles){
    const cycleLen = focusTimer.minutes*60 + (focusTimer.restMinutes||0)*60;
    focusTimer.elapsedBefore = (Math.floor(elapsed/cycleLen)+1)*cycleLen;
    focusTimer.startedAt = focusTimer.running ? performance.now() : null;
  } else if(focusTimer.kind==='FORTIME_REPEATS'){
    focusTimer.restUntil = null;
  } else return;
  focusUpdateDisplay();
  vibrate(20);
}
function focusStart(){
  if(!focusTimer || focusTimer.running) return;
  focusTimer.running = true;
  focusTimer.startedAt = performance.now();
  focusTimer.doneBeeped = false;
  cancelAnimationFrame(focusTimer.raf);
  focusTick();
  focusUpdateButtonStates();
  vibrate(25);
}
function focusPause(){
  if(!focusTimer || !focusTimer.running) return;
  focusTimer.elapsedBefore = focusCurrentElapsed();
  focusTimer.running = false;
  cancelAnimationFrame(focusTimer.raf);
  focusUpdateDisplay();
  focusUpdateButtonStates();
  vibrate(25);
}
function focusUpdateButtonStates(){
  if(!focusTimer) return;
  const playPauseBtn = document.getElementById('gw-floatcard-playpause');
  if(!playPauseBtn || focusTimer.leadIn) return;
  playPauseBtn.innerHTML = focusTimer.running ? ICON_PAUSE : ICON_PLAY;
  playPauseBtn.classList.toggle('is-running', !!focusTimer.running);
  // once the timer is done there's nothing left to play/pause — say so, plainly, wherever the round button is
  playPauseBtn.disabled = focusTimer.doneBeeped;
  const roundBtn = document.getElementById('gw-focus-plus');
  if(roundBtn && focusTimer.doneBeeped) roundBtn.disabled = true;
  const skipBtn = document.getElementById('gw-focus-skipnext');
  if(skipBtn && focusTimer.doneBeeped) skipBtn.disabled = true;
  const holdBtn = document.getElementById('gw-focus-hold');
  if(holdBtn && focusTimer.doneBeeped) holdBtn.disabled = true;
}
function focusUpdateDisplay(){
  if(!focusTimer || focusTimer.leadIn) return;
  const numberEl = document.getElementById('gw-focus-number');
  const subEl = document.getElementById('gw-focus-sub');
  const phaseEl = document.getElementById('gw-focus-phase');
  const secondaryEl = document.getElementById('gw-focus-secondary');
  if(!numberEl) return;
  const elapsed = focusCurrentElapsed();
  let displaySeconds = 0, warn = false, isRest = false, phaseWordUsed = false, secondaryUsed = false, restSkippable = false;

  if(focusTimer.kind==='AMRAP' && focusTimer.cycles){
    const workSec = focusTimer.minutes*60, restSec = (focusTimer.restMinutes||0)*60, cycleLen = workSec+restSec;
    const totalDuration = focusTimer.cycles*cycleLen - restSec;
    const clamped = Math.min(elapsed, totalDuration);
    const cycleIdx = Math.min(Math.floor(clamped/cycleLen), focusTimer.cycles-1);
    const withinCycle = clamped - cycleIdx*cycleLen;
    isRest = withinCycle >= workSec;
    const phaseSecTotal = isRest ? restSec : workSec;
    const phaseElapsed = isRest ? withinCycle-workSec : withinCycle;
    displaySeconds = phaseSecTotal - phaseElapsed;
    const phaseKey = cycleIdx+'-'+(isRest?'rest':'work');
    if(phaseKey !== focusTimer.lastPhaseKey && focusTimer.running){ switchBeep(); focusTimer.lastPhaseKey = phaseKey; }
    phaseEl.textContent = isRest ? 'REST' : 'AMRAP';
    phaseWordUsed = true;
    restSkippable = isRest;
    phaseEl.classList.toggle('rest', isRest);
    subEl.textContent = `Interval ${cycleIdx+1} of ${focusTimer.cycles}`;
    if(elapsed >= totalDuration){ warn=true; focusFinish(); displaySeconds=0; }
    else if(displaySeconds<=3) warn=true;
    focusMaybeTick(displaySeconds);

  } else if(focusTimer.kind==='AMRAP' || focusTimer.kind==='COUNTDOWN'){
    const total = focusTimer.minutes*60;
    displaySeconds = total - elapsed;
    if(focusTimer.kind==='AMRAP' && !focusTimer.halfwayBeeped && elapsed >= total/2 && focusTimer.running){
      focusTimer.halfwayBeeped = true; switchBeep(); vibrate(40);
    }
    if(displaySeconds<=0){ displaySeconds=0; warn=true; focusFinish(); }
    else { if(displaySeconds<=10) warn=true; focusMaybeTick(displaySeconds); }
    if(focusTimer.kind==='AMRAP'){
      subEl.textContent = focusTimer.mode==='ascending'
        ? `Next round: ${focusTimer.startReps + state.focusTapCount*focusTimer.increment} reps`
        : '';
    } else if(focusTimer.repeatKey){
      const w = state.currentWorkout;
      const done = (w && w.roundCounts && w.roundCounts[focusTimer.repeatKey]) || 0;
      phaseEl.textContent = 'REST'; phaseEl.classList.add('rest'); phaseWordUsed = true;
      subEl.textContent = `Set ${Math.min(done+1, focusTimer.repeatTotal)} of ${focusTimer.repeatTotal}`;
    } else {
      subEl.textContent = '';
    }

  } else if(focusTimer.kind==='EMOM'){
    const total = focusTimer.openEnded ? null : focusTimer.minutes*60;
    const clamped = total!=null ? Math.min(elapsed, total) : elapsed;
    const unit = Math.floor(clamped/60);
    const withinMinute = clamped - unit*60;
    displaySeconds = 60 - withinMinute;
    if(focusTimer.alternate){
      const which = unit % 2;
      subEl.textContent = `Minute ${unit+1}${total!=null?` of ${focusTimer.minutes}`:''}`;
      paintNowNext(focusTimer.alternate[which], (total!=null && unit+1>=focusTimer.minutes) ? 'Done' : focusTimer.alternate[1-which], false);
    } else if(!focusTimer.openEnded && state.focusExercises.length){
      // one exercise (or a short list) every minute — name it, with its reps underneath
      const exs = state.focusExercises;
      paintNowNext(exs.map(e=>e.name).join(' + '), '', false, exs.map(e=>e.qty).filter(Boolean).join(' · '));
    } else if(focusTimer.openEnded){
      subEl.textContent = `Minute ${unit+1}` + (state.focusExercises.length ? ` · ${state.focusExercises.map(e=>e.name).join(' + ')}` : '');
    } else {
      subEl.textContent = `Minute ${Math.min(unit+1, focusTimer.minutes)} of ${focusTimer.minutes}`;
    }
    if(secondaryEl && total==null){ secondaryEl.textContent = `${fmtClock(elapsed)} total`; secondaryUsed = true; }
    const unitCap = total!=null ? focusTimer.minutes : Infinity;
    if(unit > focusTimer.lastBeepUnit && unit < unitCap && focusTimer.running){ switchBeep(); vibrate([60,40,60]); focusTimer.lastBeepUnit = unit; }
    if(total!=null && elapsed >= total){ warn=true; focusFinish(); displaySeconds=0; }
    else { if(displaySeconds<=3) warn=true; focusMaybeTick(displaySeconds); }

  } else if(focusTimer.kind==='INTERVAL'){
    const cycle = focusTimer.minutes*60;
    if(focusTimer.totalRounds){
      const totalDuration = cycle*focusTimer.totalRounds;
      const clamped = Math.min(elapsed, totalDuration);
      const unit = Math.floor(clamped/cycle);
      const withinUnit = clamped - unit*cycle;
      displaySeconds = cycle - withinUnit;
      // this branch is only ever reached by the continuous "For X Cycles" interval clock — the
      // genuinely rest-based paced sets run through the separate COUNTDOWN/repeatKey engine below
      // — so this is never a rest period, just the current lift's working interval
      subEl.textContent = `Set ${Math.min(unit+1, focusTimer.totalRounds)} of ${focusTimer.totalRounds}`;
      if(unit > focusTimer.lastBeepUnit && unit < focusTimer.totalRounds && focusTimer.running){ switchBeep(); focusTimer.lastBeepUnit = unit; }
      if(elapsed >= totalDuration){ warn=true; focusFinish(); displaySeconds=0; }
      else if(displaySeconds<=3) warn=true;
      focusMaybeTick(displaySeconds);
    } else {
      const unit = Math.floor(elapsed/cycle);
      const withinUnit = elapsed - unit*cycle;
      displaySeconds = cycle - withinUnit;
      subEl.textContent = `Round ${unit+1}`;
      if(unit > focusTimer.lastBeepUnit && focusTimer.running){ switchBeep(); focusTimer.lastBeepUnit = unit; }
      if(displaySeconds<=3) warn=true;
      focusMaybeTick(displaySeconds);
    }

  } else if(focusTimer.kind==='TABATA'){
    const cycle = tabataRoundSec(focusTimer);
    const totalDuration = cycle*focusTimer.rounds;
    const clamped = Math.min(elapsed, totalDuration);
    const roundIdx = Math.min(Math.floor(clamped/cycle), focusTimer.rounds-1);
    const withinCycle = clamped - roundIdx*cycle;
    let phaseSecTotal, phaseElapsed, phaseId, phaseWord;
    if(focusTimer.phases){
      let acc = 0, pi = 0;
      for(; pi<focusTimer.phases.length-1; pi++){
        if(withinCycle < acc + focusTimer.phases[pi].sec) break;
        acc += focusTimer.phases[pi].sec;
      }
      const ph = focusTimer.phases[pi];
      isRest = !!ph.rest; phaseSecTotal = ph.sec; phaseElapsed = withinCycle - acc;
      phaseId = pi; phaseWord = ph.label.toUpperCase();
    } else {
      isRest = withinCycle >= focusTimer.workSec;
      phaseSecTotal = isRest ? focusTimer.restSec : focusTimer.workSec;
      phaseElapsed = isRest ? withinCycle - focusTimer.workSec : withinCycle;
      phaseId = isRest ? 'rest' : 'work';
      phaseWord = isRest ? 'REST' : (focusTimer.alternate ? focusTimer.alternate[roundIdx % 2] : 'WORK');
    }
    displaySeconds = phaseSecTotal - phaseElapsed;
    const phaseKey = roundIdx+'-'+phaseId;
    if(phaseKey !== focusTimer.lastPhaseKey && focusTimer.running){ switchBeep(); focusTimer.lastPhaseKey = phaseKey; }
    subEl.textContent = `Round ${roundIdx+1} of ${focusTimer.rounds}`;
    // what's being done now and what comes next — on the left, where the round counter would sit
    const lastRound = roundIdx+1 >= focusTimer.rounds;
    const plainName = (!focusTimer.phases && !focusTimer.alternate && state.focusExercises.length===1) ? state.focusExercises[0].name : 'Work';
    const nextWord = focusTimer.phases
      ? (focusTimer.phases[phaseId+1] ? focusTimer.phases[phaseId+1].label : (lastRound ? 'Done' : focusTimer.phases[0].label))
      : (isRest ? (lastRound ? 'Done' : (focusTimer.alternate ? focusTimer.alternate[(roundIdx+1)%2] : plainName)) : 'Rest');
    paintNowNext(focusTimer.phases ? focusTimer.phases[phaseId].label : (isRest ? 'Rest' : (focusTimer.alternate ? focusTimer.alternate[roundIdx%2] : plainName)), nextWord, isRest);
    if(elapsed >= totalDuration){ warn=true; focusFinish(); displaySeconds=0; }
    else if(displaySeconds<=3) warn=true;
    focusMaybeTick(displaySeconds);

  } else if(focusTimer.kind==='LADDER'){
    displaySeconds = elapsed;
    if(focusTimer.cap && elapsed >= focusTimer.cap*60){ warn = true; focusFinish(); }
    const rungs = focusTimer.rungs;
    const roundIdx = Math.min(state.focusTapCount, rungs.length-1);
    subEl.textContent = state.focusTapCount >= rungs.length
      ? 'All rounds done'
      : `${rungs[roundIdx]} reps this round`;
  } else { // FORTIME / RFT / FORTIME_REPEATS / stopwatch
    displaySeconds = elapsed;
    if(focusTimer.cap && elapsed >= focusTimer.cap*60){ warn = true; focusFinish(); }
    if(focusTimer.kind==='FORTIME_REPEATS'){
      const resting = focusTimer.restUntil && elapsed < focusTimer.restUntil;
      restSkippable = !!resting;
      phaseEl.textContent = resting ? 'REST' : 'GO';
      phaseEl.classList.toggle('rest', !!resting);
      phaseWordUsed = true;
      if(resting && secondaryEl){ secondaryEl.textContent = `Next round in ${fmtClock(focusTimer.restUntil-elapsed)}`; secondaryUsed = true; }
      if(resting && focusTimer.running && Math.ceil(focusTimer.restUntil-elapsed)<=3) focusMaybeTick(focusTimer.restUntil-elapsed);
      subEl.textContent = `Round ${Math.min(state.focusTapCount+1, focusTimer.rounds)} of ${focusTimer.rounds}`;
    } else {
      subEl.textContent = focusTimer.cap ? `Time cap ${focusTimer.cap} min` : '';
    }
  }

  function paintNowNext(now, next, resting, nowSub){
    const nowEl = document.getElementById('gw-nn-now'), nextEl = document.getElementById('gw-nn-next');
    if(!nowEl || !nextEl) return;
    nowEl.textContent = now; nextEl.textContent = next;
    nowEl.classList.toggle('rest', !!resting);
    const subEl2 = document.getElementById('gw-nn-nowsub');
    if(subEl2){ subEl2.textContent = nowSub || ''; subEl2.style.display = nowSub ? '' : 'none'; }
    const nextBlock = document.getElementById('gw-nn-nextblock');
    if(nextBlock) nextBlock.style.display = next ? '' : 'none';
  }
  // during a rest the round circle gives way to a Skip circle (Tabata is a fixed rhythm — no skipping there)
  if(focusTimer.kind==='FORTIME_REPEATS' || (focusTimer.kind==='AMRAP' && focusTimer.cycles)){
    const showSkip = restSkippable && !focusTimer.doneBeeped;
    const roundCircle = document.getElementById('gw-focus-plus'), skipSlot = document.getElementById('gw-floatcard-next');
    if(roundCircle) roundCircle.style.display = showSkip ? 'none' : '';
    if(skipSlot){
      skipSlot.style.display = showSkip ? '' : 'none';
      const skipBtn = document.getElementById('gw-focus-skipnext');
      if(skipBtn && !skipBtn.dataset.skipLabel){ skipBtn.innerHTML = `${ICON_SKIP}<span>Skip</span>`; skipBtn.dataset.skipLabel = '1'; }
    }
  }
  if(secondaryEl && !secondaryUsed) secondaryEl.textContent = '';
  if(phaseEl && !phaseWordUsed) phaseEl.textContent = '';
  numberEl.textContent = fmtClock(displaySeconds);
  numberEl.classList.toggle('warn', warn);

  // once finished, locking the round / finish controls prevents mis-taps from changing a score that's
  // already locked in. Paced-rest is the one exception that stays tappable throughout — mid-rest
  // the same button doubles as "Skip Rest", so disabling it would take away the skip.
  const plusBtn = document.getElementById('gw-focus-plus');
  if(plusBtn) plusBtn.disabled = focusTimer.doneBeeped;
  const holdBtn = document.getElementById('gw-focus-hold');
  if(holdBtn) holdBtn.disabled = focusTimer.doneBeeped;
  updateFocusCloseButton();

  // the finish message lives in the drawer itself — it holds here for a beat (see
  // focusAutoCloseAndRate) before the drawer closes on its own to reveal the completed section
  if(focusTimer.doneBeeped){
    const nn = document.getElementById('gw-nownext');
    if(nn) nn.style.display = 'none';
    phaseEl.textContent = 'COMPLETED';
    phaseEl.classList.remove('rest');
    subEl.textContent = '';
    if(secondaryEl) secondaryEl.textContent = '';
    numberEl.classList.remove('warn');
  }
}

// ---- section text -> a headline plus one row per exercise ----
// Workout text is authored as plain lines ("10 walking lunges each leg"); a card shows each exercise
// on its own line, name first with the quantity underneath, the same way the WOD card does.
const SECTION_CATEGORY_RE = /^(ACCESSORY SUPERSET|OLYMPIC LIFTING|EXPLOSIVE POWER|STRENGTH|GYMNASTIC|ACCESSORY|ENDURANCE)\b\s*(.*)$/;
const NAME_FIXES = [[/\bKb\b/g,'KB'], [/\bOhs\b/g,'OHS'], [/\bW-Bar\b/g,'W-bar'], [/\bV-Ups\b/g,'V-ups'], [/\bPvc\b/g,'PVC'],
  [/ (To|Or|And|Of|Per) /g, m=>m.toLowerCase()]];
function niceName(str){
  let t = str.trim();
  const parens = [];
  t = t.replace(/\([^)]*\)/g, ph=>{ parens.push(ph); return `\u0001${parens.length-1}\u0001`; });
  if(t === t.toUpperCase() && /[A-Z]/.test(t)) t = t.toLowerCase();
  t = t.replace(/(^|[\s\/+-])([a-z])/g, (m,pre,c)=>pre+c.toUpperCase());
  NAME_FIXES.forEach(([re,rep])=>{ t = t.replace(re, rep); });
  return t.replace(/\u0001(\d+)\u0001/g, (m,i)=>parens[i]).trim();
}
const EACH_RE = /\b(each (?:leg|side|arm|way|hand))\b/i;
function qtyWord(num, mark){ return mark==='"' ? `${num} sec` : (mark==="'" ? `${num} min` : `${num} ${String(num)==='1' ? 'rep' : 'reps'}`); }
// one authored line -> zero or more items: {kind:'exercise'|'scheme'|'every'|'rest', raw, name, qty, paren}
function parseSectionLine(line){
  let s = line.trim();
  if(!s) return [];
  let tag = '';
  const oe = s.match(/^(Odd|Even):\s*(.*)$/i);
  if(oe){ tag = oe[1].toLowerCase()==='odd' ? 'odd minutes' : 'even minutes'; s = oe[2]; }
  s = s.replace(/^(?:Each|Every) minute:\s*/i, '').replace(/^\d+-\s+/, '').replace(/\s+every minute$/i, '');

  // "5 x 5", "5 sets x 8-10 (strict or banded)", "5 x 10 lunges each leg"
  let m = s.match(/^(\d+)\s*(?:sets?\s*)?[x×]\s*(\d+(?:-\d+)?)\s*(.*)$/i);
  if(m){
    const tail = m[3];
    const each = (tail.match(EACH_RE) || [])[1] || '';
    const paren = (tail.match(/\(([^)]*)\)/) || [])[1] || '';
    const nameText = tail.replace(/\([^)]*\)/g,'').replace(EACH_RE,'').trim();
    const qty = `${m[1]} × ${m[2]}${each ? ' '+each : ''}`;
    if(nameText) return [{kind:'exercise', raw:s, name:niceName(nameText + (paren ? ` (${paren})` : '')), qty}];
    return [{kind:'scheme', raw:s, qty, paren}];
  }
  // a bare rep ladder: "5-5-3-3-2-2"
  if(/^\d+(?:-\d+){1,}$/.test(s)) return [{kind:'scheme', raw:s, qty:s + ' reps', paren:''}];
  // "5 sets:" on its own is just a count (the explainer says it); "5 sets: 100 single unders + …" has content
  m = s.match(/^\d+\s*sets?\b([^:]*)(?::\s*(.*))?$/i);
  if(m){ if(!m[2]) return []; s = m[2]; }
  if(/^every\s+\d/i.test(s)) return [{kind:'every', raw:s, name:s, qty:''}];
  m = s.match(/^rest\s+(\d+)(["'])?\s*(.*)$/i);
  if(m) return [{kind:'rest', raw:s, name:'Rest', qty:`${qtyWord(m[1], m[2]||'"').replace(' reps',' sec')}${m[3] ? ' '+m[3] : ''}`}];

  const parts = /[()]/.test(s) ? [s] : s.split(/\s\+\s/);
  return parts.map(part=>{
    const nm = part.trim().match(/^(\d+(?:\/\d+)?(?:-\d+)?)(["'])?\s+(.+)$/);
    if(nm && /^rest$/i.test(nm[3].trim())) return {kind:'rest', raw:part, name:'Rest', qty:qtyWord(nm[1], nm[2]||'"')};
    if(!nm) return {kind:'exercise', raw:part, name:niceName(part.replace(/:$/,'')), qty:tag};
    const each = (nm[3].match(EACH_RE) || [])[1] || '';
    const name = niceName(nm[3].replace(EACH_RE,'').replace(/\s+/g,' '));
    const qty = qtyWord(nm[1], nm[2]) + (each ? ' '+each : '') + (tag ? ` · ${tag}` : '');
    return {kind:'exercise', raw:part, name, qty};
  });
}
function parseSectionText(body){
  const lines = body.split('\n').map(l=>l.trim()).filter(Boolean);
  const first = lines.shift() || '';
  let headline = '', m, dashRow = false;
  if((m = first.match(/^(\d+)\s*X\b\s*(\(.*\))?:?$/i))) headline = `${m[1]} rounds${m[2] ? ' '+m[2] : ''}`;
  else if((m = first.match(/^(\d+)\s*rds?\b/i))) headline = `${m[1]} rounds`;
  else if(/^(Tabata|EMOM|AMRAP)\b/i.test(first)) headline = first.replace(/:$/,'');
  else if((m = first.match(SECTION_CATEGORY_RE))){
    const remainder = m[2].replace(/:$/,'').trim();
    if(m[1]==='ACCESSORY SUPERSET') headline = 'Superset';
    else {
      const dash = remainder.match(/^-\s*(.+)$/);
      if(dash){
        if(/^complex\b/i.test(dash[1])) headline = niceName(dash[1]);
        else { lines.unshift(dash[1]); dashRow = true; }
      }
      // anything else after the category ("(KB)", "(bodyweight)", "(W-bar + KB)") is equipment the
      // exercise lines already make obvious
    }
  } else lines.unshift(first);
  if(!headline && lines.length && /^(EMOM|AMRAP|Tabata)\b/i.test(lines[0])) headline = lines.shift().replace(/:$/,'');
  const items = [];
  lines.forEach(l=>parseSectionLine(l).forEach(it=>items.push(it)));
  // "OLYMPIC LIFTING - SNATCH" followed by its own list of movements names the group; followed by a
  // set scheme ("6 sets x 3") it IS the movement
  if(dashRow && items.length > 1 && items[1].kind==='exercise'){ headline = items[0].name; items.shift(); }
  return {headline, items};
}

// a numeric slot keeps the number face only while it actually holds a number
function numCls(v){ return /\d/.test(String(v==null ? '' : v)) ? '' : ' gw-txt'; }
// tapping an exercise line opens its how-to; the row's own name wins, the full text of its line is the
// fallback, and the most specific (longest) known movement is the one shown
// generic row names (a bare "Lunges", a "Clean" skill header) that no single exercise key matches by text
const INFO_ROW_ALIASES = [
  [/^lunges?\b/i, 'Walking Lunges'], [/^pistol progressions?\b/i, 'Pistol Squat Progression'],
  [/^clean$/i, 'Power Clean'], [/^snatch$/i, 'Power Snatch'], [/^pull-up progression$/i, 'Strict Pull-Ups']
];
function infoKeyFor(name, raw){
  const best = list=>list.sort((a,b)=>b.length-a.length)[0] || null;
  const found = best(findKnownMovements(name || '')) || best(findKnownMovements(raw || ''));
  if(found) return found;
  const nm = String(name || '').trim();
  if(INFO_GENERIC.has(nm) && EXERCISE_INFO[nm]) return nm;
  const hit = INFO_ROW_ALIASES.find(([re, key])=>re.test(nm) && EXERCISE_INFO[key]);
  return hit ? hit[1] : null;
}
function makeRowTappable(row, key){
  if(!key) return;
  row.classList.add('gw-movement-tappable');
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.setAttribute('aria-label', `${key} — how to`);
  const open = ()=>showModal(key, EXERCISE_INFO[key].desc, EXERCISE_INFO[key].url);
  row.onclick = (e)=>{ if(e.target.closest('input')) return; open(); };
  row.onkeydown = (e)=>{ if((e.key==='Enter' || e.key===' ') && !e.target.closest('input')){ e.preventDefault(); open(); } };
}

// ---- section layout: the section's name sits OUTSIDE the card as a title with a check-off circle in
// front of it; the card holds only the workout itself, then the start button, then a refresh button
// for just that section ----
function radioBtn(isDone, onToggle, name){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gw-radio' + (isDone ? ' is-done' : '');
  btn.setAttribute('role', 'checkbox');
  btn.setAttribute('aria-checked', isDone ? 'true' : 'false');
  btn.setAttribute('aria-label', `${name} done`);
  btn.title = isDone ? 'Mark not done' : 'Mark as done';
  btn.innerHTML = ICON_CHECK;
  btn.onclick = onToggle;
  return btn;
}
function sectionShell(title, isDone, onDone, onReroll){
  const wrap = document.createElement('div');
  wrap.className = 'gw-section' + (isDone ? ' gw-section-done' : '');
  const titleRow = document.createElement('div');
  titleRow.className = 'gw-section-titlerow';
  if(onDone) titleRow.appendChild(radioBtn(isDone, onDone, title));
  const t = document.createElement('span');
  t.className = 'gw-section-title';
  t.textContent = title;
  titleRow.appendChild(t);
  wrap.appendChild(titleRow);
  const card = document.createElement('div');
  card.className = 'gw-section-card';
  const bodyEl = document.createElement('div');
  bodyEl.className = 'gw-section-body';
  card.appendChild(bodyEl);
  wrap.appendChild(card);
  wrap.bodyEl = bodyEl;
  wrap.onReroll = onReroll || null;
  wrap.sectionTitle = title;
  return wrap;
}
function appendSectionRefresh(node){
  if(!node.onReroll) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gw-inline-link gw-section-suggest';
  btn.textContent = `Suggest new ${{'Extra Core':'Core','Extra Accessory':'Accessory','Cool-Down Mobility':'Mobility'}[node.sectionTitle] || node.sectionTitle}`;
  btn.onclick = node.onReroll;
  node.bodyEl.appendChild(btn);
}
// one exercise: name on top, quantity underneath; a loaded movement's weight sits at the right edge
function exerciseRow(item, loadItem, onLoadChange, loadIdx){
  const row = document.createElement('div');
  row.className = 'gw-movement-row';
  const main = document.createElement('div');
  main.className = 'gw-movement-main';
  const nameEl = document.createElement('span');
  nameEl.className = 'gw-movement-name';
  nameEl.textContent = item.name;
  main.appendChild(nameEl);
  if(item.qty){
    const qtyEl = document.createElement('span');
    qtyEl.className = 'gw-movement-reps';
    qtyEl.textContent = item.qty;
    main.appendChild(qtyEl);
  }
  row.appendChild(main);
  makeRowTappable(row, infoKeyFor(item.name, item.raw));
  if(loadItem){
    const weightWrap = document.createElement('span');
    weightWrap.className = 'gw-setlist-weight';
    const input = document.createElement('input');
    input.type = 'number'; input.step = '5'; input.value = loadItem.load;
    input.setAttribute('aria-label', `${item.name} weight in pounds`);
    input.onchange = ()=>{ const val = Number(input.value)||0; input.value = val; onLoadChange && onLoadChange(loadIdx, val); };
    weightWrap.appendChild(input);
    const unit = document.createElement('span');
    unit.textContent = 'lb';
    weightWrap.appendChild(unit);
    row.appendChild(weightWrap);
  }
  return row;
}

function sectionWithChips(title, body, tag, opts){
  opts = opts || {};
  const wrap = sectionShell(title, !!opts.isDone, opts.onDone, opts.onReroll);
  const bodyEl = wrap.bodyEl;

  const timerSpecForExplainer = opts.timerSpec || parseTimerFromText(body);
  const hasSetRows = !!(opts.setsList && opts.setsList.length && !(opts.setsList.every(r=>r===null) && !opts.setsWeights));
  const parsed = parseSectionText(body);
  const items = parsed.items;

  let explainerText = timerExplainer(timerSpecForExplainer);
  // every card leads with a title: the workout type (EMOM, Tabata, Every 2 min…) or the number of
  // rounds. When the text didn't supply one, it comes from the timer; the explainer then only says
  // what the title doesn't
  const sp = timerSpecForExplainer;
  let headline = parsed.headline;
  const everyItem = parsed.items.find(it=>it.kind==='every');
  // an interval skill leads with its set count ("5 Sets"); the cadence ("Every 2 minutes:") is the
  // supporting line under it. A group name ("Complex (main bar)", "Snatch", "Superset") that used to be
  // the title becomes the first exercise line instead
  if(sp && sp.kind==='EMOM' && sp.openEnded) headline = (sp.amrap || /AMRAP/i.test(body)) ? 'EMOM + AMRAP' : 'EMOM';
  const groupRows = [];
  const setsTitle = n=>`${n} ${n===1 ? 'Set' : 'Sets'}`;
  if(sp && sp.kind==='INTERVAL' && sp.totalRounds && !(headline && /^\s*(\d+\s*rounds?|tabata|emom|amrap|for time|countdown)/i.test(headline))){
    const paced = sp.label==='X Rest Between Sets';
    if(headline && !/^every\b/i.test(headline)){
      groupRows.push({name:headline, qty:'', raw:headline});
      if(headline==='Superset') groupRows.pop();
    }
    headline = setsTitle(sp.totalRounds);
    explainerText = paced ? 'Rest between sets.' : `Every ${everyPhrase(sp.minutes)}:`;
  } else if(!headline){
    if(sp && sp.kind==='INTERVAL'){
      const paced = sp.label==='X Rest Between Sets';
      headline = paced ? 'Rest between sets' : `Every ${everyPhrase(sp.minutes)}`;
      explainerText = '';
    }
    else if(sp && sp.kind==='COUNTDOWN') headline = `Countdown · ${fmtMinutesShort(sp.minutes)}`;
    else if(sp && sp.kind==='TABATA') headline = `Tabata · ${sp.rounds} Rounds`;
    else if(everyItem) headline = everyItem.name;
    else { const rt = parseRoundTarget(body); headline = `${rt} ${rt===1 ? 'Round' : 'Rounds'}`; }
  }

  if(headline) headline = headline.replace(/(\d+\s+)(rounds?|sets?)\b/gi, (m, n, w)=>n + w[0].toUpperCase() + w.slice(1).toLowerCase());
  if(headline || tag){
    const headlineRow = document.createElement('div');
    headlineRow.className = 'gw-headline-row';
    if(headline){
      const headEl = document.createElement('div');
      headEl.className = 'gw-section-headline';
      headEl.textContent = headline;
      headlineRow.appendChild(headEl);
    }
    if(tag){
      const tagEl = document.createElement('span');
      tagEl.className = 'gw-tag';
      tagEl.textContent = tag;
      headlineRow.appendChild(tagEl);
    }
    bodyEl.appendChild(headlineRow);
  }
  if(explainerText){
    const explainEl = document.createElement('div');
    explainEl.className = 'gw-format-explainer';
    explainEl.textContent = explainerText;
    bodyEl.appendChild(explainEl);
  }

  // drop what's already said elsewhere on the card: "Every 2 min" lives in the explainer, a "Rest 1'"
  // line lives in the timer, and a bare "5 x 5" scheme is the set rows themselves
  const rows = groupRows.slice();
  items.forEach(it=>{
    if(it.kind==='every'){ if(!/every/i.test((explainerText || '') + ' ' + headline) && it !== everyItem) rows.push({name:it.name, qty:'', raw:it.raw}); return; }
    if(it.kind==='rest'){ if(!timerSpecForExplainer) rows.push({name:it.name, qty:it.qty, raw:it.raw}); return; }
    if(it.kind==='scheme'){
      const prev = rows[rows.length-1];
      if(prev){
        if(it.paren) prev.name += ` (${it.paren})`;
        if(!hasSetRows && !prev.qty) prev.qty = it.qty;
      } else if(!hasSetRows) rows.push({name:'', qty:it.qty, raw:it.raw});
      return;
    }
    rows.push({name:it.name, qty:it.qty, raw:it.raw});
  });
  const loads = opts.loads || [];
  const usedLoads = new Set();
  // reps are prescribed, not editable — each set's line reads like every other exercise line. A skill with
  // one exercise repeats that exercise's name on every set row (reps underneath, weight at the right)
  const repsShown = hasSetRows && opts.setsList.some(r=>r!==null);
  let setName = null, setRaw = '';
  if(repsShown && rows.length===1){
    const r0 = rows[0];
    const hasLoad = loads.some(l=>{ const def = SKILL_LOAD_DEFS.find(d=>d.key===l.key); return def && def.re.test(r0.raw); });
    if(!hasLoad){ setName = r0.name; setRaw = r0.raw; rows.length = 0; }
  }
  if(rows.length || loads.length){
    const listEl = document.createElement('div');
    listEl.className = 'gw-movement-list';
    rows.forEach(r=>{
      const li = loads.findIndex((l, i)=>{ const def = SKILL_LOAD_DEFS.find(d=>d.key===l.key); return !usedLoads.has(i) && def && def.re.test(r.raw); });
      if(li >= 0) usedLoads.add(li);
      listEl.appendChild(exerciseRow(r, li >= 0 ? loads[li] : null, opts.onLoadChange, li));
    });
    loads.forEach((l, i)=>{ if(!usedLoads.has(i)) listEl.appendChild(exerciseRow({name:l.label, qty:''}, l, opts.onLoadChange, i)); });
    bodyEl.appendChild(listEl);
  }

  if(opts.setsList && opts.setsList.length){
    const listWrap = document.createElement('div');
    listWrap.className = 'gw-movement-list gw-setlist';
    const weightInputs = [];
    // rows exist to show each set's reps / edit its weight — a block workout (several movements per set,
    // each with its own rep count in the text) with no tracked lift has neither, so a column of empty
    // "Set 1 / Set 2 / …" lines would just be noise; only the add/remove-set links remain
    const showRows = !(opts.setsList.every(r=>r===null) && !opts.setsWeights);
    // for a paced-rest skill, each set row shows done/not — checked off as its rest completes
    // (see advancePacedRestRound()), not editable at that point since the set's already logged
    (showRows ? opts.setsList : []).forEach((reps, idx)=>{
      const isDone = opts.doneCount && idx < opts.doneCount;
      const row = document.createElement('div');
      row.className = 'gw-movement-row' + (isDone ? ' gw-setlist-row-done' : '');
      const main = document.createElement('div');
      main.className = 'gw-movement-main';
      const nameEl = document.createElement('span');
      nameEl.className = 'gw-movement-name';
      nameEl.textContent = (setName && reps !== null) ? setName : `Set ${idx+1}`;
      main.appendChild(nameEl);
      if(reps !== null){
        const qtyEl = document.createElement('span');
        qtyEl.className = 'gw-movement-reps';
        qtyEl.textContent = `${setName ? `Set ${idx+1} · ` : ''}${qtyWord(reps)}`;
        main.appendChild(qtyEl);
      }
      row.appendChild(main);
      if(setName && reps !== null) makeRowTappable(row, infoKeyFor(setName, setRaw));
      if(isDone){
        const badge = document.createElement('span');
        badge.className = 'gw-setlist-done-badge';
        badge.innerHTML = ICON_CHECK;
        row.appendChild(badge);
      }
      if(opts.setsWeights){
        const weightWrap = document.createElement('span');
        weightWrap.className = 'gw-setlist-weight';
        const input = document.createElement('input');
        input.type = 'number'; input.step = '5'; input.value = opts.setsWeights[idx] ?? 0;
        input.setAttribute('aria-label', `Set ${idx+1} weight in pounds`);
        weightInputs.push(input);
        // editing a set's weight fills forward into every later set (not the ones before it) —
        // a natural "ramp to this weight and hold" workflow you can still override set by set
        input.onchange = ()=>{
          const val = Number(input.value)||0;
          for(let i=idx; i<weightInputs.length; i++) weightInputs[i].value = val;
          opts.onWeightChange && opts.onWeightChange(idx, val);
        };
        weightWrap.appendChild(input);
        const unit = document.createElement('span');
        unit.textContent = 'lb';
        weightWrap.appendChild(unit);
        row.appendChild(weightWrap);
      }
      listWrap.appendChild(row);
    });
    if(showRows) bodyEl.appendChild(listWrap);
    if(opts.onSetsDelta){
      const links = document.createElement('div');
      links.className = 'gw-setlist-links';
      const addBtn = document.createElement('button');
      addBtn.type = 'button'; addBtn.className = 'gw-inline-link'; addBtn.textContent = '+ Add set';
      addBtn.onclick = ()=>opts.onSetsDelta(1);
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button'; removeBtn.className = 'gw-inline-link'; removeBtn.textContent = '− Remove set';
      removeBtn.disabled = opts.setsList.length<=1;
      removeBtn.onclick = ()=>opts.onSetsDelta(-1);
      links.appendChild(addBtn); links.appendChild(removeBtn);
      bodyEl.appendChild(links);
    }
  }

  wrap.finalize = ()=>{};
  return wrap;
}

  w.wodText = buildWodText(w.format, w.wodMovements);

  const wrap = sectionShell('WOD', isDone, ()=>toggleSectionDone(w, 'wod'), w.isBenchmark ? null : ()=>rerollSection('wod'));

    main.appendChild(nameEl); main.appendChild(repsEl);

  });

function rerollSection(section){
  const w = state.currentWorkout;
  if(!w) return;
  const bw = w.bw;
  if(focusTimer && focusTimer.sectionKey===section) closeTimerDrawer();
  if(w.roundCounts) w.roundCounts[section] = 0;
  if(w.sectionsDone) w.sectionsDone[section] = false;
  if(section==='warmup'){
    const pool = warmupPoolFor(w.type);
    let choice = w.warmup;
    if(pool.length>1){ do{ choice = pool[Math.floor(Math.random()*pool.length)]; } while(choice===w.warmup); }
    w.warmup = choice;
  } else if(section==='skill'){
    const skillPool = skillPoolFor(w.type);
    let choiceTpl = skillPool.find(s=>s.text===w.skillTplText) || skillPool[0];
    if(skillPool.length>1){ do{ choiceTpl = skillPool[Math.floor(Math.random()*skillPool.length)]; } while(choiceTpl.text===w.skillTplText); }
    w.skillTplText = choiceTpl.text;
    w.skillTimer = choiceTpl.timer || null;
    w.skillLiftKey = (!bw && choiceTpl.liftKey) ? choiceTpl.liftKey : null;
    w.skillSetReps = buildSkillSetReps(w.skillTplText, w.skillTimer, !!w.skillLiftKey);
    if(w.skillLiftKey){
      const result = computeSuggestedLoad(w.skillLiftKey);
      w.suggestedLoad = fitToPlates(result.load); w.deload = result.deload;
    } else { w.suggestedLoad = null; w.deload = false; }
    w.skillSetWeights = buildSkillSetWeights(w.skillSetReps.length, w.suggestedLoad);
    w.skillLoads = bw ? [] : buildSkillLoads(w.skillTplText);
    w.rpe = null;
  } else if(section==='wod'){
    let movementPool = movementPoolFor(w.type);
    movementPool = knownSkillFilter(movementPool);
    const alloc = allocateTime(state.timeAvailable, w.type);
    const catalog = WOD_FORMAT_CATALOG[w.type];
    const formatId = catalog[Math.floor(Math.random()*catalog.length)];
    const skillPattern = w.skillLiftKey ? LIFT_PATTERNS[w.skillLiftKey] : null;
    const recentTally = recentPatternTally(w.type, 2);
    const recentDominant = Object.keys(recentTally).sort((a,b)=>recentTally[b]-recentTally[a])[0] || null;
    const avoidPatterns = new Set([skillPattern, recentDominant].filter(Boolean));
    currentAvoidPatterns = avoidPatterns.size ? avoidPatterns : null;
    const rerollPlan = lookBackGoals(movementPool);
    currentPreferPatterns = rerollPlan ? new Set(rerollPlan.gaps) : null;
    const built = WOD_FORMAT_DEFS[formatId]({pool:movementPool, type:w.type, volume:w.volumeUsed||1, wodMinutes: alloc?alloc.wod:null, mode: alloc ? alloc.mode : null});
    currentAvoidPatterns = null; currentPreferPatterns = null;
    w.formatId = formatId;
    w.format = built.formatDisplay;
    w.wodMovements = built.movements;
    w.wodTimerSpec = built.timerSpec;
    w.movements = w.wodMovements.map(m=>m.name);
    w.wodRpe = null;
    w.wodPerformance = {};
    w.rxStatus = 'rx';
    w.wodNotes = '';
  } else if(section==='core'){
    const extraPool = extraPoolFor(w.extraKind || 'core', w.type, w.skillLiftKey);
    let choice = extraPool.find(c=>c.text===w.core) || extraPool[0];
    if(extraPool.length>1){ do{ choice = extraPool[Math.floor(Math.random()*extraPool.length)]; } while(choice.text===w.core); }
    w.core = choice.text;
    w.coreTimer = choice.timer || null;
  }
  render();
}

function adjustSets(section, delta){
  const w = state.currentWorkout;
  if(!w) return;
  if(section==='skill' && w.skillSetReps){
    if(!w.skillSetWeights) w.skillSetWeights = buildSkillSetWeights(w.skillSetReps.length, w.suggestedLoad);
    if(delta>0 && w.skillSetReps.length<12){
      const lastReps = w.skillSetReps[w.skillSetReps.length-1];
      w.skillSetReps.push(lastReps === undefined ? null : lastReps);
      w.skillSetWeights.push(w.skillSetWeights[w.skillSetWeights.length-1] ?? w.suggestedLoad ?? 0);
    } else if(delta<0 && w.skillSetReps.length>1){
      w.skillSetReps.pop();
      w.skillSetWeights.pop();
    }
    if(w.skillTimer) w.skillTimer.totalRounds = w.skillSetReps.length;
    w.skillTplText = updateSkillSchemeText(w.skillTplText, w.skillSetReps);
    w.suggestedLoad = w.skillSetWeights[w.skillSetWeights.length-1];
  }
  render();
}

function mkBtn(label, cls, onclick, iconSvg){

    b.classList.add('gw-btn-with-icon');

    b.textContent = label;
  }
  b.onclick = onclick;
  return b;
}

async function logWorkout(){
  const w = state.currentWorkout;
  if(!w) return;
  try{
    if(w.skillLiftKey && w.suggestedLoad){
      state.weights[w.skillLiftKey] = w.suggestedLoad;
    }
    (w.skillLoads || []).forEach(item=>{ state.weights['load:'+item.key] = item.load; });
    if((w.skillLiftKey && w.suggestedLoad) || (w.skillLoads && w.skillLoads.length)) await saveWeights();
    if(w.wodRpe && !w.isBenchmark){
      const adj = VOLUME_ADJUST[w.wodRpe] ?? 0;
      state.volume[w.type] = clamp((state.volume[w.type] || 1.0) + adj, 0.7, 1.4);
      await saveVolume();
    }
    let prMessage = null, isPR = false;
    if(w.isBenchmark && !(w.wodPerformance && w.wodPerformance.stoppedAt)){
      const benchmark = BENCHMARKS.find(b=>b.name===w.benchmarkName);
      const result = await recordBenchmarkResult(benchmark, w.wodPerformance);
      isPR = result.isPR;
      prMessage = result.message;
    }
    if(w.wodPerformance && w.wodPerformance.rounds != null){
      const totalReps = computeAmrapTotalReps(w);
      if(totalReps != null) w.wodPerformance.totalReps = totalReps;
    }
    state.history.push({
      date: Date.now(), type: w.type, warmup: w.warmup, skillTplText: w.skillTplText,
      liftKey: w.skillLiftKey, loggedLoad: w.suggestedLoad || null, rpe: w.rpe || null,
      wodRpe: w.wodRpe || null, volumeUsed: w.volumeUsed || 1.0,
      format: w.format, movements: w.movements, movementNames: w.movements, core: w.core, extraKind: w.extraKind, bw: w.bw,
      sectionsDone: w.sectionsDone || null, wodPerformance: w.wodPerformance || null,
      isBenchmark: w.isBenchmark || false, benchmarkName: w.benchmarkName || null, isPR,
      rxStatus: w.rxStatus || null, notes: (w.wodNotes || '').trim()
    });
    await saveHistory();
    toast(prMessage || ('Logged. Next ' + DAY_TYPES.find(d=>d.key===w.type).label + ' session will build on this.'));
    focusStopTicking();
    state.currentWorkout = null;
    state.timeAvailable = null; // Shorter is a one-time choice for one session
    document.getElementById('gw-time-select').value = '';
    document.getElementById('gw-timebanner').style.display = 'none';
    render();
  }catch(err){
    console.error('logWorkout failed', err);
    toast('Something went wrong saving — please try again.');
  }
}

async function saveActivity(){
  const d = activityDraft;
  if(!d || !d.intensity) return;
  if(d.activity==='Sally Up Sally Down' && !d.exercise) return;
  try{
    let activityName = d.activity==='Other' && d.custom.trim() ? d.custom.trim() : d.activity;
    if(d.activity==='Sally Up Sally Down') activityName = `Sally Up Sally Down (${d.exercise})`;
    const mappedType = ACTIVITY_FOCUS_MAP[d.activity] || null;
    state.history.push({
      date: Date.now(), kind:'external', activity: activityName, mappedType,
      duration: d.duration, intensity: d.intensity, notes: d.notes || ''
    });
    await saveHistory();
    toast('Activity logged.');
    activityDraft = null;
    state.showActivityForm = false;
    renderLogPage();
    if(state_page==='wod') render(); // refresh recommendation/coach notes if visible
  }catch(err){
    console.error('saveActivity failed', err);
    toast('Something went wrong saving — please try again.');
  }
}

function buildSparkline(values, w, h){
  w = w || 160; h = h || 34;
  if(values.length<2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const stepX = w/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = i*stepX;
    const y = h - ((v-min)/range)*h*0.85 - h*0.075;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <polyline points="${pts}" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// re-expresses a bodyweight value under the other unit when the toggle is switched, so the number
// stays meaningful instead of just relabeling — not used for any calculation elsewhere in the app
function convertBodyweight(value, fromUnit, toUnit){
  if(value==null || fromUnit===toUnit) return value;
  return fromUnit==='lb' ? Math.round(value/2.20462) : Math.round(value*2.20462);
}

// everything this app saves lives on this device only (localStorage, under 'garage-wod-*'). That's
// what survives app updates, but it does NOT survive deleting the Home Screen app or moving to a
// new phone/browser — a copy-paste backup is the way across.
async function buildBackup(){
  const listing = await window.storage.list('garage-wod-');
  const data = {};
  for(const k of (listing && listing.keys) || []){
    const item = await window.storage.get(k);
    if(item && item.value != null) data[k] = item.value;
  }
  return JSON.stringify({app:'wodshed', version:1, exportedAt:new Date().toISOString(), data});
}

    const entries = parsed && parsed.app==='wodshed' && parsed.data && typeof parsed.data==='object' ? Object.entries(parsed.data).filter(([k])=>k.startsWith('garage-wod-')) : [];
    if(!entries.length){ toast("That doesn't look like a backup."); return; }

function weekStart(ts){
  const d = new Date(ts);
  const day = d.getDay();
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d);
  monday.setDate(d.getDate()+diffToMonday);
  monday.setHours(0,0,0,0);
  return monday.getTime();
}
